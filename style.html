<style>
    :root { 
        --bg-color: #000; 
        --panel-color: #1e1e1e; 
        --accent-color: #4e9af1; 
        --success-color: #34a853; 
        --text-color: #e0e0e0; 
        --sidebar-width: 350px;
        --sidebar-height: 300px;
    }

    /* ========================= */
    /* LIGHT MODE */
    /* ========================= */
    body.light-mode {
        --bg-color: #f0f0f0;
        --panel-color: #ffffff;
        --text-color: #333333;
        --accent-color: #2b5fa1;
    }

    /* ========================= */
    /* RUSTIC MODE 2.0 */
    /* ========================= */
    body.rustic-mode {
        --bg-color: #1a120d;
        --panel-color: #e6d6b8;
        --text-color: #f4e9d8;
        --accent-color: #8b5a2b;
        --success-color: #6b8e23;

        font-family: "Cinzel", "Garamond", serif;

        background:
            radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(to bottom, #1a120d, #0e0a07);

        background-size: 3px 3px, cover;
    }

    /* Vinheta cinematográfica */
    body.rustic-mode::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
            ellipse at center,
            transparent 60%,
            rgba(0,0,0,0.6) 100%
        );
        z-index: 1;
    }

    body, html { 
        margin: 0; 
        padding: 0; 
        height: 100%; 
        width: 100%; 
        overflow: hidden; 
        background-color: var(--bg-color); 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        color: var(--text-color); 
        transition: background 0.3s; 
    }
    
    #main-wrapper { 
        width: 100vw; 
        height: 100vh; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        overflow: auto; 
        background: var(--bg-color); 
        position: relative;
        z-index: 2;
    }

    #map-container { 
        position: relative; 
        display: inline-block; 
        line-height: 0; 
        cursor: crosshair; 
    }

    #map-image, #map-video { 
        display: block; 
        max-width: none; 
    }
    
    #grid-canvas, #ui-canvas { 
        position: absolute; 
        top: 0; 
        left: 0; 
        pointer-events: none; 
    }

    #grid-canvas { z-index: 5; }
    #ui-canvas { z-index: 10; }

    /* ========================= */
    /* SIDEBAR */
    /* ========================= */

    #sidebar { 
        position: fixed; 
        background: var(--panel-color); 
        box-shadow: 0 0 20px rgba(0,0,0,0.5); 
        transition: all 0.3s ease-in-out; 
        z-index: 100; 
        padding: 20px; 
        box-sizing: border-box; 
        overflow-y: auto;
    }

    /* Rustic Sidebar Premium */
    body.rustic-mode #sidebar {
        background:
            linear-gradient(#e6d6b8, #d5c3a0);

        color: #2b1f16;

        border: 4px solid #6e4b2a;

        box-shadow:
            inset 0 0 40px rgba(0,0,0,0.35),
            0 0 40px rgba(0,0,0,0.7);
    }

    #sidebar.right { right: 0; top: 0; width: var(--sidebar-width); height: 100%; border-left: 2px solid var(--accent-color); }
    #sidebar.left { left: 0; top: 0; width: var(--sidebar-width); height: 100%; border-right: 2px solid var(--accent-color); }
    #sidebar.top { left: 0; top: 0; width: 100%; height: var(--sidebar-height); border-bottom: 2px solid var(--accent-color); display: flex; flex-wrap: wrap; gap: 20px; }
    #sidebar.bottom { left: 0; bottom: 0; width: 100%; height: var(--sidebar-height); border-top: 2px solid var(--accent-color); display: flex; flex-wrap: wrap; gap: 20px; }

    #sidebar.right.closed { transform: translateX(100%); }
    #sidebar.left.closed { transform: translateX(-100%); }
    #sidebar.top.closed { transform: translateY(-100%); }
    #sidebar.bottom.closed { transform: translateY(100%); }

/* ========================= */
/* TOGGLE BUTTON PREMIUM */
/* ========================= */

.toggle-btn { 
    position: fixed; 
    top: 15px;

    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    color: var(--accent-color);

    border: 2px solid var(--accent-color);
    border-radius: 12px;

    font-size: 20px;
    cursor: pointer;

    box-shadow:
        0 6px 16px rgba(0,0,0,0.6),
        inset 0 1px 3px rgba(255,255,255,0.05);

    transition: all 0.25s ease;
    z-index: 110;
}

/* BOTÃO SEGUE A SIDEBAR */

.toggle-btn.sidebar-right {
    right: calc(var(--sidebar-width) + 15px);
    left: auto;
    top: 15px;
    bottom: auto;
}

.toggle-btn.sidebar-left {
    left: calc(var(--sidebar-width) + 15px);
    right: auto;
    top: 15px;
    bottom: auto;
}

.toggle-btn.sidebar-top {
    top: calc(var(--sidebar-height) + 15px);
    right: 15px;
    left: auto;
    bottom: auto;
}

.toggle-btn.sidebar-bottom {
    bottom: calc(var(--sidebar-height) + 15px);
    top: auto;
    right: 15px;
    left: auto;
}

.toggle-btn:hover {
    transform: translateY(-2px);
    box-shadow:
        0 10px 20px rgba(0,0,0,0.8),
        inset 0 1px 3px rgba(255,255,255,0.08);
}

.toggle-btn:active {
    transform: translateY(1px);
    box-shadow:
        inset 0 4px 10px rgba(0,0,0,0.8);
}

/* LIGHT MODE */
body.light-mode .toggle-btn {
    background: linear-gradient(145deg, #ffffff, #e6e6e6);
    color: var(--accent-color);
    border: 2px solid var(--accent-color);
}

/* RUSTIC MODE */
body.rustic-mode .toggle-btn {
    background: linear-gradient(#c9b28e, #a88d6a);
    border: 3px solid #6e4b2a;
    color: #2b1f16;
    border-radius: 50%;

    box-shadow:
        inset 0 3px 6px rgba(255,255,255,0.3),
        0 6px 14px rgba(0,0,0,0.6);
}

    /* ========================= */
    /* CATEGORY */
    /* ========================= */

    .category { 
        margin-bottom: 20px; 
        border: 1px solid rgba(128,128,128,0.2); 
        padding: 12px; 
        border-radius: 8px; 
        min-width: 280px; 
        flex: 1; 
    }

    body.rustic-mode .category {
        background: rgba(60,40,25,0.95);
        border: 3px solid #6e4b2a;
        border-radius: 10px;
        box-shadow:
            inset 0 0 20px rgba(0,0,0,0.6),
            0 4px 14px rgba(0,0,0,0.6);
        color: #f4e9d8;
    }

    .category-title { 
        font-weight: bold; 
        font-size: 0.85em; 
        text-transform: uppercase; 
        margin-bottom: 10px; 
        padding-bottom: 5px; 
    }

    body.rustic-mode .category-title {
        color: #d7b98c;
        border-bottom: 2px solid #8b5a2b;
        letter-spacing: 1px;
    }

    /* ========================= */
    /* BUTTONS */
    /* ========================= */

    .btn-full { 
        width: 100%; 
        background: var(--accent-color); 
        color: white; 
        border: none; 
        padding: 10px; 
        margin-top: 8px; 
        cursor: pointer; 
        border-radius: 4px; 
        font-weight: bold; 
        text-transform: uppercase; 
        font-size: 0.7em; 
    }

    .btn-save { background: var(--success-color); }

    body.rustic-mode .btn-full {
        background: linear-gradient(#9a8466, #6b5a44);
        color: #f4e9d8;
        border: 2px solid #3b2f22;
        box-shadow:
            inset 0 2px 4px rgba(255,255,255,0.2),
            0 4px 10px rgba(0,0,0,0.7);
        text-transform: none;
        letter-spacing: 1px;
    }

    body.rustic-mode .btn-full:hover {
        filter: brightness(1.1);
    }

    body.rustic-mode .btn-full:active {
        transform: translateY(2px);
        box-shadow:
            inset 0 4px 8px rgba(0,0,0,0.8);
    }

    /* ========================= */
    /* INPUTS */
    /* ========================= */

    label { 
        display: block; 
        font-size: 0.75em; 
        margin-bottom: 3px; 
        opacity: 0.8; 
    }

    input, select { 
        width: 100%; 
        background: rgba(128,128,128,0.1); 
        border: 1px solid rgba(128,128,128,0.3); 
        color: var(--text-color); 
        padding: 6px; 
        border-radius: 4px; 
        box-sizing: border-box; 
        font-size: 0.9em; 
    }

    body.rustic-mode input,
    body.rustic-mode select {
        background: #2b2018;
        border: 2px solid #6e4b2a;
        color: #f4e9d8;
    }

    .drive-list { 
        margin-top: 8px; 
        max-height: 100px; 
        overflow-y: auto; 
        background: rgba(0,0,0,0.05); 
        border-radius: 4px; 
    }

    .drive-item { 
        padding: 6px; 
        border-bottom: 1px solid rgba(128,128,128,0.1); 
        cursor: pointer; 
        font-size: 0.8em; 
    }

/* ========================= */
/* SLIDER PERSONALIZADO */
/* ========================= */

input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 5px;
    background: #444;
    outline: none;
}

/* Trilho (Chrome, Edge, Safari) */
input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 5px;
    background: linear-gradient(to right, #666, #888);
}

/* Bolinha (thumb) */
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent-color);
    cursor: pointer;
    margin-top: -5px;
    border: 2px solid #222;
}

/* Firefox */
input[type="range"]::-moz-range-track {
    height: 6px;
    border-radius: 5px;
    background: linear-gradient(to right, #666, #888);
}

input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent-color);
    border: 2px solid #222;
    cursor: pointer;
}

/* ========================= */
/* RUSTIC SLIDER DOURADO */
/* ========================= */

body.rustic-mode input[type="range"]::-webkit-slider-runnable-track {
    background: linear-gradient(to right, #5a3d21, #8b5a2b);
}

body.rustic-mode input[type="range"]::-webkit-slider-thumb {
    background: linear-gradient(#e0b96e, #b8860b);
    border: 2px solid #5a3d21;
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
}

body.rustic-mode input[type="range"]::-moz-range-track {
    background: linear-gradient(to right, #5a3d21, #8b5a2b);
}

body.rustic-mode input[type="range"]::-moz-range-thumb {
    background: linear-gradient(#e0b96e, #b8860b);
    border: 2px solid #5a3d21;
}

/* ========================= */
/* TOKEN UI */
/* ========================= */

#token-context-menu .menu-item {
    padding: 6px;
    cursor: pointer;
    color: #eee;
    font-size: 13px;
}

#token-context-menu .menu-item:hover {
    background: #333;
}
</style>
