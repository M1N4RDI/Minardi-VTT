<script>
// ============================================================
// MINARDI VTT — LightPlugin
// light-wall.html — Sistema de Paredes
//
// Suporta:
//  - Desenhar linha (clique → clique)
//  - Selecionar parede
//  - Arrastar vértice individualmente
//  - Apagar parede (clique direito ou modo erase)
// ============================================================

console.log("light-wall carregado");

window.LightPlugin = window.LightPlugin || {};

LightPlugin.Wall = {

  _drawing:      false,
  _drawStart:    null,
  _selected:     null,   // { wallId, pointIndex } | null
  _draggingVtx:  false,

  VERTEX_RADIUS: 7,

  init() {
    console.log("LightPlugin.Wall INIT");
    this._bindEvents();
  },

  _bindEvents() {
    const map = document.getElementById("map-container");
    if (!map) return;

    map.addEventListener("mousedown", e => {
      if (!this._isActive()) return;
      const fn  = LightPlugin.Control.state.fn;
      const pos = this._pos(e);

      if (e.button === 2) {
        e.preventDefault();
        this._eraseAt(pos);
        e.stopPropagation(); return;
      }

      if (fn === "draw")   this._startDraw(pos);
      if (fn === "select") this._startSelect(pos);
      if (fn === "erase")  this._eraseAt(pos);
      e.stopPropagation();
    }, true);

    map.addEventListener("mousemove", e => {
      if (!this._isActive()) return;
      const pos = this._pos(e);
      if (this._drawing)     this._updateDraw(pos);
      if (this._draggingVtx) this._updateVtxDrag(pos);
    }, true);

    map.addEventListener("mouseup", e => {
      if (!this._isActive()) return;
      const pos = this._pos(e);
      if (this._drawing)     this._endDraw(pos);
      if (this._draggingVtx) this._endVtxDrag();
    }, true);

    map.addEventListener("contextmenu", e => {
      if (!this._isActive()) return;
      e.preventDefault();
    }, true);

    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && this._drawing) {
        this._drawing = false;
        LightPlugin.Canvas.clearWallPreview();
      }
    });
  },

  _isActive() {
    return VTTMode.is("lighting") &&
           LightPlugin.Control.state.cat === "walls" &&
           LightPlugin.Model.settings.enabled;
  },

  // ---- DESENHO ----

  _startDraw(pos) {
    this._drawing   = true;
    this._drawStart = pos;
  },

  _updateDraw(pos) {
    LightPlugin.Canvas.drawWallPreview(
      this._drawStart.x, this._drawStart.y,
      pos.x, pos.y
    );
  },

  _endDraw(pos) {
    this._drawing = false;
    LightPlugin.Canvas.clearWallPreview();

    const dx = pos.x - this._drawStart.x;
    const dy = pos.y - this._drawStart.y;
    if (Math.hypot(dx, dy) < 5) return;

    LightPlugin.Model.addWall(
      [{ x: this._drawStart.x, y: this._drawStart.y },
       { x: pos.x, y: pos.y }]
    );
    LightPlugin.Canvas.redraw();
    LightPlugin.UI.refreshLists();
  },

  // ---- SELEÇÃO / ARRASTE DE VÉRTICE ----

  _startSelect(pos) {
    // Verifica se clicou em um vértice
    const vtx = this._hitVertex(pos);
    if (vtx) {
      this._selected    = vtx;
      this._draggingVtx = true;
      LightPlugin.UI.refreshLists();
      return;
    }

    // Verifica se clicou em uma parede
    const wall = this._hitWall(pos);
    this._selected = wall ? { wallId: wall.id, pointIndex: null } : null;
    LightPlugin.Canvas.redraw();
    LightPlugin.UI.refreshLists();
    LightPlugin.UI.showObjectProperties(wall);
  },

  _updateVtxDrag(pos) {
    if (!this._selected) return;
    LightPlugin.Model.updateWallPoint(
      this._selected.wallId,
      this._selected.pointIndex,
      pos.x, pos.y
    );
    LightPlugin.Canvas.redraw();
  },

  _endVtxDrag() {
    this._draggingVtx = false;
    LightPlugin.Model._save();
  },

  // ---- APAGAR ----

  _eraseAt(pos) {
    // Vértice primeiro, depois linha inteira
    const vtx = this._hitVertex(pos);
    if (vtx) {
      // Parede tem apenas 2 pontos: remove a parede toda
      LightPlugin.Model.removeWall(vtx.wallId);
    } else {
      const wall = this._hitWall(pos);
      if (wall) LightPlugin.Model.removeWall(wall.id);
    }
    this._selected = null;
    LightPlugin.Canvas.redraw();
    LightPlugin.UI.refreshLists();
  },

  // ---- HIT TESTS ----

  _hitVertex(pos) {
    const r = this.VERTEX_RADIUS;
    for (const w of LightPlugin.Model.wallObjects) {
      for (let i = 0; i < w.points.length; i++) {
        const p = w.points[i];
        if (Math.hypot(pos.x - p.x, pos.y - p.y) <= r) {
          return { wallId: w.id, pointIndex: i };
        }
      }
    }
    return null;
  },

  _hitWall(pos) {
    const THRESHOLD = 8;
    for (const w of [...LightPlugin.Model.wallObjects].reverse()) {
      const pts = w.points;
      for (let i = 0; i < pts.length - 1; i++) {
        if (this._distToSeg(pos, pts[i], pts[i+1]) < THRESHOLD) return w;
      }
    }
    return null;
  },

  _distToSeg(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
    const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  },

  _pos(e) {
    const rect = document.getElementById("map-container").getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  },

  getSelected() { return this._selected; }
};
</script>
