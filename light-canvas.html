<script>
// ============================================================
// MINARDI VTT — LightPlugin
// light-canvas.html — Camadas e renderização
//
// Camadas (z-index sobre map-container):
//   #light-fog-canvas    z:9  — fog of war + luz renderizados
//   #light-wall-canvas   z:11 — preview de parede (só mestre)
// ============================================================

console.log("light-canvas carregado");

window.LightPlugin = window.LightPlugin || {};

LightPlugin.Canvas = {

  _fog:  null,   // canvas principal de iluminação
  _wall: null,   // canvas de preview/edição de paredes
  _obs:  null,

  init() {
    console.log("LightPlugin.Canvas INIT");
    this._build();
    this._sync();
    this._obs = new ResizeObserver(() => this._sync());
    const map = document.getElementById("map-container");
    if (map) this._obs.observe(map);
    window.addEventListener("resize", () => this._sync());
  },

  _build() {
    const map = document.getElementById("map-container");
    if (!map) return;

    this._fog  = this._make("light-fog-canvas",  9,  false);
    this._wall = this._make("light-wall-canvas", 11, false);

    if (!document.getElementById("light-fog-canvas"))  map.appendChild(this._fog);
    if (!document.getElementById("light-wall-canvas")) map.appendChild(this._wall);
  },

  _make(id, z, autoEvents) {
    const existing = document.getElementById(id);
    if (existing) return existing;

    const c = document.createElement("canvas");
    c.id = id;
    c.style.cssText = `
      position:absolute;top:0;left:0;
      width:100%;height:100%;
      pointer-events:${autoEvents ? "auto" : "none"};
      z-index:${z};
    `;
    return c;
  },

  _sync() {
    const map = document.getElementById("map-container");
    if (!map) return;
    const w = map.clientWidth || map.offsetWidth;
    const h = map.clientHeight || map.offsetHeight;
    if (!w || !h) { requestAnimationFrame(() => this._sync()); return; }

    [this._fog, this._wall].forEach(c => {
      if (c) { c.width = w; c.height = h; }
    });

    LightPlugin.Canvas.redraw();
  },

  getFog()  { return this._fog; },
  getWall() { return this._wall; },

  // ============================================================
  // REDRAW PRINCIPAL — chamado sempre que algo muda
  // ============================================================

  redraw() {
    const fog = this._fog;
    if (!fog) return;

    const ctx = fog.getContext("2d");
    const W   = fog.width, H = fog.height;
    const m   = LightPlugin.Model;

    ctx.clearRect(0, 0, W, H);
    if (!m.settings.enabled) return;

    const tokenSources = m.getTokenLightSources();
    const hasDarkness = m.darknessObjects.length > 0;
    const hasLightSource = m.lightObjects.filter(o => o.lightType === "source").length > 0 || tokenSources.length > 0;
    
    // Se não há nada (nem escuridão manual, nem fontes de luz), mapa fica totalmente visível
    if (!hasDarkness && !hasLightSource) return;

    // ---- 1. Preenche tudo com escuridão ----
    // (mas só se há objetos de escuridão manual OU há fontes de luz ativas)
    ctx.fillStyle = `rgba(0,0,0,${m.settings.fogOpacity})`;
    ctx.fillRect(0, 0, W, H);

    // ---- 2. Corta áreas iluminadas (Luz tipo "cut" = sem raycasting) ----
    m.lightObjects
      .filter(o => o.lightType === "cut")
      .forEach(o => this._cutShape(ctx, o));

    // ---- 3. Fontes de luz com raycasting ----
    const walls   = m.wallObjects;
    const allSrcs = [
      ...m.lightObjects.filter(o => o.lightType === "source" && !o.tokenId),
      ...m.getTokenLightSources()
    ];

    allSrcs.forEach(src => {
      const size       = window.VTTGrid?.size || 50;
      const lightPx    = (src.lightRadius || 6)  * size;
      const dimPx      = (src.dimRadius   || 12) * size;
      const origin     = { x: src.x, y: src.y };

      // Penumbra (dim) — corte parcial
      const dimPoly = LightPlugin.Raycast.compute(origin, dimPx, walls, W, H);
      this._cutPolyAlpha(ctx, dimPoly, m.settings.dimOpacity);

      // Luz plena — corte total
      const lightPoly = LightPlugin.Raycast.compute(origin, lightPx, walls, W, H);
      this._cutPoly(ctx, lightPoly);
    });

    // ---- 4. Reaplica escuridão manual por cima ----
    // Objetos de escuridão manual têm prioridade sobre fontes de luz
    m.darknessObjects.forEach(o => this._fillShape(ctx, o, m.settings.fogOpacity));

    // ---- 6. Overlay especial do mestre ----
    if (m.settings.masterReveal) {
      ctx.clearRect(0, 0, W, H);
      // Redesenha fog translúcido para mestre enxergar limites
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.fillRect(0, 0, W, H);
      // Mostra paredes
      this._drawWallLines(ctx);
    } else if (m.settings.showWalls) {
      this._drawWallLines(ctx);
    }
  },

  // ---- Corta um shape do fog completamente (destination-out) ----
  _cutShape(ctx, o) {
    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,1)";
    this._tracePath(ctx, o);
    ctx.fill();
    ctx.restore();
  },

  // ---- Corta polígono de raycasting completamente ----
  _cutPoly(ctx, pts) {
    if (!pts.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,1)";
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    pts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  },

  // ---- Corta polígono parcialmente (penumbra) ----
  _cutPolyAlpha(ctx, pts, dimOpacity) {
    if (!pts.length) return;
    // Penumbra: reduz a opacidade daquela área
    // Estratégia: primeiro remove totalmente, depois repinta com alpha reduzido
    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = `rgba(0,0,0,${1 - dimOpacity})`;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    pts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  },

  // ---- Preenche shape (escuridão manual por cima) ----
  _fillShape(ctx, o, opacity) {
    ctx.save();
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(0,0,0,${opacity})`;
    this._tracePath(ctx, o);
    ctx.fill();
    ctx.restore();
  },

  // ---- Traça o path de um objeto (rect ou circle) ----
  _tracePath(ctx, o) {
    ctx.beginPath();
    if (o.type === "rect") {
      ctx.rect(o.x, o.y, o.w, o.h);
    } else if (o.type === "circle") {
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    }
  },

  // ---- Desenha linhas de parede ----
  _drawWallLines(ctx) {
    const walls = LightPlugin.Model.wallObjects;
    if (!walls.length) return;
    ctx.save();
    ctx.strokeStyle = "rgba(255,80,80,0.75)";
    ctx.lineWidth   = 2;
    ctx.lineCap     = "round";
    ctx.lineJoin    = "round";
    walls.forEach(w => {
      const pts = w.points;
      if (pts.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();

      // Vértices editáveis
      pts.forEach(p => {
        ctx.fillStyle = "rgba(255,120,50,0.9)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
    });
    ctx.restore();
  },

  clearWallPreview() {
    const c = this._wall;
    if (c) c.getContext("2d").clearRect(0, 0, c.width, c.height);
  },

  drawWallPreview(x1, y1, x2, y2) {
    const c = this._wall;
    if (!c) return;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.save();
    ctx.strokeStyle = "rgba(255,140,60,0.9)";
    ctx.lineWidth   = 2;
    ctx.lineCap     = "round";
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);
    [[x1,y1],[x2,y2]].forEach(([x,y]) => {
      ctx.fillStyle = "rgba(255,140,60,0.9)";
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }
};
</script>
