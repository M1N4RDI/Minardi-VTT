<script>
/* ============================================================
   AudioPlugin.Player — VERSÃO CORRIGIDA (compatível com a API
   real esperada por audio-control.html e audio-ui.html)
   ------------------------------------------------------------
   audio-control.html já existente chama:
     - Player.playMusic(dataUrl, fade)       // recebe URL PRONTA
     - Player._loadAudioById(fileId, cb)      // converte id -> dataUrl
     - Player.startAmbience(category, url, volume)
     - Player.playEffect(dataUrl)
   audio-ui.html já existente chama:
     - Player.setAmbienceVolume(category, value)
     - Player.isPaused() / getCurrentTime() / getDuration() / seekTo()
     - Player.stopMusic() / pauseMusic()

   Por isso esta versão NÃO resolve URL pública (uc?export=view) —
   ela resolve para uma dataUrl base64 via RPC getAudioFileAsDataUrl,
   chamado uma única vez por arquivo e cacheado em memória
   (_dataUrlCache) para não repetir o RPC se a mesma faixa for
   tocada de novo na mesma sessão.

   Isso é uma migração mais conservadora que a "URL pública direta":
   ainda usa base64, mas SOB DEMANDA (um arquivo por vez, só quando
   tocado) em vez de escanear a biblioteca inteira de uma vez. Resolve
   o gargalo original (scanAudioLibrary não trava mais o GAS), mantendo
   compatibilidade total com o que audio-control.html/audio-ui.html
   já esperam. Migrar para URL pública de verdade é um passo
   posterior e mais simples assim que tudo estiver estável de novo.
   ============================================================ */

window.AudioPlugin = window.AudioPlugin || {};

AudioPlugin.Player = {

  _musicEl: null,
  _ambienceEls: {},   // { categoryName: <audio> }
  _effectsPool: [],
  _crossfadeTimer: null,
  _dataUrlCache: {},  // { fileId: dataUrl } — evita RPC repetido

  init() {
    this._musicEl = new Audio();
    this._musicEl.preload = "auto";
    this._attachTimeUpdate();

    for (let i = 0; i < 8; i++) {
      this._effectsPool.push(new Audio());
    }

    console.log("[AudioPlugin.Player] init OK (modo id sob demanda)");
  },

  /**
   * Resolve um fileId do Drive para dataUrl base64, via RPC.
   * Usado por audio-control.html sempre que uma track só tem
   * `.id` (sem `.url`). Cacheia o resultado em memória.
   */
  _loadAudioById(fileId, callback) {
    if (!fileId) {
      console.error("[AudioPlugin.Player] _loadAudioById chamado sem fileId.");
      return;
    }
    if (this._dataUrlCache[fileId]) {
      callback(this._dataUrlCache[fileId]);
      return;
    }
    google.script.run
      .withSuccessHandler(result => {
        if (!result || result.error || !result.dataUrl) {
          console.error("[AudioPlugin.Player] Falha ao carregar áudio:", result && result.error);
          return;
        }
        AudioPlugin.Player._dataUrlCache[fileId] = result.dataUrl;
        callback(result.dataUrl);
      })
      .withFailureHandler(err => {
        console.error("[AudioPlugin.Player] Falha RPC getAudioFileAsDataUrl:", err.message);
      })
      .getAudioFileAsDataUrl(fileId);
  },

  playMusic(dataUrl, fade) {
    if (!dataUrl) {
      console.error("[AudioPlugin.Player] playMusic chamado sem dataUrl.");
      return;
    }

    if (fade && !this._musicEl.paused) {
      this._crossfade(dataUrl);
    } else {
      this._musicEl.src = dataUrl;
      this._musicEl.currentTime = 0;
      this._musicEl.play().catch(e => console.warn("[Player] autoplay bloqueado:", e));
    }
  },

  _crossfade(newUrl) {
    const oldEl = this._musicEl;
    const newEl = new Audio(newUrl);
    const steps = 30;
    const stepTime = 100; // 30 * 100ms = 3s

    newEl.volume = 0;
    newEl.play().catch(e => console.warn("[Player] crossfade play bloqueado:", e));

    let i = 0;
    if (this._crossfadeTimer) clearInterval(this._crossfadeTimer);

    this._crossfadeTimer = setInterval(() => {
      i++;
      const ratio = i / steps;
      oldEl.volume = Math.max(0, 1 - ratio) * AudioPlugin.Player._effectiveVolume("music");
      newEl.volume = Math.min(1, ratio) * AudioPlugin.Player._effectiveVolume("music");

      if (i >= steps) {
        clearInterval(this._crossfadeTimer);
        oldEl.pause();
        this._musicEl = newEl;
        this._attachTimeUpdate();
      }
    }, stepTime);
  },

  pauseMusic() {
    if (!this._musicEl) return;
    if (this._musicEl.paused) {
      this._musicEl.play().catch(e => console.warn("[Player] play bloqueado:", e));
    } else {
      this._musicEl.pause();
    }
  },

  stopMusic() {
    if (this._musicEl) {
      this._musicEl.pause();
      this._musicEl.currentTime = 0;
    }
  },

  seekTo(ratio) {
    if (this._musicEl && this._musicEl.duration) {
      this._musicEl.currentTime = ratio * this._musicEl.duration;
    }
  },

  startAmbience(category, dataUrl, volume) {
    if (!dataUrl) {
      console.error("[AudioPlugin.Player] startAmbience chamado sem dataUrl:", category);
      return;
    }
    let el = this._ambienceEls[category];
    if (!el) {
      el = new Audio();
      el.loop = true;
      this._ambienceEls[category] = el;
    }
    el.src = dataUrl;
    el.volume = this._scaleVolume(volume != null ? volume : 100);
    el.play().catch(e => console.warn("[Player] ambience autoplay bloqueado:", e));
  },

  setAmbienceVolume(category, value) {
    const el = this._ambienceEls[category];
    if (el) el.volume = this._scaleVolume(value);
  },

  stopAmbience(category) {
    const el = this._ambienceEls[category];
    if (el) {
      el.pause();
      delete this._ambienceEls[category];
    }
  },

  stopAllAmbiences() {
    for (const cat in this._ambienceEls) {
      this._ambienceEls[cat].pause();
    }
    this._ambienceEls = {};
  },

  playEffect(dataUrl) {
    if (!dataUrl) {
      console.error("[AudioPlugin.Player] playEffect chamado sem dataUrl.");
      return;
    }
    const free = this._effectsPool.find(el => el.paused);
    const el = free || this._effectsPool[0];
    el.volume = this._scaleVolume(AudioPlugin.Model.volumes.effects);
    el.src = dataUrl;
    el.currentTime = 0;
    el.play().catch(e => console.warn("[Player] efeito autoplay bloqueado:", e));
  },

  applyVolumes() {
    if (this._musicEl) {
      this._musicEl.volume = this._effectiveVolume("music");
    }
    for (const cat in this._ambienceEls) {
      this._ambienceEls[cat].volume = this._effectiveVolume("ambience");
    }
  },

  /**
   * master × canal, normalizado de 0-100 para 0-1 (HTMLMediaElement.volume).
   */
  _effectiveVolume(channel) {
    const v = AudioPlugin.Model.volumes;
    return (v.master / 100) * (v[channel] / 100);
  },

  _scaleVolume(channelValue0a100) {
    const v = AudioPlugin.Model.volumes;
    return (v.master / 100) * (channelValue0a100 / 100);
  },

  isPaused() {
    return this._musicEl ? this._musicEl.paused : true;
  },

  getCurrentTime() {
    return this._musicEl ? this._musicEl.currentTime : 0;
  },

  getDuration() {
    return this._musicEl ? (this._musicEl.duration || 0) : 0;
  },

  _attachTimeUpdate() {
    this._musicEl.ontimeupdate = () => {
      const d = this._musicEl.duration;
      const t = this._musicEl.currentTime;
      if (d && (d - t) <= 3) {
        AudioPlugin.Control.advancePlaylist();
      }
    };
  }
};
</script>
