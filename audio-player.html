<script>
/* ============================================================
   AudioPlugin.Player — VERSÃO MIGRADA (sem base64)
   ------------------------------------------------------------
   Diferença chave: as funções de play agora recebem o objeto
   track {id, name} (ou apenas o id) em vez de uma url já pronta.
   A resolução da URL acontece aqui, via AudioPlugin.Drive.buildUrl().

   Isso mantém o resto do plugin (Control, UI) quase inalterado:
   eles continuam passando "a track", só que agora ela não tem
   mais o peso de uma string base64 de vários MB.
   ============================================================ */

window.AudioPlugin = window.AudioPlugin || {};

AudioPlugin.Player = {

  _musicEl: null,
  _ambienceEls: {},   // { categoryName: <audio> }
  _effectsPool: [],
  _crossfadeTimer: null,

  init() {
    this._musicEl = new Audio();
    this._musicEl.preload = "auto";
    this._attachTimeUpdate();

    for (let i = 0; i < 8; i++) {
      this._effectsPool.push(new Audio());
    }

    console.log("[AudioPlugin.Player] init OK (modo URL direta)");
  },

  /**
   * Resolve fileId -> URL pública. Aceita tanto um objeto track
   * {id, name} quanto uma string de fileId direto.
   */
  _resolveUrl(trackOrId) {
    const fileId = (typeof trackOrId === "string") ? trackOrId : trackOrId.id;
    return AudioPlugin.Drive.buildUrl(fileId);
  },

  playMusic(track, fade) {
    const url = this._resolveUrl(track);
    if (!url) {
      console.error("[AudioPlugin.Player] track sem id válido:", track);
      return;
    }

    if (fade && !this._musicEl.paused) {
      this._crossfade(url);
    } else {
      this._musicEl.src = url;
      this._musicEl.currentTime = 0;
      this._musicEl.play().catch(e => console.warn("[Player] autoplay bloqueado:", e));
    }
  },

  _crossfade(newUrl) {
    const oldEl = this._musicEl;
    const newEl = new Audio(newUrl);
    const steps = 30;
    const stepTime = 100; // 30 * 100ms = 3s

    newEl.volume = 0;
    newEl.play().catch(e => console.warn("[Player] crossfade play bloqueado:", e));

    let i = 0;
    if (this._crossfadeTimer) clearInterval(this._crossfadeTimer);

    this._crossfadeTimer = setInterval(() => {
      i++;
      const ratio = i / steps;
      oldEl.volume = Math.max(0, 1 - ratio) * AudioPlugin.Model.getEffectiveVolume("music");
      newEl.volume = Math.min(1, ratio) * AudioPlugin.Model.getEffectiveVolume("music");

      if (i >= steps) {
        clearInterval(this._crossfadeTimer);
        oldEl.pause();
        this._musicEl = newEl;
        this._attachTimeUpdate();
      }
    }, stepTime);
  },

  pauseMusic() {
    if (this._musicEl) this._musicEl.pause();
  },

  stopMusic() {
    if (this._musicEl) {
      this._musicEl.pause();
      this._musicEl.currentTime = 0;
    }
  },

  seekTo(ratio) {
    if (this._musicEl && this._musicEl.duration) {
      this._musicEl.currentTime = ratio * this._musicEl.duration;
    }
  },

  startAmbience(category, track, volume) {
    const url = this._resolveUrl(track);
    if (!url) {
      console.error("[AudioPlugin.Player] ambience sem id válido:", track);
      return;
    }

    let el = this._ambienceEls[category];
    if (!el) {
      el = new Audio();
      el.loop = true;
      this._ambienceEls[category] = el;
    }
    el.src = url;
    el.volume = volume != null ? volume : 1;
    el.play().catch(e => console.warn("[Player] ambience autoplay bloqueado:", e));
  },

  stopAmbience(category) {
    const el = this._ambienceEls[category];
    if (el) {
      el.pause();
      delete this._ambienceEls[category];
    }
  },

  stopAllAmbiences() {
    for (const cat in this._ambienceEls) {
      this._ambienceEls[cat].pause();
    }
    this._ambienceEls = {};
  },

  playEffect(track) {
    const url = this._resolveUrl(track);
    if (!url) {
      console.error("[AudioPlugin.Player] efeito sem id válido:", track);
      return;
    }

    const free = this._effectsPool.find(el => el.paused);
    const el = free || this._effectsPool[0];
    el.src = url;
    el.currentTime = 0;
    el.play().catch(e => console.warn("[Player] efeito autoplay bloqueado:", e));
  },

  applyVolumes() {
    if (this._musicEl) {
      this._musicEl.volume = AudioPlugin.Model.getEffectiveVolume("music");
    }
    for (const cat in this._ambienceEls) {
      this._ambienceEls[cat].volume = AudioPlugin.Model.getEffectiveVolume("ambience");
    }
  },

  isPaused() {
    return this._musicEl ? this._musicEl.paused : true;
  },

  getCurrentTime() {
    return this._musicEl ? this._musicEl.currentTime : 0;
  },

  getDuration() {
    return this._musicEl ? (this._musicEl.duration || 0) : 0;
  },

  _attachTimeUpdate() {
    this._musicEl.ontimeupdate = () => {
      const d = this._musicEl.duration;
      const t = this._musicEl.currentTime;
      if (d && (d - t) <= 3) {
        AudioPlugin.Control.advancePlaylist();
      }
    };
  }
};
</script>
