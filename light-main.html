<script>
// ============================================================
// MINARDI VTT — LightPlugin
// light-main.html — Boot
// ============================================================

console.log("light-main carregado");

window.LightPlugin = window.LightPlugin || {};

LightPlugin.boot = function() {
  _waitForLightDOM(function() {
    LightPlugin.Model.init();
    LightPlugin.Canvas.init();
    LightPlugin.Raycast;        // sem init — funções puras
    LightPlugin.Fog.init();
    LightPlugin.Wall.init();
    LightPlugin.Control.init();
    LightPlugin.UI.init();

    // Registra "lighting" como modo válido no VTTMode
    // (VTTMode.set aceita qualquer string — não precisa de registro,
    //  mas adicionamos no mapa de cursor para clareza)
    console.log("LightPlugin: todos os módulos inicializados.");

    // Redesenho inicial se já havia dados salvos
    if (LightPlugin.Model.settings.enabled) {
      LightPlugin.Control.requestRedraw();
    }
  });
};

function _waitForLightDOM(cb) {
  var t = setInterval(function() {
    if (
      document.getElementById("map-container") &&
      window.VTTMode &&
      window.TokenPlugin
    ) {
      clearInterval(t);
      cb();
    }
  }, 150);
}

// Adiciona "drawFogPreview" no Canvas (usado pelo light-fog.html)
// Feito aqui para não criar dependência circular
document.addEventListener("DOMContentLoaded", function() {
  if (window.LightPlugin?.Canvas) return; // já carregado
});

// Patch do Canvas para preview de escuridão (rect/circle durante desenho)
// Injetado aqui pois light-canvas.html não conhece light-fog.html
(function patchCanvasLater() {
  var t = setInterval(function() {
    if (!window.LightPlugin?.Canvas) return;
    clearInterval(t);

    LightPlugin.Canvas.drawFogPreview = function(start, end, fmt) {
      const c = this._wall; // reutiliza o canvas de preview
      if (!c) return;
      const ctx = c.getContext("2d");
      ctx.clearRect(0, 0, c.width, c.height);

      ctx.save();
      ctx.strokeStyle = "rgba(80,80,255,0.7)";
      ctx.fillStyle   = "rgba(0,0,80,0.3)";
      ctx.lineWidth   = 2;
      ctx.setLineDash([5,4]);

      if (fmt === "rect") {
        const x = Math.min(start.x, end.x);
        const y = Math.min(start.y, end.y);
        const w = Math.abs(end.x - start.x);
        const h = Math.abs(end.y - start.y);
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.fill(); ctx.stroke();
      } else if (fmt === "circle") {
        const r = Math.hypot(end.x - start.x, end.y - start.y);
        ctx.beginPath();
        ctx.arc(start.x, start.y, r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }

      ctx.setLineDash([]);
      ctx.restore();
    };
  }, 100);
})();

LightPlugin.boot();
</script>
