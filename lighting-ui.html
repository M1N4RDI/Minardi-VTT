<script>
// lighting-ui.html — UI completa do sistema de iluminação
console.log('lighting-ui carregado');

window.Lighting = window.Lighting || {};

Lighting.UI = {
  initialized: false,
  sidebar:     null,
  toolButtons: {},
  contextMenu: null,

  init() {
    if (this.initialized) return;
    this.initialized = true;

    setTimeout(() => {
      const sidebar = document.getElementById('sidebar');
      if (!sidebar) { setTimeout(() => this.init(), 200); return; }
      this.sidebar = sidebar;
      this._createPanel();

  Lighting.Input.init();
Lighting.Render.init();
this.refresh();

this._startModeObserver();
    }, 500);
  },

  // ── Painel principal ─────────────────────────────────────────
  _createPanel() {
  const cat = document.createElement('div');
cat.className = 'category';
cat.id = 'cat-lighting';

    const title     = document.createElement('div');
    title.className = 'category-title';
    title.innerText = 'Iluminação';
    cat.appendChild(title);

// ===== BOTÃO DE MODO =====

const modeBtn = document.createElement('button');

modeBtn.id = 'lighting-mode-btn';
modeBtn.className = 'mode-btn mode-lighting';
modeBtn.textContent = '💡 ATIVAR ILUMINAÇÃO';

modeBtn.onclick = () => {
  if (window.VTTMode?.setMode) {
    VTTMode.setMode('lighting');
  }
};

modeBtn.onclick = () => {
  console.log('[Lighting] botão clicado');

  if (window.VTTMode?.setMode) {
    VTTMode.setMode('lighting');
  }
};

cat.appendChild(modeBtn);

// registra no VTTMode
if (window.VTTMode) {
  VTTMode._modeBtns = VTTMode._modeBtns || {};
  VTTMode._categoryIds = VTTMode._categoryIds || {};

  VTTMode._modeBtns.lighting = modeBtn;
  VTTMode._categoryIds.lighting = 'cat-lighting';
  console.log('[Lighting] registrado no VTTMode');
console.log(VTTMode._modeBtns);
console.log(VTTMode._categoryIds);
}

    // Ferramentas
    cat.appendChild(this._buildToolsSection());

    // Ações globais
    cat.appendChild(this._buildActionsSection());

    // Parede selecionada (seção dinâmica)
    const wallSection = document.createElement('div');
    wallSection.id    = 'lighting-wall-props-section';
    cat.appendChild(wallSection);

    // Lista de objetos
    cat.appendChild(this._buildListSection());

    // Painel de propriedades de objeto
    cat.appendChild(this._buildPropsSection());

  this.sidebar.appendChild(cat);

  if (typeof initCollapseForCategory === 'function') {
  initCollapseForCategory(cat);
}

// painel sempre visível
cat.style.display = 'block';
  },

  _buildToolsSection() {
    const section = document.createElement('div');
    section.style.marginBottom = '16px';

    const label       = document.createElement('div');
    label.style.cssText = 'font-size:.8em;font-weight:bold;margin-bottom:8px;';
    label.innerText   = 'FERRAMENTAS';
    section.appendChild(label);

    const grid              = document.createElement('div');
    grid.style.cssText      = 'display:grid;grid-template-columns:repeat(5,1fr);gap:6px;';

    const tools = [
      { id: 'select',  icon: '🖱',  title: 'Selecionar' },
      { id: 'rect',    icon: '⬜',  title: 'Retângulo' },
      { id: 'circle',  icon: '⚪',  title: 'Círculo' },
      { id: 'polygon', icon: '⬡',  title: 'Polígono' },
      { id: 'wall',    icon: '🧱',  title: 'Parede (cliques + Enter/dblclique)' },
    ];

    tools.forEach(tool => {
      const btn       = document.createElement('button');
      btn.className   = 'lighting-tool-btn';
      btn.title       = tool.title;
      btn.innerHTML   = tool.icon;
      btn.style.cssText =
        'padding:12px;font-size:1.2em;border:2px solid transparent;' +
        'border-radius:6px;background:rgba(100,100,100,0.3);cursor:pointer;transition:all .2s;';
      btn.addEventListener('click', () => {
        Lighting.Input.setActiveTool(tool.id);
        this._updateToolButtons();
        Lighting.Render.draw();
      });
      this.toolButtons[tool.id] = btn;
      grid.appendChild(btn);
    });

    section.appendChild(grid);

    // Dica de uso para parede
    const tip       = document.createElement('div');
    tip.id          = 'wall-tool-tip';
    tip.style.cssText =
      'font-size:.75em;opacity:.7;margin-top:6px;padding:4px 6px;' +
      'background:rgba(255,150,50,.1);border-radius:4px;display:none;';
    tip.innerText = '🧱 Cliques adicionam vértices. Enter ou duplo-clique finaliza a parede.';
    section.appendChild(tip);

    return section;
  },

  _buildActionsSection() {
    const section = document.createElement('div');
    section.style.marginBottom = '16px';

    const label     = document.createElement('div');
    label.style.cssText = 'font-size:.8em;font-weight:bold;margin-bottom:8px;';
    label.innerText = 'AÇÕES';
    section.appendChild(label);

    const grid      = document.createElement('div');
    grid.style.gap  = '6px';
    grid.style.display = 'grid';

    const coverBtn = this._btn('🌑 Cobrir Mapa', () => {
      Lighting.Model.addObject({
        name: 'Mapa Coberto', shape: 'rect',
        x: 0, y: 0, width: 99999, height: 99999,
      });
      Lighting.Model._save();
      this.refresh();
      Lighting.Render.draw();
    });
    grid.appendChild(coverBtn);

    const fogBtn = this._btn('🌫 Fog of War', () => {
  Lighting.Model.fogEnabled =
    !Lighting.Model.fogEnabled;

  Lighting.Model._save();

  fogBtn.style.opacity =
    Lighting.Model.fogEnabled ? '1' : '0.7';

  Lighting.Render.draw();
});

fogBtn.style.opacity =
  Lighting.Model.fogEnabled ? '1' : '0.7';

grid.appendChild(fogBtn);

  const revealBtn = this._btn('☀ Mostrar Tudo', () => {
  Lighting.Model.masterReveal =
    !Lighting.Model.masterReveal;

  Lighting.Model._save();

  Lighting.Render.draw();

  revealBtn.style.opacity =
    Lighting.Model.masterReveal ? '1' : '0.7';
});

revealBtn.style.opacity =
  Lighting.Model.masterReveal ? '1' : '0.7';
    grid.appendChild(revealBtn);

    section.appendChild(grid);
    return section;
  },

  _buildListSection() {
    const section = document.createElement('div');
    section.style.marginBottom = '16px';

    const label     = document.createElement('div');
    label.style.cssText = 'font-size:.8em;font-weight:bold;margin-bottom:8px;';
    label.innerText = 'OBJETOS';
    section.appendChild(label);

    const list          = document.createElement('div');
    list.id             = 'lighting-object-list';
    list.style.cssText  = 'max-height:200px;overflow-y:auto;font-size:.85em;';
    section.appendChild(list);

    return section;
  },

  _buildPropsSection() {
    const section = document.createElement('div');

    const label     = document.createElement('div');
    label.style.cssText = 'font-size:.8em;font-weight:bold;margin-bottom:8px;';
    label.innerText = 'PROPRIEDADES';
    section.appendChild(label);

    const panel    = document.createElement('div');
    panel.id       = 'lighting-props-panel';
    panel.style.fontSize = '.85em';
    section.appendChild(panel);

    return section;
  },

  // ── Refresh geral ────────────────────────────────────────────
  refresh() {
    this._updateToolButtons();
    this._renderObjectList();
    this._renderProperties();
    this._renderWallProps();
  },

  _updateToolButtons() {
    const active = Lighting.Input.activeTool;

    // Dica de parede
    const tip = document.getElementById('wall-tool-tip');
    if (tip) tip.style.display = active === 'wall' ? 'block' : 'none';

    Object.keys(this.toolButtons).forEach(key => {
      const btn = this.toolButtons[key];
      if (key === active) {
        btn.style.background   = 'rgba(150,200,255,0.6)';
        btn.style.borderColor  = 'rgba(200,230,255,0.8)';
      } else {
        btn.style.background   = 'rgba(100,100,100,0.3)';
        btn.style.borderColor  = 'transparent';
      }
    });
  },

  // ── Lista de objetos + paredes ───────────────────────────────
  _renderObjectList() {
    const listEl = document.getElementById('lighting-object-list');
    if (!listEl) return;
    listEl.innerHTML = '';

    const darkObjs  = Lighting.Model.objects.filter(o => o.mode === 'dark');
    const lightObjs = Lighting.Model.objects.filter(o => o.mode === 'light');

    if (darkObjs.length)  this._listGroup(listEl, '▼ Áreas Escuras',    darkObjs,  'object');
    if (lightObjs.length) this._listGroup(listEl, '▼ Áreas Iluminadas', lightObjs, 'object');
    if (Lighting.Model.walls.length) this._listGroup(listEl, '▼ Paredes', Lighting.Model.walls, 'wall');

    if (!darkObjs.length && !lightObjs.length && !Lighting.Model.walls.length) {
      const empty     = document.createElement('div');
      empty.style.opacity = '0.6';
      empty.innerText = 'Nenhum objeto.';
      listEl.appendChild(empty);
    }
  },

  _listGroup(parent, label, items, type) {
    const group  = document.createElement('div');
    group.style.marginBottom = '8px';

    const header = document.createElement('div');
    header.style.cssText = 'font-weight:bold;font-size:.8em;margin-bottom:4px;';
    header.innerText = label;
    group.appendChild(header);

    items.forEach(item => {
      const isSelected = type === 'wall'
        ? item.id === Lighting.Model.selectedWallId
        : item.id === Lighting.Input.selectedObjectId;

      const row = document.createElement('div');
      row.style.cssText =
        `padding:6px;border-radius:4px;cursor:pointer;font-size:.85em;` +
        `background:${isSelected ? 'rgba(100,150,200,0.3)' : 'transparent'};`;
      row.innerText = item.name || (type === 'wall' ? 'Parede' : 'Objeto');

      row.addEventListener('click', () => {
        if (type === 'wall') {
          Lighting.Input.selectedObjectId = null;
          Lighting.Model.selectWall(item.id);
        } else {
          Lighting.Input.selectedObjectId = item.id;
          Lighting.Model.clearWallSelection();
        }
        this.refresh();
        Lighting.Render.draw();
      });

      row.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (type === 'wall') {
          Lighting.Model.selectWall(item.id);
          this.showWallContextMenu(item.id, { x: e.clientX, y: e.clientY });
        } else {
          Lighting.Input.selectedObjectId = item.id;
          this.showContextMenu(item.id, { x: e.clientX, y: e.clientY });
        }
      });

      group.appendChild(row);
    });

    parent.appendChild(group);
  },

  // ── Propriedades de parede selecionada ───────────────────────
  _renderWallProps() {
    const section = document.getElementById('lighting-wall-props-section');
    if (!section) return;
    section.innerHTML = '';

    const wall = Lighting.Model.getWall(Lighting.Model.selectedWallId);
    if (!wall) return;

    const wrap = document.createElement('div');
    wrap.style.cssText = 'margin-bottom:16px;font-size:.85em;';

    // Título
    const t = document.createElement('div');
    t.style.cssText = 'font-size:.8em;font-weight:bold;margin-bottom:8px;';
    t.innerText = 'PAREDE SELECIONADA';
    wrap.appendChild(t);

    // Nome
    this._propField(wrap, 'Nome', wall.name, val => {
      Lighting.Model.updateWall(wall.id, { name: val });
      Lighting.Model._save();
      this._renderObjectList();
    });

    // Info de vértices
    const info = document.createElement('div');
    info.style.cssText = 'opacity:.7;margin-bottom:8px;';
    info.innerText = `Vértices: ${wall.points.length}  •  Segmentos: ${wall.points.length - 1}`;
    wrap.appendChild(info);

    // Dica de edição
    const hint = document.createElement('div');
    hint.style.cssText =
      'font-size:.75em;opacity:.6;margin-bottom:8px;padding:4px 6px;' +
      'background:rgba(255,220,60,.08);border-radius:4px;';
    hint.innerText =
      'Arraste vértices • Duplo-clique em segmento insere vértice • ' +
      'Selecione vértice + Delete para remover • Handle roxo rotaciona';
    wrap.appendChild(hint);

    // Bloqueada
    const lockRow = document.createElement('div');
    lockRow.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:8px;';
    const lockCb  = document.createElement('input');
    lockCb.type   = 'checkbox';
    lockCb.checked = wall.locked;
    lockCb.addEventListener('change', () => {
      Lighting.Model.updateWall(wall.id, { locked: lockCb.checked });
      Lighting.Model._save();
      this.refresh();
    });
    const lockLbl = document.createElement('label');
    lockLbl.innerText = 'Bloqueada';
    lockRow.appendChild(lockCb);
    lockRow.appendChild(lockLbl);
    wrap.appendChild(lockRow);

    // Botões
    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:6px;';

    const dupBtn   = this._btn('Duplicar', () => {
      const copy = Lighting.Model.duplicateWall(wall.id);
      if (copy) {
        Lighting.Model.selectWall(copy.id);
        Lighting.Model._save();
        this.refresh();
        Lighting.Render.draw();
      }
    });
    dupBtn.style.fontSize = '.75em';

    const delBtn   = this._btn('Excluir', () => {
      Lighting.Model.removeWall(wall.id);
      Lighting.Model._save();
      this.refresh();
      Lighting.Render.draw();
    });
    delBtn.style.cssText += 'font-size:.75em;grid-column:1/-1;';

    btnRow.appendChild(dupBtn);
    btnRow.appendChild(delBtn);
    wrap.appendChild(btnRow);

    section.appendChild(wrap);
  },

  // ── Propriedades de objeto selecionado ───────────────────────
  _renderProperties() {
    const propsEl = document.getElementById('lighting-props-panel');
    if (!propsEl) return;
    propsEl.innerHTML = '';

    const selectedId = Lighting.Input.selectedObjectId;
    if (!selectedId) {
      const nosel = document.createElement('div');
      nosel.style.opacity = '0.7';
      nosel.innerText = 'Selecione um objeto ou parede.';
      propsEl.appendChild(nosel);
      return;
    }

    const obj = Lighting.Model.getObject(selectedId);
    if (!obj) return;

    this._propField(propsEl, 'Nome', obj.name, val => {
      Lighting.Model.updateObject(obj.id, { name: val });
      Lighting.Model._save();
      this._renderObjectList();
    });

    // Tipo e forma (somente leitura)
    const shapeNames = { rect: 'Retângulo', circle: 'Círculo', polygon: 'Polígono' };
    this._infoRow(propsEl, 'Tipo',  obj.mode  === 'dark' ? 'Área Escura' : 'Área Iluminada');
    this._infoRow(propsEl, 'Forma', shapeNames[obj.shape] || obj.shape);

    // Bloqueada
    const lockRow = document.createElement('div');
    lockRow.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:8px;';
    const lockCb  = document.createElement('input');
    lockCb.type   = 'checkbox';
    lockCb.checked = obj.locked;
    lockCb.addEventListener('change', () => {
      Lighting.Model.updateObject(obj.id, { locked: lockCb.checked });
      Lighting.Model._save();
      this.refresh();
    });
    const lockLbl = document.createElement('label');
    lockLbl.innerText = 'Bloqueada';
    lockRow.appendChild(lockCb);
    lockRow.appendChild(lockLbl);
    propsEl.appendChild(lockRow);

    // Propriedades de luz
if (obj.mode === 'light') {

  this._propField(
    propsEl,
    'Diâmetro da Luz (grid)',
    obj.lightDiameter || 6,
    val => {
      Lighting.Model.updateObject(obj.id, {
        lightDiameter: Number(val) || 1
      });

      Lighting.Model._save();
      Lighting.Render.draw();
    },
    'number'
  );

  this._propField(
    propsEl,
    'Diâmetro da Penumbra (grid)',
    obj.penumbraDiameter || 12,
    val => {
      Lighting.Model.updateObject(obj.id, {
        penumbraDiameter: Number(val) || 0
      });

      Lighting.Model._save();
      Lighting.Render.draw();
    },
    'number'
  );

}

    // Botões de ação
    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;';

    const toggleBtn = this._btn(obj.mode === 'dark' ? 'Iluminar' : 'Escurecer', () => {
      Lighting.Model.toggleObjectMode(obj.id);
      Lighting.Model._save();
      this.refresh();
      Lighting.Render.draw();
    });
    toggleBtn.style.fontSize = '.75em';

    const dupBtn = this._btn('Duplicar', () => {
      Lighting.Model.duplicateObject(obj.id);
      Lighting.Model._save();
      this.refresh();
      Lighting.Render.draw();
    });
    dupBtn.style.fontSize = '.75em';

    const delBtn = this._btn('Excluir', () => {
      Lighting.Model.removeObject(obj.id);
      Lighting.Model._save();
      Lighting.Input.selectedObjectId = null;
      this.refresh();
      Lighting.Render.draw();
    });
    delBtn.style.cssText += 'font-size:.75em;grid-column:1/-1;';

    btnRow.appendChild(toggleBtn);
    btnRow.appendChild(dupBtn);
    btnRow.appendChild(delBtn);
    propsEl.appendChild(btnRow);
  },

  // ── Context menus ────────────────────────────────────────────
  showContextMenu(objId, pos) {
    const obj = Lighting.Model.getObject(objId);
    if (!obj) return;
    this._openMenu(pos, [
      { icon: '✏️', label: 'Renomear',
        action: () => this._rename('object', obj) },
      { icon: obj.mode === 'dark' ? '💡' : '🌑',
        label: obj.mode === 'dark' ? 'Iluminar' : 'Escurecer',
        action: () => { Lighting.Model.toggleObjectMode(obj.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw(); } },
      { icon: obj.locked ? '🔓' : '🔒',
        label: obj.locked ? 'Desbloquear' : 'Bloquear',
        action: () => { Lighting.Model.toggleObjectLocked(obj.id); Lighting.Model._save(); this.refresh(); } },
      { icon: '⧉', label: 'Duplicar',
        action: () => { Lighting.Model.duplicateObject(obj.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw(); } },
      { icon: '🗑', label: 'Excluir',
        action: () => { Lighting.Model.removeObject(obj.id); Lighting.Model._save(); Lighting.Input.selectedObjectId = null; this.refresh(); Lighting.Render.draw(); } },
    ]);
  },

  showWallContextMenu(wallId, pos) {
    const wall = Lighting.Model.getWall(wallId);
    if (!wall) return;
    this._openMenu(pos, [
      { icon: '✏️', label: 'Renomear',
        action: () => this._rename('wall', wall) },
      { icon: wall.locked ? '🔓' : '🔒',
        label: wall.locked ? 'Desbloquear' : 'Bloquear',
        action: () => { Lighting.Model.updateWall(wall.id, { locked: !wall.locked }); Lighting.Model._save(); this.refresh(); } },
      { icon: '⧉', label: 'Duplicar',
        action: () => { const c = Lighting.Model.duplicateWall(wall.id); if(c){ Lighting.Model.selectWall(c.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw(); } } },
      { icon: '🗑', label: 'Excluir',
        action: () => { Lighting.Model.removeWall(wall.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw(); } },
    ]);
  },

  _openMenu(pos, items) {
    if (this.contextMenu) this.contextMenu.remove();
    const menu = document.createElement('div');
    menu.style.cssText =
      `position:fixed;left:${pos.x}px;top:${pos.y}px;` +
      `background:rgba(30,30,30,.95);border:1px solid rgba(200,200,200,.3);` +
      `border-radius:6px;padding:4px;z-index:10000;font-size:.85em;` +
      `min-width:180px;box-shadow:0 4px 12px rgba(0,0,0,.5);`;
    items.forEach(item => {
      const btn = document.createElement('button');
      btn.style.cssText =
        'display:block;width:100%;background:transparent;border:none;color:#ccc;' +
        'padding:8px;text-align:left;cursor:pointer;border-radius:4px;';
      btn.innerHTML = `${item.icon} ${item.label}`;
      btn.addEventListener('mouseover', () => btn.style.background = 'rgba(100,100,100,.3)');
      btn.addEventListener('mouseout',  () => btn.style.background = 'transparent');
      btn.addEventListener('click', () => { item.action(); menu.remove(); });
      menu.appendChild(btn);
    });
    document.body.appendChild(menu);
    this.contextMenu = menu;
    setTimeout(() => {
      document.addEventListener('click', () => { if (this.contextMenu) this.contextMenu.remove(); }, { once: true });
    }, 0);
  },

  // ── Helpers de UI ────────────────────────────────────────────
  _btn(label, action) {
    const btn     = document.createElement('button');
    btn.className = 'btn-full';
    btn.innerText = label;
    btn.addEventListener('click', action);
    return btn;
  },

  _propField(parent, label, value, onChange, type = 'text') {
    const row = document.createElement('div');
    row.style.marginBottom = '8px';
    const lbl     = document.createElement('label');
    lbl.innerText = label;
    row.appendChild(lbl);
    const input   = document.createElement('input');
    input.type    = type;
    input.value   = value;
    input.addEventListener('change', e => onChange(e.target.value));
    row.appendChild(input);
    parent.appendChild(row);
  },

  _infoRow(parent, label, value) {
    const row = document.createElement('div');
    row.style.marginBottom = '8px';
    const lbl     = document.createElement('label');
    lbl.innerText = label;
    row.appendChild(lbl);
    const val     = document.createElement('div');
    val.style.fontSize = '.85em';
    val.innerText = value;
    row.appendChild(val);
    parent.appendChild(row);
  },

_startModeObserver() {
  if (this._modeObserver) return;

  this._modeObserver = setInterval(() => {

    if (!window.VTTMode) return;

    const active = VTTMode.is('lighting');

    const canvas = document.getElementById(
      'lighting-interaction-canvas'
    );

    if (canvas) {
      canvas.style.pointerEvents =
        active ? 'auto' : 'none';
    }

  }, 100);

},

  _rename(type, item) {
    const newName = prompt('Novo nome:', item.name);
    if (!newName) return;
    if (type === 'wall') {
      Lighting.Model.updateWall(item.id, { name: newName });
    } else {
      Lighting.Model.updateObject(item.id, { name: newName });
    }
    Lighting.Model._save();
    this.refresh();
  },
};

setTimeout(() => { Lighting.UI.init(); }, 700);
</script>
