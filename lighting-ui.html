<script>
// lighting-ui.html
console.log('lighting-ui carregado');

window.Lighting = window.Lighting || {};

Lighting.UI = {
  initialized: false,
  sidebar:     null,
  toolButtons: {},
  _enableBtn:  null,
  _coverBtn:   null,

  init() {
    if (this.initialized) return;
    this.initialized = true;
    setTimeout(() => {
      const sidebar = document.getElementById('sidebar');
      if (!sidebar) { setTimeout(() => this.init(), 200); return; }
      this.sidebar = sidebar;
      this._createPanel();
      Lighting.Input.init();
      Lighting.Render.init();
      this.refresh();
    }, 500);
  },

  _createPanel() {
    const cat = document.createElement('div');
    cat.className = 'category';
    cat.id = 'cat-lighting';

    const title = document.createElement('div');
    title.className = 'category-title';
    title.innerText = 'Iluminação';
    cat.appendChild(title);

    // ── Botão de modo ──────────────────────────────────────────
    const modeBtn = document.createElement('button');
    modeBtn.id = 'lighting-mode-btn';
    modeBtn.className = 'mode-btn mode-lighting';
    modeBtn.textContent = '🕯 ATIVAR ILUMINAÇÃO';
    modeBtn.onclick = () => VTTMode.setMode('lighting');
    VTTMode._modeBtns.lighting    = modeBtn;
    VTTMode._categoryIds.lighting = 'cat-lighting';
    cat.appendChild(modeBtn);

    // ── Toggle fog ─────────────────────────────────────────────
    const enableBtn = document.createElement('button');
    enableBtn.id = 'lighting-enable-btn';
    enableBtn.className = 'btn-full';
    enableBtn.style.marginTop = '6px';
    const _syncEnable = () => {
      enableBtn.textContent      = Lighting.Model.enabled ? '🌑 Fog: LIGADO' : '☀ Fog: DESLIGADO';
      enableBtn.style.background = Lighting.Model.enabled ? '#5a3a00' : '#333';
    };
    _syncEnable();
    enableBtn.onclick = () => {
      Lighting.Model.enabled = !Lighting.Model.enabled;
      Lighting.Model._save();
      _syncEnable();
      Lighting.Render.draw();
    };
    this._enableBtn = enableBtn;
    cat.appendChild(enableBtn);

    // ── Toggle cobertura total ─────────────────────────────────
    const coverBtn = document.createElement('button');
    coverBtn.className = 'btn-full';
    coverBtn.style.marginTop = '4px';
    const _syncCover = () => {
      const active = Lighting.Model.hasTotalCover();
      coverBtn.textContent      = active ? '☀ Remover Cobertura Total' : '🌑 Cobrir Mapa Todo';
      coverBtn.style.background = active ? '#1a3a5c' : '';
    };
    _syncCover();
    coverBtn.onclick = () => {
      Lighting.Model.toggleTotalCover();
      Lighting.Model._save();
      _syncCover();
      this.refresh();
      Lighting.Render.draw();
    };
    this._coverBtn = coverBtn;
    cat.appendChild(coverBtn);

    // ── masterReveal ───────────────────────────────────────────
    const revealBtn = document.createElement('button');
    revealBtn.className = 'btn-full';
    revealBtn.style.marginTop = '4px';
    const _syncReveal = () => {
      revealBtn.textContent      = Lighting.Model.masterReveal ? '👁 Revelar: ON' : '👁 Revelar: OFF';
      revealBtn.style.background = Lighting.Model.masterReveal ? '#1a3a5c' : '';
    };
    _syncReveal();
    revealBtn.onclick = () => {
      Lighting.Model.masterReveal = !Lighting.Model.masterReveal;
      Lighting.Model._save();
      _syncReveal();
      Lighting.Render.draw();
    };
    cat.appendChild(revealBtn);

    // ── Slider de opacidade de penumbra ───────────────────────
    const penumLabel = document.createElement('div');
    penumLabel.style.cssText =
      'font-size:0.78em;font-weight:bold;margin:14px 0 4px;opacity:0.8;text-transform:uppercase;';
    penumLabel.innerText = 'Opacidade da Penumbra';
    cat.appendChild(penumLabel);

    const penumDesc = document.createElement('div');
    penumDesc.style.cssText = 'font-size:0.72em;opacity:0.6;margin-bottom:6px;';
    penumDesc.innerText = '0% = transparente (luz) · 100% = sombra total';
    cat.appendChild(penumDesc);

    // Container slider + número (igual ao de escala de mapa)
    const penumRow = document.createElement('div');
    penumRow.style.cssText = 'display:flex;gap:6px;align-items:center;';

    const penumSlider = document.createElement('input');
    penumSlider.type  = 'range';
    penumSlider.min   = '0';
    penumSlider.max   = '100';
    penumSlider.step  = '1';
    penumSlider.value = Math.round((Lighting.Model.penumbraOpacity || 0.9) * 100);
    penumSlider.style.flex = '1';

    const penumNumber = document.createElement('input');
    penumNumber.type  = 'number';
    penumNumber.min   = '0';
    penumNumber.max   = '100';
    penumNumber.value = penumSlider.value;
    penumNumber.style.cssText = 'width:54px;padding:4px;text-align:center;';

    const _applyPenum = (val) => {
      val = Math.min(100, Math.max(0, isNaN(val) ? 90 : val));
      penumSlider.value = val;
      penumNumber.value = val;
      Lighting.Model.penumbraOpacity = val / 100;
      Lighting.Model._save();
      Lighting.Render.draw();
    };

    penumSlider.addEventListener('input',  () => _applyPenum(parseInt(penumSlider.value)));
    penumNumber.addEventListener('change', () => _applyPenum(parseInt(penumNumber.value)));

    penumRow.appendChild(penumSlider);
    penumRow.appendChild(penumNumber);
    cat.appendChild(penumRow);

    // ── Ferramentas ────────────────────────────────────────────
    const toolsLabel = document.createElement('div');
    toolsLabel.style.cssText =
      'font-size:0.78em;font-weight:bold;margin:14px 0 6px;opacity:0.8;text-transform:uppercase;';
    toolsLabel.innerText = 'Ferramentas';
    cat.appendChild(toolsLabel);

    const toolGrid = document.createElement('div');
    toolGrid.style.cssText = 'display:grid;grid-template-columns:repeat(5,1fr);gap:5px;';

    const tools = [
      { id: 'select',  icon: '🖱',  title: 'Selecionar' },
      { id: 'rect',    icon: '⬜', title: 'Retângulo'  },
      { id: 'circle',  icon: '⚪', title: 'Círculo'    },
      { id: 'polygon', icon: '⬡',  title: 'Polígono'   },
      { id: 'wall',    icon: '🚧', title: 'Parede'     },
    ];

    tools.forEach(tool => {
      const btn = document.createElement('button');
      btn.title    = tool.title;
      btn.innerHTML = tool.icon;
      btn.style.cssText =
        'padding:10px;font-size:1.1em;border:2px solid transparent;border-radius:6px;' +
        'background:rgba(100,100,100,0.3);cursor:pointer;transition:all 0.15s;';
      btn.addEventListener('click', () => {
        Lighting.Input.setActiveTool(tool.id);
        this._updateToolButtons();
        Lighting.Render.draw();
      });
      this.toolButtons[tool.id] = btn;
      toolGrid.appendChild(btn);
    });
    cat.appendChild(toolGrid);

    // ── Lista de objetos ───────────────────────────────────────
    const listLabel = document.createElement('div');
    listLabel.style.cssText =
      'font-size:0.78em;font-weight:bold;margin:12px 0 4px;opacity:0.8;text-transform:uppercase;';
    listLabel.innerText = 'Objetos';
    cat.appendChild(listLabel);

    const objectList = document.createElement('div');
    objectList.id = 'lighting-object-list';
    objectList.style.cssText = 'max-height:180px;overflow-y:auto;font-size:0.85em;';
    cat.appendChild(objectList);

    // ── Propriedades ───────────────────────────────────────────
    const propsLabel = document.createElement('div');
    propsLabel.style.cssText =
      'font-size:0.78em;font-weight:bold;margin:12px 0 4px;opacity:0.8;text-transform:uppercase;';
    propsLabel.innerText = 'Propriedades';
    cat.appendChild(propsLabel);

    const propPanel = document.createElement('div');
    propPanel.id = 'lighting-props-panel';
    propPanel.style.fontSize = '0.85em';
    cat.appendChild(propPanel);

    this.sidebar.appendChild(cat);
    if (typeof initCollapseForCategory === 'function') initCollapseForCategory(cat);
    setTimeout(() => { if (window.VTTMode) VTTMode.setMode(VTTMode.active); }, 100);
  },

  _updateToolButtons() {
    const active = Lighting.Input ? Lighting.Input.activeTool : 'select';
    Object.keys(this.toolButtons).forEach(k => {
      const btn = this.toolButtons[k];
      btn.style.background  = k === active ? 'rgba(150,200,255,0.5)' : 'rgba(100,100,100,0.3)';
      btn.style.borderColor = k === active ? 'rgba(200,230,255,0.8)' : 'transparent';
    });
  },

  refresh() {
    this._updateToolButtons();
    this._renderObjectList();
    this._renderProperties();
    if (this._enableBtn) {
      this._enableBtn.textContent      = Lighting.Model.enabled ? '🌑 Fog: LIGADO' : '☀ Fog: DESLIGADO';
      this._enableBtn.style.background = Lighting.Model.enabled ? '#5a3a00' : '#333';
    }
    if (this._coverBtn) {
      const active = Lighting.Model.hasTotalCover();
      this._coverBtn.textContent      = active ? '☀ Remover Cobertura Total' : '🌑 Cobrir Mapa Todo';
      this._coverBtn.style.background = active ? '#1a3a5c' : '';
    }
  },

  _renderObjectList() {
    const listEl = document.getElementById('lighting-object-list');
    if (!listEl) return;
    listEl.innerHTML = '';

    const darkObjs  = Lighting.Model.objects.filter(o => o.mode === 'dark'  && !o._totalCover);
    const lightObjs = Lighting.Model.objects.filter(o => o.mode === 'light');

    if (darkObjs.length)             this._mkGroup(listEl, '▼ Escuridão', darkObjs);
    if (lightObjs.length)            this._mkGroup(listEl, '▼ Luz',       lightObjs);
    if (Lighting.Model.walls.length) this._mkWallGroup(listEl);

    if (!darkObjs.length && !lightObjs.length && !Lighting.Model.walls.length) {
      const e = document.createElement('div');
      e.style.cssText = 'opacity:0.55;padding:6px;font-size:0.85em;';
      e.innerText = 'Nenhum objeto. Use as ferramentas acima.';
      listEl.appendChild(e);
    }
  },

  _mkGroup(parent, label, objects) {
    const g = document.createElement('div');
    g.style.marginBottom = '6px';
    const hdr = document.createElement('div');
    hdr.style.cssText = 'font-weight:bold;font-size:0.78em;margin-bottom:3px;opacity:0.7;';
    hdr.innerText = label;
    g.appendChild(hdr);
    objects.forEach(obj => {
      const item = document.createElement('div');
      const sel  = Lighting.Input && Lighting.Input.selectedObjectId === obj.id;
      item.style.cssText =
        'padding:5px 7px;border-radius:4px;cursor:pointer;font-size:0.85em;' +
        'display:flex;justify-content:space-between;align-items:center;' +
        (sel ? 'background:rgba(100,150,200,0.35);' : '');

      const nameSpan = document.createElement('span');
      nameSpan.innerText = (obj.locked ? '🔒 ' : '') + obj.name;
      item.appendChild(nameSpan);

      const del = document.createElement('button');
      del.innerText = '✕';
      del.style.cssText = 'background:none;border:none;color:rgba(200,80,80,0.7);cursor:pointer;padding:0 3px;';
      del.onclick = e => {
        e.stopPropagation();
        Lighting.Model.removeObject(obj.id);
        Lighting.Model._save();
        if (Lighting.Input) Lighting.Input.selectedObjectId = null;
        this.refresh(); Lighting.Render.draw();
      };
      item.appendChild(del);

      item.addEventListener('click', () => {
        if (Lighting.Input) Lighting.Input.selectedObjectId = obj.id;
        this.refresh(); Lighting.Render.draw();
      });
      item.addEventListener('contextmenu', e => {
        e.preventDefault();
        this.showContextMenu(obj.id, { x: e.clientX, y: e.clientY });
      });
      g.appendChild(item);
    });
    parent.appendChild(g);
  },

  _mkWallGroup(parent) {
    const g = document.createElement('div');
    g.style.marginBottom = '6px';
    const hdr = document.createElement('div');
    hdr.style.cssText = 'font-weight:bold;font-size:0.78em;margin-bottom:3px;opacity:0.7;';
    hdr.innerText = '▼ Paredes';
    g.appendChild(hdr);
    Lighting.Model.walls.forEach((wall, idx) => {
      const item = document.createElement('div');
      item.style.cssText =
        'padding:5px 7px;border-radius:4px;font-size:0.85em;' +
        'display:flex;justify-content:space-between;align-items:center;';
      const nm = document.createElement('span');
      nm.innerText = `Parede ${idx + 1}`;
      item.appendChild(nm);
      const del = document.createElement('button');
      del.innerText = '✕';
      del.style.cssText = 'background:none;border:none;color:rgba(200,80,80,0.7);cursor:pointer;padding:0 3px;';
      del.onclick = () => {
        Lighting.Model.removeWall(wall.id);
        Lighting.Model._save();
        Lighting.Render.buildSpatialIndex();
        Lighting.Render.draw();
        this.refresh();
      };
      item.appendChild(del);
      g.appendChild(item);
    });
    parent.appendChild(g);
  },

  _renderProperties() {
    const el = document.getElementById('lighting-props-panel');
    if (!el) return;
    el.innerHTML = '';
    const selId = Lighting.Input ? Lighting.Input.selectedObjectId : null;
    if (!selId) {
      const m = document.createElement('div');
      m.style.cssText = 'opacity:0.55;padding:4px;font-size:0.85em;';
      m.innerText = 'Clique em um objeto para editar.';
      el.appendChild(m); return;
    }
    const obj = Lighting.Model.getObject(selId);
    if (!obj) return;

    this._mkPropField(el, 'Nome', obj.name, val => {
      Lighting.Model.updateObject(obj.id, { name: val });
      Lighting.Model._save(); this._renderObjectList();
    });

    const info = document.createElement('div');
    info.style.cssText = 'font-size:0.78em;opacity:0.65;margin-bottom:8px;';
    info.innerText = `${obj.mode === 'dark' ? 'Escuridão' : 'Luz'} · ${{ rect:'Retângulo', circle:'Círculo', polygon:'Polígono' }[obj.shape] || obj.shape}`;
    el.appendChild(info);

    const row = document.createElement('div');
    row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;';

    const mkBtn = (label, bg, action) => {
      const b = document.createElement('button');
      b.className = 'btn-full';
      b.style.cssText = `font-size:0.72em;${bg ? 'background:' + bg + ';' : ''}`;
      b.innerText = label;
      b.onclick   = action;
      return b;
    };

    row.appendChild(mkBtn(obj.mode === 'dark' ? 'Tornar Luz' : 'Tornar Escuridão', '', () => {
      Lighting.Model.toggleObjectMode(obj.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw();
    }));
    row.appendChild(mkBtn('Duplicar', '', () => {
      Lighting.Model.duplicateObject(obj.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw();
    }));
    row.appendChild(mkBtn(obj.locked ? '🔓 Desbloquear' : '🔒 Bloquear', '', () => {
      Lighting.Model.toggleObjectLocked(obj.id); Lighting.Model._save(); this.refresh();
    }));
    row.appendChild(mkBtn('🗑 Excluir', '#7a2a2a', () => {
      Lighting.Model.removeObject(obj.id); Lighting.Model._save();
      if (Lighting.Input) Lighting.Input.selectedObjectId = null;
      this.refresh(); Lighting.Render.draw();
    }));
    el.appendChild(row);
  },

  _mkPropField(parent, label, value, onChange, type = 'text') {
    const row = document.createElement('div');
    row.style.marginBottom = '7px';
    const lbl = document.createElement('label'); lbl.innerText = label;
    const inp = document.createElement('input'); inp.type = type; inp.value = value;
    inp.addEventListener('change', e => onChange(e.target.value));
    row.appendChild(lbl); row.appendChild(inp); parent.appendChild(row);
  },

  // ── Context menu ──────────────────────────────────────────────
  showContextMenu(objId, pos) {
    const obj = Lighting.Model.getObject(objId);
    if (!obj) return;

    const old = document.getElementById('lighting-ctx-menu');
    if (old) old.remove();

    const menu = document.createElement('div');
    menu.id = 'lighting-ctx-menu';
    menu.style.cssText =
      `position:fixed;left:${pos.x}px;top:${pos.y}px;` +
      'background:rgba(24,24,24,0.97);border:1px solid rgba(200,200,200,0.2);' +
      'border-radius:7px;padding:4px;z-index:20000;min-width:200px;' +
      'box-shadow:0 4px 16px rgba(0,0,0,0.65);font-size:0.85em;';

    const mkItem = (icon, label, action) => {
      const btn = document.createElement('button');
      btn.style.cssText =
        'display:block;width:100%;background:transparent;border:none;color:#ccc;' +
        'padding:8px 10px;text-align:left;cursor:pointer;border-radius:5px;';
      btn.innerHTML = `${icon} ${label}`;
      btn.onmouseover = () => { btn.style.background = 'rgba(100,100,100,0.3)'; };
      btn.onmouseout  = () => { btn.style.background = 'transparent'; };
      btn.onclick     = () => { action(); menu.remove(); };
      menu.appendChild(btn);
    };

    const mkSep = () => {
      const s = document.createElement('div');
      s.style.cssText = 'border-top:1px solid rgba(200,200,200,0.1);margin:3px 8px;';
      menu.appendChild(s);
    };

    const mkSectionLabel = (text) => {
      const l = document.createElement('div');
      l.style.cssText =
        'padding:6px 10px 2px;font-size:0.75em;text-transform:uppercase;' +
        'opacity:0.5;letter-spacing:0.5px;';
      l.innerText = text;
      menu.appendChild(l);
    };

    // Ações comuns
    mkItem('✏️', 'Renomear', () => {
      const n = prompt('Novo nome:', obj.name);
      if (n) { Lighting.Model.updateObject(obj.id, { name: n }); Lighting.Model._save(); this.refresh(); }
    });
    mkItem(obj.mode === 'dark' ? '💡' : '🌑',
           obj.mode === 'dark' ? 'Tornar Luz' : 'Tornar Escuridão',
           () => { Lighting.Model.toggleObjectMode(obj.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw(); });
    mkItem(obj.locked ? '🔓' : '🔒',
           obj.locked ? 'Desbloquear' : 'Bloquear',
           () => { Lighting.Model.toggleObjectLocked(obj.id); Lighting.Model._save(); this.refresh(); });
    mkItem('⧉', 'Duplicar',
           () => { Lighting.Model.duplicateObject(obj.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw(); });
    mkItem('🗑', 'Excluir',
           () => {
             Lighting.Model.removeObject(obj.id); Lighting.Model._save();
             if (Lighting.Input) Lighting.Input.selectedObjectId = null;
             this.refresh(); Lighting.Render.draw();
           });

    // ── Seção Redimensionar — APENAS para círculos ─────────────
    if (obj.shape === 'circle') {
      mkSep();
      mkSectionLabel('Redimensionar');

      // Campo: diâmetro da penumbra (que é o total — luz = metade)
      const resizeDiv = document.createElement('div');
      resizeDiv.style.cssText = 'padding:4px 10px 8px;';

      const gs = window.VTTGrid?.size || 50;

      // Label
      const lbl1 = document.createElement('div');
      lbl1.style.cssText = 'font-size:0.78em;opacity:0.7;margin-bottom:4px;';
      lbl1.innerText = 'Diâmetro (em quadrados):';
      resizeDiv.appendChild(lbl1);

      // Explicação
      const exp = document.createElement('div');
      exp.style.cssText = 'font-size:0.72em;opacity:0.5;margin-bottom:6px;line-height:1.3;';
      exp.innerText = 'O valor inserido é o diâmetro da penumbra. A luz plena terá metade desse valor.';
      resizeDiv.appendChild(exp);

      const inputRow = document.createElement('div');
      inputRow.style.cssText = 'display:flex;gap:6px;align-items:center;';

      const inp = document.createElement('input');
      inp.type  = 'number';
      inp.min   = '1';
      inp.step  = '0.5';
      inp.value = obj.penumbraDiameter || 8;
      inp.style.cssText =
        'flex:1;padding:5px;background:#1a1a1a;color:white;border:1px solid #555;' +
        'border-radius:4px;font-size:0.9em;';
      inp.placeholder = 'Diâmetro penumbra';

      const applyBtn = document.createElement('button');
      applyBtn.innerText = 'Aplicar';
      applyBtn.style.cssText =
        'padding:5px 10px;background:#2a5a2a;color:white;border:1px solid #3a7a3a;' +
        'border-radius:4px;cursor:pointer;font-size:0.85em;white-space:nowrap;';
      applyBtn.onclick = () => {
        const val = parseFloat(inp.value);
        if (isNaN(val) || val < 0.5) return;
        const penumD = val;
        const lightD = val / 2;
        Lighting.Model.updateObject(obj.id, {
          penumbraDiameter: penumD,
          lightDiameter:    lightD,
        });
        Lighting.Model._save();
        this.refresh();
        Lighting.Render.draw();
        menu.remove();
      };

      // Preview das medidas atuais
      const preview = document.createElement('div');
      preview.style.cssText = 'font-size:0.72em;opacity:0.6;margin-top:4px;';
      const updatePreview = () => {
        const val  = parseFloat(inp.value) || 0;
        const penD = val.toFixed(1);
        const litD = (val / 2).toFixed(1);
        const penPx = ((val / 2) * gs).toFixed(0);
        const litPx = ((val / 4) * gs).toFixed(0);
        preview.innerText =
          `Penumbra: ⌀${penD} sq (${penPx}px) · Luz: ⌀${litD} sq (${litPx}px)`;
      };
      updatePreview();
      inp.addEventListener('input', updatePreview);

      inputRow.appendChild(inp);
      inputRow.appendChild(applyBtn);
      resizeDiv.appendChild(inputRow);
      resizeDiv.appendChild(preview);
      menu.appendChild(resizeDiv);
    }

    document.body.appendChild(menu);

    // Fecha ao clicar fora
    setTimeout(() => {
      const close = e => {
        if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('mousedown', close); }
      };
      document.addEventListener('mousedown', close);
    }, 0);
  },
};

setTimeout(() => { Lighting.UI.init(); }, 700);
</script>
