<script>
// lighting-ui.html — UI completa do sistema de iluminação
console.log('lighting-ui carregado');

window.Lighting = window.Lighting || {};

Lighting.UI = {
  initialized: false,
  sidebar: null,
  toolButtons: {},
  _enableBtn: null,

  init() {
    if (this.initialized) return;
    this.initialized = true;

    setTimeout(() => {
      const sidebar = document.getElementById('sidebar');
      if (!sidebar) { setTimeout(() => this.init(), 200); return; }
      this.sidebar = sidebar;
      this._createPanel();
      Lighting.Input.init();
      Lighting.Render.init();
      this.refresh();
    }, 500);
  },

  _createPanel() {
    const cat = document.createElement('div');
    cat.className = 'category';
    cat.id = 'cat-lighting';

    const title = document.createElement('div');
    title.className = 'category-title';
    title.innerText = 'Iluminação';
    cat.appendChild(title);

    // ---- Botão de MODO (ativa o mouse para iluminação) ----
    const modeBtn = document.createElement('button');
    modeBtn.id = 'lighting-mode-btn';
    modeBtn.className = 'mode-btn mode-lighting';
    modeBtn.textContent = '🕯 ATIVAR ILUMINAÇÃO';
    modeBtn.onclick = () => VTTMode.setMode('lighting');
    VTTMode._modeBtns.lighting    = modeBtn;
    VTTMode._categoryIds.lighting = 'cat-lighting';
    cat.appendChild(modeBtn);

    // ---- Toggle de iluminação (liga/desliga o overlay escuro) ----
    const enableBtn = document.createElement('button');
    enableBtn.id = 'lighting-enable-btn';
    enableBtn.className = 'btn-full';
    enableBtn.style.marginTop = '6px';
    enableBtn.style.background = Lighting.Model.enabled ? '#7a3a00' : '#333';
    enableBtn.textContent = Lighting.Model.enabled ? '🌑 Iluminação: ON' : '☀ Iluminação: OFF';
    enableBtn.title = 'Liga/desliga o fog of war sem sair do modo de edição';
    enableBtn.onclick = () => {
      Lighting.Model.enabled = !Lighting.Model.enabled;
      Lighting.Model._save();
      enableBtn.textContent = Lighting.Model.enabled ? '🌑 Iluminação: ON' : '☀ Iluminação: OFF';
      enableBtn.style.background = Lighting.Model.enabled ? '#7a3a00' : '#333';
      Lighting.Render.draw();
    };
    this._enableBtn = enableBtn;
    cat.appendChild(enableBtn);

    // ---- masterReveal ----
    const revealBtn = this._createActionButton('👁 Mostrar Tudo (Mestre)', () => {
      Lighting.Model.masterReveal = !Lighting.Model.masterReveal;
      Lighting.Model._save();
      revealBtn.style.background = Lighting.Model.masterReveal ? '#1a3a5c' : '';
      Lighting.Render.draw();
    });
    revealBtn.style.background = Lighting.Model.masterReveal ? '#1a3a5c' : '';
    cat.appendChild(revealBtn);

    // ---- FERRAMENTAS ----
    const toolsLabel = document.createElement('div');
    toolsLabel.style.cssText = 'font-size:0.78em;font-weight:bold;margin:12px 0 6px;opacity:0.8;text-transform:uppercase;';
    toolsLabel.innerText = 'Ferramentas';
    cat.appendChild(toolsLabel);

    const toolGrid = document.createElement('div');
    toolGrid.style.cssText = 'display:grid;grid-template-columns:repeat(5,1fr);gap:5px;';

    const tools = [
      { id: 'select',  icon: '🖱',  title: 'Selecionar' },
      { id: 'rect',    icon: '⬜', title: 'Retângulo' },
      { id: 'circle',  icon: '⚪', title: 'Círculo' },
      { id: 'polygon', icon: '⬡',  title: 'Polígono' },
      { id: 'wall',    icon: '🚧', title: 'Parede' },
    ];

    tools.forEach(tool => {
      const btn = document.createElement('button');
      btn.title = tool.title;
      btn.innerHTML = tool.icon;
      btn.style.cssText =
        'padding:10px;font-size:1.1em;border:2px solid transparent;border-radius:6px;' +
        'background:rgba(100,100,100,0.3);cursor:pointer;transition:all 0.15s;';
      btn.addEventListener('click', () => {
        Lighting.Input.setActiveTool(tool.id);
        this._updateToolButtons();
        Lighting.Render.draw();
      });
      this.toolButtons[tool.id] = btn;
      toolGrid.appendChild(btn);
    });
    cat.appendChild(toolGrid);

    // ---- AÇÕES ----
    const actionsLabel = document.createElement('div');
    actionsLabel.style.cssText = 'font-size:0.78em;font-weight:bold;margin:12px 0 6px;opacity:0.8;text-transform:uppercase;';
    actionsLabel.innerText = 'Ações Rápidas';
    cat.appendChild(actionsLabel);

window.LightPlugin = window.LightPlugin || {};

(function() {
  function atualizarTextoBotaoCoberturaTotal() {
    var botao = document.getElementById('btnCoverMap') ||
      document.getElementById('btnCobrirMapaTodo') ||
      document.querySelector('[data-action="cover-map"]');

    if (!botao) {
      return;
    }

    var ativo = false;

    if (LightPlugin.Model && typeof LightPlugin.Model.hasTotalCover === 'function') {
      ativo = LightPlugin.Model.hasTotalCover();
    }

    botao.textContent = ativo ? 'Iluminar Mapa Todo' : 'Cobrir Mapa Todo';
    botao.classList.toggle('active', ativo);
    botao.classList.toggle('ativo', ativo);
  }

  function configurarBotaoCoberturaTotal() {
    var botao = document.getElementById('btnCoverMap') ||
      document.getElementById('btnCobrirMapaTodo') ||
      document.querySelector('[data-action="cover-map"]');

    if (!botao) {
      return;
    }

    botao.addEventListener('click', function() {
      if (!LightPlugin.Model || typeof LightPlugin.Model.toggleTotalCover !== 'function') {
        console.warn('LightPlugin.Model.toggleTotalCover não está disponível.');
        return;
      }

      LightPlugin.Model.toggleTotalCover();
      atualizarTextoBotaoCoberturaTotal();

      if (LightPlugin.Render && typeof LightPlugin.Render.draw === 'function') {
        LightPlugin.Render.draw();
      }
    });

    atualizarTextoBotaoCoberturaTotal();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', configurarBotaoCoberturaTotal);
  } else {
    configurarBotaoCoberturaTotal();
  }

  LightPlugin.updateTotalCoverButton = atualizarTextoBotaoCoberturaTotal;
})();

    // ---- LISTA DE OBJETOS ----
    const listLabel = document.createElement('div');
    listLabel.style.cssText = 'font-size:0.78em;font-weight:bold;margin:12px 0 6px;opacity:0.8;text-transform:uppercase;';
    listLabel.innerText = 'Objetos';
    cat.appendChild(listLabel);

    const objectList = document.createElement('div');
    objectList.id = 'lighting-object-list';
    objectList.style.cssText = 'max-height:180px;overflow-y:auto;font-size:0.85em;';
    cat.appendChild(objectList);

    // ---- PROPRIEDADES ----
    const propsLabel = document.createElement('div');
    propsLabel.style.cssText = 'font-size:0.78em;font-weight:bold;margin:12px 0 6px;opacity:0.8;text-transform:uppercase;';
    propsLabel.innerText = 'Propriedades';
    cat.appendChild(propsLabel);

    const propPanel = document.createElement('div');
    propPanel.id = 'lighting-props-panel';
    propPanel.style.fontSize = '0.85em';
    cat.appendChild(propPanel);

    this.sidebar.appendChild(cat);

    if (typeof initCollapseForCategory === 'function') initCollapseForCategory(cat);

    // Notifica VTTMode sobre a nova categoria
    setTimeout(() => { if (window.VTTMode) VTTMode.setMode(VTTMode.active); }, 100);
  },

  _createActionButton(label, action) {
    const btn = document.createElement('button');
    btn.className = 'btn-full';
    btn.innerText = label;
    btn.addEventListener('click', action);
    return btn;
  },

  _updateToolButtons() {
    const active = Lighting.Input ? Lighting.Input.activeTool : 'select';
    Object.keys(this.toolButtons).forEach(key => {
      const btn = this.toolButtons[key];
      if (key === active) {
        btn.style.background   = 'rgba(150,200,255,0.5)';
        btn.style.borderColor  = 'rgba(200,230,255,0.8)';
      } else {
        btn.style.background   = 'rgba(100,100,100,0.3)';
        btn.style.borderColor  = 'transparent';
      }
    });
  },

  refresh() {
    this._updateToolButtons();
    this._renderObjectList();
    this._renderProperties();
    // Sincroniza botão de enable
    if (this._enableBtn) {
      this._enableBtn.textContent = Lighting.Model.enabled ? '🌑 Iluminação: ON' : '☀ Iluminação: OFF';
      this._enableBtn.style.background = Lighting.Model.enabled ? '#7a3a00' : '#333';
    }
  },

  _renderObjectList() {
    const listEl = document.getElementById('lighting-object-list');
    if (!listEl) return;
    listEl.innerHTML = '';

    const darkObjs  = Lighting.Model.objects.filter(o => o.mode === 'dark');
    const lightObjs = Lighting.Model.objects.filter(o => o.mode === 'light');

    if (darkObjs.length)  this._createListGroup(listEl, '▼ Áreas Escuras',    darkObjs);
    if (lightObjs.length) this._createListGroup(listEl, '▼ Áreas Iluminadas', lightObjs);
    if (Lighting.Model.walls.length) this._createWallGroup(listEl);

    if (!darkObjs.length && !lightObjs.length && !Lighting.Model.walls.length) {
      const empty = document.createElement('div');
      empty.style.cssText = 'opacity:0.6;padding:6px;';
      empty.innerText = 'Nenhum objeto. Use as ferramentas acima.';
      listEl.appendChild(empty);
    }
  },

  _createListGroup(parent, label, objects) {
    const group = document.createElement('div');
    group.style.marginBottom = '6px';

    const header = document.createElement('div');
    header.style.cssText = 'font-weight:bold;font-size:0.8em;margin-bottom:3px;opacity:0.8;';
    header.innerText = label;
    group.appendChild(header);

    objects.forEach(obj => {
      const item = document.createElement('div');
      item.style.cssText =
        'padding:5px 6px;border-radius:4px;cursor:pointer;font-size:0.85em;' +
        (Lighting.Input && Lighting.Input.selectedObjectId === obj.id
          ? 'background:rgba(100,150,200,0.35);'
          : 'background:transparent;');
      item.innerText = obj.name;
      item.addEventListener('click', () => {
        Lighting.Input.selectedObjectId = obj.id;
        this.refresh();
        Lighting.Render.draw();
      });
      item.addEventListener('contextmenu', e => {
        e.preventDefault();
        this.showContextMenu(obj.id, { x: e.clientX, y: e.clientY });
      });
      group.appendChild(item);
    });

    parent.appendChild(group);
  },

  _createWallGroup(parent) {
    const group = document.createElement('div');
    group.style.marginBottom = '6px';

    const header = document.createElement('div');
    header.style.cssText = 'font-weight:bold;font-size:0.8em;margin-bottom:3px;opacity:0.8;';
    header.innerText = '▼ Paredes';
    group.appendChild(header);

    Lighting.Model.walls.forEach((wall, idx) => {
      const item = document.createElement('div');
      item.style.cssText = 'padding:5px 6px;border-radius:4px;font-size:0.85em;display:flex;justify-content:space-between;align-items:center;';
      item.innerHTML = `<span>Parede ${idx + 1}</span>`;
      const del = document.createElement('button');
      del.innerText = '✕';
      del.style.cssText = 'background:none;border:none;color:#c0392b;cursor:pointer;padding:0 4px;';
      del.onclick = () => {
        Lighting.Model.removeWall(wall.id);
        Lighting.Model._save();
        Lighting.Render.buildSpatialIndex();
        Lighting.Render.draw();
        this.refresh();
      };
      item.appendChild(del);
      group.appendChild(item);
    });

    parent.appendChild(group);
  },

  _renderProperties() {
    const propsEl = document.getElementById('lighting-props-panel');
    if (!propsEl) return;
    propsEl.innerHTML = '';

    const selectedId = Lighting.Input ? Lighting.Input.selectedObjectId : null;
    if (!selectedId) {
      const nosel = document.createElement('div');
      nosel.style.cssText = 'opacity:0.6;padding:4px;';
      nosel.innerText = 'Selecione um objeto.';
      propsEl.appendChild(nosel);
      return;
    }

    const obj = Lighting.Model.getObject(selectedId);
    if (!obj) return;

    this._createPropField(propsEl, 'Nome', obj.name, val => {
      Lighting.Model.updateObject(obj.id, { name: val });
      Lighting.Model._save();
      this._renderObjectList();
    });

    // Tipo e forma (readonly)
    const info = document.createElement('div');
    info.style.cssText = 'font-size:0.8em;opacity:0.7;margin-bottom:8px;';
    info.innerText = `${obj.mode === 'dark' ? 'Escuridão' : 'Luz'} · ${({ rect: 'Retângulo', circle: 'Círculo', polygon: 'Polígono' })[obj.shape] || obj.shape}`;
    propsEl.appendChild(info);

    if (obj.mode === 'light') {
      this._createPropField(propsEl, 'Luminosidade (grid)', obj.luminosity || 6, val => {
        Lighting.Model.updateObject(obj.id, { luminosity: Number(val) || 1 });
        Lighting.Model._save(); Lighting.Render.draw();
      }, 'number');
      this._createPropField(propsEl, 'Penumbra (grid)', obj.penumbra || 4, val => {
        Lighting.Model.updateObject(obj.id, { penumbra: Number(val) || 0 });
        Lighting.Model._save(); Lighting.Render.draw();
      }, 'number');
    }

    const buttonRow = document.createElement('div');
    buttonRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;';

    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'btn-full';
    toggleBtn.style.fontSize = '0.72em';
    toggleBtn.innerText = obj.mode === 'dark' ? 'Iluminar' : 'Escurecer';
    toggleBtn.onclick = () => { Lighting.Model.toggleObjectMode(obj.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw(); };
    buttonRow.appendChild(toggleBtn);

    const dupBtn = document.createElement('button');
    dupBtn.className = 'btn-full';
    dupBtn.style.fontSize = '0.72em';
    dupBtn.innerText = 'Duplicar';
    dupBtn.onclick = () => { Lighting.Model.duplicateObject(obj.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw(); };
    buttonRow.appendChild(dupBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-full';
    delBtn.style.cssText = 'font-size:0.72em;grid-column:1/-1;background:#7a2a2a;';
    delBtn.innerText = 'Excluir';
    delBtn.onclick = () => {
      Lighting.Model.removeObject(obj.id);
      Lighting.Model._save();
      Lighting.Input.selectedObjectId = null;
      this.refresh();
      Lighting.Render.draw();
    };
    buttonRow.appendChild(delBtn);

    propsEl.appendChild(buttonRow);
  },

  _createPropField(parent, label, value, onChange, type = 'text') {
    const row = document.createElement('div');
    row.style.marginBottom = '7px';
    const lbl = document.createElement('label');
    lbl.innerText = label;
    row.appendChild(lbl);
    const input = document.createElement('input');
    input.type = type;
    input.value = value;
    input.addEventListener('change', e => onChange(e.target.value));
    row.appendChild(input);
    parent.appendChild(row);
  },

  showContextMenu(objId, pos) {
    const obj = Lighting.Model.getObject(objId);
    if (!obj) return;

    // Remove menu anterior
    const old = document.getElementById('lighting-ctx-menu');
    if (old) old.remove();

    const menu = document.createElement('div');
    menu.id = 'lighting-ctx-menu';
    menu.style.cssText =
      `position:fixed;left:${pos.x}px;top:${pos.y}px;` +
      'background:rgba(28,28,28,0.97);border:1px solid rgba(200,200,200,0.25);' +
      'border-radius:7px;padding:4px;z-index:10000;font-size:0.85em;min-width:180px;' +
      'box-shadow:0 4px 14px rgba(0,0,0,0.6);';

    const items = [
      { icon: '✏️', label: 'Renomear',
        action: () => { const n = prompt('Novo nome:', obj.name); if (n) { Lighting.Model.updateObject(obj.id, { name: n }); Lighting.Model._save(); this.refresh(); } } },
      { icon: obj.mode === 'dark' ? '💡' : '🌑',
        label: obj.mode === 'dark' ? 'Iluminar' : 'Escurecer',
        action: () => { Lighting.Model.toggleObjectMode(obj.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw(); } },
      { icon: obj.locked ? '🔓' : '🔒',
        label: obj.locked ? 'Desbloquear' : 'Bloquear',
        action: () => { Lighting.Model.toggleObjectLocked(obj.id); Lighting.Model._save(); this.refresh(); } },
      { icon: '⧉', label: 'Duplicar',
        action: () => { Lighting.Model.duplicateObject(obj.id); Lighting.Model._save(); this.refresh(); Lighting.Render.draw(); } },
      { icon: '🗑', label: 'Excluir',
        action: () => { Lighting.Model.removeObject(obj.id); Lighting.Model._save(); Lighting.Input.selectedObjectId = null; this.refresh(); Lighting.Render.draw(); } },
    ];

    items.forEach(item => {
      const btn = document.createElement('button');
      btn.style.cssText =
        'display:block;width:100%;background:transparent;border:none;color:#ccc;' +
        'padding:8px 10px;text-align:left;cursor:pointer;border-radius:5px;font-size:0.9em;';
      btn.innerHTML = `${item.icon} ${item.label}`;
      btn.onmouseover = () => { btn.style.background = 'rgba(100,100,100,0.3)'; };
      btn.onmouseout  = () => { btn.style.background = 'transparent'; };
      btn.onclick = () => { item.action(); menu.remove(); };
      menu.appendChild(btn);
    });

    document.body.appendChild(menu);

    // Fecha ao clicar fora — com setTimeout para não capturar o clique que abriu
    setTimeout(() => {
      const close = e => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('mousedown', close); } };
      document.addEventListener('mousedown', close);
    }, 0);
  },
};

setTimeout(() => { Lighting.UI.init(); }, 700);
</script>
