<script>
// lighting-input.html — InputManager com suporte completo a edição de paredes
console.log('lighting-input carregado');

window.Lighting = window.Lighting || {};

Lighting.Input = {
  initialized:       false,
  _drag:             null,
  canvas:            null,
  activeTool:        'select',
  selectedObjectId:  null,
  selectedVertexIndex: null,   // índice do vértice de parede selecionado
  toolState:         {},
  _clipboard:        null,     // { type: 'object'|'wall', data: {...} }

  // _drag = {
  //   type: 'obj-move' | 'obj-handle' | 'obj-rotate'
  //       | 'wall-move' | 'wall-vertex' | 'wall-rotate',
  //   id,
  //   startPt,
  //   startObj / startWall,   snapshot imutável no início
  //   handleId?,              para obj-handle
  //   vertexIdx?,             para wall-vertex
  //   cx?, cy?,               centro para rotações
  //   startAngle?,            para rotações
  //   startRotation?,         para obj-rotate (rect)
  //   startPoints?,           para obj-rotate (polygon) / wall-rotate
  // }

  // ── Inicialização ────────────────────────────────────────────
  init() {
    if (this.initialized) return;
    this.initialized = true;

    setTimeout(() => {
      const map = document.getElementById('map-container');
      if (!map) { setTimeout(() => this.init(), 200); return; }

      let canvas = document.getElementById('lighting-interaction-canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = 'lighting-interaction-canvas';
        canvas.style.cssText =
          'position:absolute;top:0;left:0;width:100%;height:100%;z-index:1002;' +
          'pointer-events:auto;background:transparent;cursor:default;';
        map.appendChild(canvas);
      }
      this.canvas = canvas;
      this._syncCanvas();
      this._attachEvents();

      const ro = new ResizeObserver(() => this._syncCanvas());
      ro.observe(map);
      window.addEventListener('resize', () => this._syncCanvas());
    }, 300);
  },

  _syncCanvas() {
    if (!this.canvas) return;
    const map = document.getElementById('map-container');
    if (!map) return;
    this.canvas.width  = map.offsetWidth  || map.clientWidth  || 800;
    this.canvas.height = map.offsetHeight || map.clientHeight || 600;
  },

  _attachEvents() {
    this.canvas.addEventListener('mousedown',   e => this._onDown(e));
    this.canvas.addEventListener('mousemove',   e => this._onMouseMove(e));
    this.canvas.addEventListener('mouseup',     e => this._onUp(e));
    this.canvas.addEventListener('dblclick',    e => this._onDoubleClick(e));
    this.canvas.addEventListener('contextmenu', e => this._onCtx(e));
    window.addEventListener('keydown',          e => this._onKeyDown(e));
  },

  setActiveTool(tool) {
    this.activeTool          = tool;
    this.toolState           = {};
    this._drag               = null;
    this.selectedVertexIndex = null;
    this.canvas.style.cursor = tool === 'select' ? 'default' : 'crosshair';
  },

  _pt(e) { return { x: e.offsetX, y: e.offsetY }; },

  // ── Helpers geométricos ──────────────────────────────────────
  _getObjCenter(obj) {
    if (window.Lighting?.Render?._getCenter) return Lighting.Render._getCenter(obj);
    return { x: obj.x + (obj.width || 100) / 2, y: obj.y + (obj.height || 100) / 2 };
  },

  _wallCenter(wall) {
    if (window.Lighting?.Render?._wallCenter) return Lighting.Render._wallCenter(wall);
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    wall.points.forEach(p => {
      minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
    });
    return { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
  },

  // Distância ponto-segmento
  _distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Math.hypot(px - ax, py - ay);
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  },

  // Hit test em parede: retorna {wallId, type:'wall'} ou null
  _hitTestWall(pt) {
    const HIT = 8;
    // Itera de trás para frente (topo primeiro)
    for (let i = Lighting.Model.walls.length - 1; i >= 0; i--) {
      const wall = Lighting.Model.walls[i];
      if (!wall.visible) continue;
      for (let j = 0; j < wall.points.length - 1; j++) {
        const a = wall.points[j], b = wall.points[j + 1];
        if (this._distToSegment(pt.x, pt.y, a.x, a.y, b.x, b.y) <= HIT) {
          return wall.id;
        }
      }
    }
    return null;
  },

  // Hit test em objeto: retorna id ou null
  _hitTestObject(pt) {
    const gs   = window.VTTGrid?.size || 50;
    const hitR = 8;
    for (let i = Lighting.Model.objects.length - 1; i >= 0; i--) {
      const obj = Lighting.Model.objects[i];
      if (!obj.visible || obj._totalCover) continue;
      if (obj.shape === 'circle') {
        const penumR = ((obj.penumbraDiameterDiameter || 12) / 2) * gs;
        if (Math.hypot(pt.x - obj.x, pt.y - obj.y) <= penumR + hitR) return obj.id;
      } else if (obj.shape === 'rect') {
        let lx = pt.x, ly = pt.y;
        if (obj.rotation) {
          const rot = -(obj.rotation || 0) * Math.PI / 180;
          const cx  = obj.x + (obj.width  || 100) / 2;
          const cy  = obj.y + (obj.height || 100) / 2;
          const dx  = pt.x - cx, dy = pt.y - cy;
          lx = cx + dx * Math.cos(rot) - dy * Math.sin(rot);
          ly = cy + dx * Math.sin(rot) + dy * Math.cos(rot);
        }
        if (lx >= obj.x - hitR && lx <= obj.x + (obj.width  || 100) + hitR &&
            ly >= obj.y - hitR && ly <= obj.y + (obj.height || 100) + hitR) return obj.id;
      } else if (obj.shape === 'polygon' && obj.points?.length >= 3) {
        if (this._pip(pt, obj.points)) return obj.id;
      }
    }
    return null;
  },

  _pip(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
      if ((yi > pt.y) !== (yj > pt.y) &&
          pt.x < ((xj - xi) * (pt.y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  },

  // ── Mouse Down ───────────────────────────────────────────────
  _onDown(e) {
    if (!window.VTTMode || !VTTMode.is('lighting')) return;
    if (e.button !== 0) return;

    const pt = this._pt(e);

    // ── Ferramenta select ────────────────────────────────────
    if (this.activeTool === 'select') {

      // ── Objeto selecionado: testa handles/rotação primeiro ──
      if (this.selectedObjectId) {
        const obj = Lighting.Model.getObject(this.selectedObjectId);
        if (obj && !obj.locked) {

          // Handle de rotação
          const rh = Lighting.Render.getRotateHandlePos(obj);
          if (rh && Math.hypot(pt.x - rh.x, pt.y - rh.y) <= 10) {
            const center = this._getObjCenter(obj);
            this._drag = {
              type:          'obj-rotate',
              id:            obj.id,
              cx:            center.x,
              cy:            center.y,
              startAngle:    Math.atan2(pt.y - center.y, pt.x - center.x) * 180 / Math.PI,
              startRotation: obj.rotation || 0,
              startPoints:   obj.shape === 'polygon'
                ? obj.points.map(p => ({ ...p })) : null,
            };
            return;
          }

          // Vértices de polygon
          if (obj.shape === 'polygon' && obj.points) {
            for (let i = 0; i < obj.points.length; i++) {
              const p = obj.points[i];
              if (Math.hypot(pt.x - p.x, pt.y - p.y) <= 8) {
                this._drag = { type: 'poly-vertex', id: obj.id, vertexIdx: i };
                return;
              }
            }
          }

          // Handles de resize/mover
          const handles = Lighting.Render.getHandles(obj);
          for (const h of handles) {
            if (Math.hypot(pt.x - h.x, pt.y - h.y) <= 10) {
              this._drag = {
                type:     'obj-handle',
                id:       obj.id,
                handleId: h.handleId,
                startPt:  pt,
                startObj: structuredClone(obj),
              };
              return;
            }
          }
        }
      }

      // ── Parede selecionada: testa handles de parede ─────────
      const selWall = Lighting.Model.getWall(Lighting.Model.selectedWallId);
      if (selWall && !selWall.locked) {

        // Handle de rotação de parede
        const wrh = Lighting.Render._wallRotateHandlePos(selWall);
        if (wrh && Math.hypot(pt.x - wrh.x, pt.y - wrh.y) <= 10) {
          const center = this._wallCenter(selWall);
          this._drag = {
            type:        'wall-rotate',
            id:          selWall.id,
            cx:          center.x,
            cy:          center.y,
            startAngle:  Math.atan2(pt.y - center.y, pt.x - center.x) * 180 / Math.PI,
            startPoints: selWall.points.map(p => ({ ...p })),
          };
          return;
        }

        // Vértices de parede
        for (let i = 0; i < selWall.points.length; i++) {
          const p = selWall.points[i];
          if (Math.hypot(pt.x - p.x, pt.y - p.y) <= 8) {
            this.selectedVertexIndex = i;
            this._drag = {
              type:      'wall-vertex',
              id:        selWall.id,
              vertexIdx: i,
            };
            Lighting.Render.draw();
            return;
          }
        }

        // Midpoints (inserção de vértice via drag direto)
        for (let i = 0; i < selWall.points.length - 1; i++) {
          const a  = selWall.points[i], b = selWall.points[i + 1];
          const mx = (a.x + b.x) / 2,  my = (a.y + b.y) / 2;
          if (Math.hypot(pt.x - mx, pt.y - my) <= 8) {
            Lighting.Model.insertWallVertex(selWall.id, i);
            Lighting.Model._save();
            const newIdx = i + 1;
            this.selectedVertexIndex = newIdx;
            this._drag = {
              type:      'wall-vertex',
              id:        selWall.id,
              vertexIdx: newIdx,
            };
            Lighting.Render.draw();
            return;
          }
        }

        // Clique no corpo da parede selecionada → mover
        const wallHit = this._hitTestWall(pt);
        if (wallHit === selWall.id) {
          this.selectedVertexIndex = null;
          this._drag = {
            type:      'wall-move',
            id:        selWall.id,
            startPt:   pt,
            startWall: { points: selWall.points.map(p => ({ ...p })) },
          };
          return;
        }
      }

      // ── Nenhum handle ativo: hit test geral ─────────────────
      const objHit  = this._hitTestObject(pt);
      const wallHit = this._hitTestWall(pt);

      if (objHit) {
        this.selectedObjectId = objHit;
        Lighting.Model.clearWallSelection();
        this.selectedVertexIndex = null;
        const obj = Lighting.Model.getObject(objHit);
        if (obj && !obj.locked) {
          this._drag = {
            type:     obj.shape === 'polygon' ? 'poly-move' : 'obj-move',
            id:       objHit,
            startPt:  pt,
            startObj: obj.shape === 'polygon'
              ? { points: obj.points.map(p => ({ ...p })) }
              : { x: obj.x, y: obj.y },
          };
        }
      } else if (wallHit) {
        this.selectedObjectId = null;
        Lighting.Model.selectWall(wallHit);
        this.selectedVertexIndex = null;
        const wall = Lighting.Model.getWall(wallHit);
        if (wall && !wall.locked) {
          this._drag = {
            type:      'wall-move',
            id:        wallHit,
            startPt:   pt,
            startWall: { points: wall.points.map(p => ({ ...p })) },
          };
        }
      } else {
        // Clique no vazio: deseleciona tudo
        this.selectedObjectId    = null;
        this.selectedVertexIndex = null;
        Lighting.Model.clearWallSelection();
        this._drag = null;
      }

      Lighting.Render.draw();
      if (window.Lighting?.UI) Lighting.UI.refresh();
      return;
    }

    // ── Ferramenta rect ──────────────────────────────────────
    if (this.activeTool === 'rect') {
      this.toolState = { start: pt };
      return;
    }

    // ── Ferramenta circle ────────────────────────────────────
    if (this.activeTool === 'circle') {
      this.toolState = { start: pt };
      return;
    }

    // ── Ferramenta polygon ───────────────────────────────────
    if (this.activeTool === 'polygon') {
      if (!this.toolState.points) this.toolState.points = [];
      const pts = this.toolState.points;
      if (pts.length >= 3) {
        const first = pts[0];
        if (Math.hypot(pt.x - first.x, pt.y - first.y) < 14) {
          Lighting.Model.addObject({
            name: 'Polígono', shape: 'polygon', x: 0, y: 0,
            points: pts.slice(),
          });
          Lighting.Model._save();
          this.toolState = {};
          this.setActiveTool('select');
          Lighting.Render.draw();
          if (window.Lighting?.UI) Lighting.UI.refresh();
          return;
        }
      }
      pts.push({ x: pt.x, y: pt.y });
      Lighting.Render.draw();
      return;
    }

    // ── Ferramenta wall ──────────────────────────────────────
    // Comportamento: cliques adicionam vértices; Enter ou duplo-clique finaliza.
    if (this.activeTool === 'wall') {
      if (!this.toolState.points) this.toolState.points = [];
      this.toolState.points.push({ x: pt.x, y: pt.y });
      Lighting.Render.draw();
      return;
    }
  },

  // ── Mouse Move ───────────────────────────────────────────────
  _onMouseMove(e) {
    if (!window.VTTMode || !VTTMode.is('lighting')) return;
    const pt = this._pt(e);

    // ── Drag ativo ───────────────────────────────────────────
    if (this._drag) {
      const drag = this._drag;

      if (drag.type === 'obj-move') {
        const dx = pt.x - drag.startPt.x, dy = pt.y - drag.startPt.y;
        Lighting.Model.updateObject(drag.id, {
          x: drag.startObj.x + dx,
          y: drag.startObj.y + dy,
        });

      } else if (drag.type === 'poly-move') {
        const dx = pt.x - drag.startPt.x, dy = pt.y - drag.startPt.y;
        Lighting.Model.updateObject(drag.id, {
          points: drag.startObj.points.map(p => ({ x: p.x + dx, y: p.y + dy })),
        });

      } else if (drag.type === 'poly-vertex') {
        const obj = Lighting.Model.getObject(drag.id);
        if (!obj) { this._drag = null; return; }
        const newPts = obj.points.map((p, i) =>
          i === drag.vertexIdx ? { x: pt.x, y: pt.y } : { ...p }
        );
        Lighting.Model.updateObject(drag.id, { points: newPts });

      } else if (drag.type === 'obj-rotate') {
        const angle = Math.atan2(pt.y - drag.cy, pt.x - drag.cx) * 180 / Math.PI;
        const delta = angle - drag.startAngle;
        const rad   = delta * Math.PI / 180;
        if (drag.startPoints) {
          const newPts = drag.startPoints.map(p => {
            const dx = p.x - drag.cx, dy = p.y - drag.cy;
            return {
              x: drag.cx + dx * Math.cos(rad) - dy * Math.sin(rad),
              y: drag.cy + dx * Math.sin(rad) + dy * Math.cos(rad),
            };
          });
          Lighting.Model.updateObject(drag.id, { points: newPts });
        } else {
          Lighting.Model.updateObject(drag.id, {
            rotation: ((drag.startRotation + delta) % 360 + 360) % 360,
          });
        }

      } else if (drag.type === 'obj-handle') {
        const obj = Lighting.Model.getObject(drag.id);
        if (!obj) { this._drag = null; return; }
        this._applyHandle(obj, drag.handleId, pt, drag.startObj, drag.startPt);

      } else if (drag.type === 'wall-move') {
        const dx = pt.x - drag.startPt.x, dy = pt.y - drag.startPt.y;
        Lighting.Model.updateWall(drag.id, {
          points: drag.startWall.points.map(p => ({ x: p.x + dx, y: p.y + dy })),
        });

      } else if (drag.type === 'wall-vertex') {
        const wall = Lighting.Model.getWall(drag.id);
        if (!wall) { this._drag = null; return; }
        const newPts = wall.points.map((p, i) =>
          i === drag.vertexIdx ? { x: pt.x, y: pt.y } : { ...p }
        );
        Lighting.Model.updateWall(drag.id, { points: newPts });

      } else if (drag.type === 'wall-rotate') {
        const angle = Math.atan2(pt.y - drag.cy, pt.x - drag.cx) * 180 / Math.PI;
        const delta = angle - drag.startAngle;
        const rad   = delta * Math.PI / 180;
        const newPts = drag.startPoints.map(p => {
          const dx = p.x - drag.cx, dy = p.y - drag.cy;
          return {
            x: drag.cx + dx * Math.cos(rad) - dy * Math.sin(rad),
            y: drag.cy + dx * Math.sin(rad) + dy * Math.cos(rad),
          };
        });
        Lighting.Model.updateWall(drag.id, { points: newPts });
      }

      Lighting.Render.draw();
      return;
    }

    // ── Previews de ferramentas ──────────────────────────────
    if (this.activeTool === 'rect'    && this.toolState.start)  {
      this.toolState.current = pt; Lighting.Render.draw(); return;
    }
    if (this.activeTool === 'circle'  && this.toolState.start)  {
      this.toolState.current = pt; Lighting.Render.draw(); return;
    }
    if (this.activeTool === 'polygon' && this.toolState.points) {
      this.toolState.current = pt; Lighting.Render.draw(); return;
    }
    if (this.activeTool === 'wall'    && this.toolState.points) {
      this.toolState.current = pt; Lighting.Render.draw(); return;
    }

    Lighting.Render.draw();
  },

  // ── Mouse Up ─────────────────────────────────────────────────
  _onUp(e) {
    if (!window.VTTMode || !VTTMode.is('lighting')) return;
    const pt = this._pt(e);

    // Finaliza drag
    if (this._drag) {
      Lighting.Model._save();
      if (window.Lighting?.UI) Lighting.UI.refresh();
      this._drag = null;
      this.canvas.style.cursor = 'default';
      Lighting.Render.draw();
      return;
    }

    // ── Finaliza rect ────────────────────────────────────────
    if (this.activeTool === 'rect' && this.toolState.start) {
      const x1 = Math.min(this.toolState.start.x, pt.x);
      const y1 = Math.min(this.toolState.start.y, pt.y);
      const w  = Math.abs(pt.x - this.toolState.start.x);
      const h  = Math.abs(pt.y - this.toolState.start.y);
      if (w > 5 && h > 5) {
        const obj = Lighting.Model.addObject({
          name: 'Retângulo', shape: 'rect',
          x: x1, y: y1, width: w, height: h, rotation: 0,
        });
        this.selectedObjectId = obj.id;
        Lighting.Model._save();
        if (window.Lighting?.UI) Lighting.UI.refresh();
      }
      this.toolState = {};
      this.setActiveTool('select');
      Lighting.Render.draw();
      return;
    }

    // ── Finaliza circle ──────────────────────────────────────
    if (this.activeTool === 'circle' && this.toolState.start) {
      const dx = pt.x - this.toolState.start.x;
      const dy = pt.y - this.toolState.start.y;
      const r  = Math.sqrt(dx * dx + dy * dy);
      const gs = window.VTTGrid?.size || 50;
      if (r > 5) {
        const lightDiam = Math.max(1, Math.round((r / gs) * 2 * 10) / 10);
        const obj = Lighting.Model.addObject({
          name:             'Fonte de Luz',
          shape:            'circle',
          mode:             'light',
          x:                this.toolState.start.x,
          y:                this.toolState.start.y,
          lightDiameter:    lightDiam,
          penumbraDiameter: lightDiam * 2,
        });
        this.selectedObjectId = obj.id;
        Lighting.Model._save();
        if (window.Lighting?.UI) Lighting.UI.refresh();
      }
      this.toolState = {};
      this.setActiveTool('select');
      Lighting.Render.draw();
      return;
    }
  },

  // ── Duplo clique ─────────────────────────────────────────────
  _onDoubleClick(e) {
    if (!window.VTTMode || !VTTMode.is('lighting')) return;
    const pt = this._pt(e);

    // Fecha polígono
    if (this.activeTool === 'polygon' &&
        this.toolState.points?.length >= 3) {
      const pts = this.toolState.points;
      pts.pop(); // remove o ponto extra do mousedown do dblclick
      if (pts.length < 3) return;
      Lighting.Model.addObject({
        name: 'Polígono', shape: 'polygon', x: 0, y: 0,
        points: pts.slice(),
      });
      Lighting.Model._save();
      this.toolState = {};
      this.setActiveTool('select');
      Lighting.Render.draw();
      if (window.Lighting?.UI) Lighting.UI.refresh();
      return;
    }

    // Finaliza parede
    if (this.activeTool === 'wall' &&
        this.toolState.points?.length >= 2) {
      const pts = this.toolState.points.slice();
      pts.pop(); // remove o ponto extra do mousedown do dblclick
      if (pts.length < 2) return;
      const wall = Lighting.Model.addWall(pts);
      Lighting.Model._save();
      Lighting.Model.selectWall(wall.id);
      this.toolState = {};
      this.setActiveTool('select');
      Lighting.Render.draw();
      if (window.Lighting?.UI) Lighting.UI.refresh();
      return;
    }

    // Duplo clique em segmento de parede selecionada → insere vértice
    if (this.activeTool === 'select') {
      const selWall = Lighting.Model.getWall(Lighting.Model.selectedWallId);
      if (selWall && !selWall.locked) {
        for (let i = 0; i < selWall.points.length - 1; i++) {
          const a = selWall.points[i], b = selWall.points[i + 1];
          if (this._distToSegment(pt.x, pt.y, a.x, a.y, b.x, b.y) <= 10) {
            Lighting.Model.insertWallVertex(selWall.id, i);
            Lighting.Model._save();
            Lighting.Render.draw();
            if (window.Lighting?.UI) Lighting.UI.refresh();
            return;
          }
        }
      }
    }
  },

  // ── Context menu ─────────────────────────────────────────────
  _onCtx(e) {
    if (!window.VTTMode || !VTTMode.is('lighting')) return;
    e.preventDefault();
    e.stopPropagation();
    const pt      = this._pt(e);
    const objHit  = this._hitTestObject(pt);
    const wallHit = this._hitTestWall(pt);

    if (objHit) {
      this.selectedObjectId = objHit;
      Lighting.Model.clearWallSelection();
      Lighting.Render.draw();
      setTimeout(() => {
        if (window.Lighting?.UI) Lighting.UI.showContextMenu(objHit, { x: e.clientX, y: e.clientY });
      }, 0);
    } else if (wallHit) {
      this.selectedObjectId = null;
      Lighting.Model.selectWall(wallHit);
      Lighting.Render.draw();
      setTimeout(() => {
        if (window.Lighting?.UI) Lighting.UI.showWallContextMenu(wallHit, { x: e.clientX, y: e.clientY });
      }, 0);
    }
  },

  // ── Teclado ──────────────────────────────────────────────────
  _onKeyDown(e) {
    if (!window.VTTMode || !VTTMode.is('lighting')) return;

    // Enter finaliza parede em andamento
    if (e.key === 'Enter' && this.activeTool === 'wall') {
      const pts = this.toolState.points;
      if (pts?.length >= 2) {
        const wall = Lighting.Model.addWall(pts.slice());
        Lighting.Model._save();
        Lighting.Model.selectWall(wall.id);
        this.toolState = {};
        this.setActiveTool('select');
        Lighting.Render.draw();
        if (window.Lighting?.UI) Lighting.UI.refresh();
      }
      return;
    }

    // Escape cancela ferramenta em andamento
    if (e.key === 'Escape') {
      this.toolState = {};
      this.setActiveTool('select');
      Lighting.Render.draw();
      return;
    }

    // Delete / Backspace
    if (e.key === 'Delete' || e.key === 'Backspace') {
      // Se há vértice selecionado em parede → remove o vértice
      if (this.selectedVertexIndex !== null &&
          Lighting.Model.selectedWallId !== null) {
        Lighting.Model.removeWallVertex(
          Lighting.Model.selectedWallId,
          this.selectedVertexIndex
        );
        this.selectedVertexIndex = null;
        Lighting.Model._save();
        Lighting.Render.draw();
        if (window.Lighting?.UI) Lighting.UI.refresh();
        return;
      }
      // Parede selecionada → remove parede
      if (Lighting.Model.selectedWallId !== null) {
        Lighting.Model.removeWall(Lighting.Model.selectedWallId);
        Lighting.Model._save();
        Lighting.Render.draw();
        if (window.Lighting?.UI) Lighting.UI.refresh();
        return;
      }
      // Objeto selecionado → remove objeto
      if (this.selectedObjectId !== null) {
        Lighting.Model.removeObject(this.selectedObjectId);
        this.selectedObjectId = null;
        Lighting.Model._save();
        Lighting.Render.draw();
        if (window.Lighting?.UI) Lighting.UI.refresh();
        return;
      }
    }

    // Ctrl+C — copiar
    if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
      if (Lighting.Model.selectedWallId !== null) {
        const wall = Lighting.Model.getWall(Lighting.Model.selectedWallId);
        if (wall) this._clipboard = { type: 'wall', data: structuredClone(wall) };
      } else if (this.selectedObjectId !== null) {
        const obj = Lighting.Model.getObject(this.selectedObjectId);
        if (obj) this._clipboard = { type: 'object', data: structuredClone(obj) };
      }
      return;
    }

    // Ctrl+V — colar
    if ((e.ctrlKey || e.metaKey) && e.key === 'v') {
      if (!this._clipboard) return;
      const gs = window.VTTGrid?.size || 50;
      if (this._clipboard.type === 'wall') {
        const copy = Lighting.Model.duplicateWall(
          // Usamos o id guardado no clipboard para clonar via Model
          this._clipboard.data.id
        );
        if (copy) {
          Lighting.Model.selectWall(copy.id);
          Lighting.Model._save();
          Lighting.Render.draw();
          if (window.Lighting?.UI) Lighting.UI.refresh();
        }
      } else if (this._clipboard.type === 'object') {
        const copy = Lighting.Model.duplicateObject(this._clipboard.data.id);
        if (copy) {
          this.selectedObjectId = copy.id;
          Lighting.Model._save();
          Lighting.Render.draw();
          if (window.Lighting?.UI) Lighting.UI.refresh();
        }
      }
      return;
    }
  },

  // ── Aplicar handle de objeto ─────────────────────────────────
  _applyHandle(obj, handleId, pt, s, startPt) {
    const gs = window.VTTGrid?.size || 50;

    if (obj.shape === 'rect') {
      let { x, y, width: w, height: h } = s;
      if (handleId === 'tl') { const nw=(x+w)-pt.x, nh=(y+h)-pt.y; if(nw>10&&nh>10){x=pt.x;y=pt.y;w=nw;h=nh;} }
      if (handleId === 'tr') { const nw=pt.x-x,     nh=(y+h)-pt.y; if(nw>10&&nh>10){y=pt.y;w=nw;h=nh;} }
      if (handleId === 'bl') { const nw=(x+w)-pt.x, nh=pt.y-y;     if(nw>10&&nh>10){x=pt.x;w=nw;h=nh;} }
      if (handleId === 'br') { const nw=pt.x-x,     nh=pt.y-y;     if(nw>10&&nh>10){w=nw;h=nh;} }
      if (handleId === 'tm') { const nh=(y+h)-pt.y; if(nh>10){y=pt.y;h=nh;} }
      if (handleId === 'bm') { const nh=pt.y-y;     if(nh>10) h=nh; }
      if (handleId === 'ml') { const nw=(x+w)-pt.x; if(nw>10){x=pt.x;w=nw;} }
      if (handleId === 'mr') { const nw=pt.x-x;     if(nw>10) w=nw; }
      Lighting.Model.updateObject(obj.id, { x, y, width: w, height: h });

    } else if (obj.shape === 'circle') {
      if (handleId === 'light-r') {
        const dist = Math.abs(pt.x - s.x);
        Lighting.Model.updateObject(obj.id, {
          lightDiameter: Math.max(0.5, Math.round((dist / gs) * 2 * 10) / 10),
        });
      }
      if (handleId === 'penum-r') {
        const dist = Math.abs(pt.x - s.x);
        Lighting.Model.updateObject(obj.id, {
          penumbraDiameter: Math.max(0.5, Math.round((dist / gs) * 2 * 10) / 10),
        });
      }
      if (handleId === 'center') {
        const dx = pt.x - startPt.x, dy = pt.y - startPt.y;
        Lighting.Model.updateObject(obj.id, { x: s.x + dx, y: s.y + dy });
      }
    }
  },
};

Lighting.Input.init();
</script>
