<script>
// ============================================================
// MINARDI VTT — LightPlugin
// light-raycast.html — Raycasting: luz vs paredes
//
// Responsabilidade única: dado um ponto de origem e um conjunto
// de paredes, retornar um polígono de visibilidade que representa
// a área iluminada por aquela fonte.
// ============================================================

console.log("light-raycast carregado");

window.LightPlugin = window.LightPlugin || {};

LightPlugin.Raycast = {

  // ============================================================
  // Calcula o polígono de visibilidade de uma fonte de luz.
  //
  // origin  = { x, y }          — centro da fonte
  // radius  = number            — raio máximo em pixels
  // walls   = [{points:[{x,y},{x,y},...]}]
  // canvasW, canvasH            — bounds do canvas
  //
  // Retorna array de {x,y} formando o polígono iluminado.
  // ============================================================

  compute(origin, radius, walls, canvasW, canvasH) {
    // Fast path: no walls -> simple circle poly
    if (!walls || walls.length === 0) return this._circlePoly(origin, radius, 64);

    // Build a flat list of segments (x1,y1,x2,y2)
    const segs = this._buildSegments(walls);

    // Collect unique vertex points from segments
    const verts = this._collectVertices(segs);

    // For each vertex compute angle and include tiny offsets to avoid missing edges
    const angs = [];
    for (let i = 0; i < verts.length; i++) {
      const v = verts[i];
      const a = Math.atan2(v.y - origin.y, v.x - origin.x);
      angs.push(a - 0.0001, a, a + 0.0001);
    }

    // Deduplicate and sort angles
    angs.sort((a, b) => a - b);
    const uniq = [];
    for (let i = 0; i < angs.length; i++) {
      if (i === 0 || Math.abs(angs[i] - angs[i - 1]) > 1e-7) uniq.push(angs[i]);
    }

    // Cast rays for each angle and collect nearest hit (clamped to radius)
    const hits = [];
    const ox = origin.x, oy = origin.y;
    for (let i = 0; i < uniq.length; i++) {
      const angle = uniq[i];
      const dx = Math.cos(angle), dy = Math.sin(angle);

      let nearestT = radius;
      let hitX = ox + dx * radius, hitY = oy + dy * radius;

      for (let s = 0; s < segs.length; s++) {
        const seg = segs[s];
        const t = this._raySegIntersect(ox, oy, dx, dy, seg.x1, seg.y1, seg.x2, seg.y2);
        if (t !== null && t >= 0 && t < nearestT) {
          nearestT = t;
          hitX = ox + dx * t;
          hitY = oy + dy * t;
        }
      }

      // clamp to canvas bounds (optional) — ensure points remain finite
      if (!isFinite(hitX) || !isFinite(hitY)) {
        hitX = ox + dx * radius;
        hitY = oy + dy * radius;
      }

      hits.push({ x: hitX, y: hitY, angle });
    }

    // Sort by angle and return
    hits.sort((a, b) => a.angle - b.angle);
    return hits;
  },

  _circlePoly(origin, radius, resolution = 64) {
    const pts = [];
    for (let i = 0; i < resolution; i++) {
      const angle = (i / resolution) * Math.PI * 2;
      pts.push({
        x: origin.x + Math.cos(angle) * radius,
        y: origin.y + Math.sin(angle) * radius,
        angle
      });
    }
    return pts;
  },

  // ---- Constrói segmentos de parede + bounding box ----
  _buildSegments(walls) {
    const segs = [];

    // Support multiple wall shapes: either {points:[...]} or simple [{p1:{x,y},p2:{x,y}}]
    for (let w = 0; w < walls.length; w++) {
      const wall = walls[w];
      if (wall.points && wall.points.length >= 2) {
        const pts = wall.points;
        for (let i = 0; i < pts.length - 1; i++) {
          segs.push({ x1: pts[i].x, y1: pts[i].y, x2: pts[i+1].x, y2: pts[i+1].y });
        }
      } else if (wall.p1 && wall.p2) {
        segs.push({ x1: wall.p1.x, y1: wall.p1.y, x2: wall.p2.x, y2: wall.p2.y });
      }
    }

    return segs;
  },

  // Collect unique vertices from segments
  _collectVertices(segs) {
    const verts = [];
    const seen = new Map();
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      const k1 = `${s.x1},${s.y1}`;
      if (!seen.has(k1)) { seen.set(k1, true); verts.push({ x: s.x1, y: s.y1 }); }
      const k2 = `${s.x2},${s.y2}`;
      if (!seen.has(k2)) { seen.set(k2, true); verts.push({ x: s.x2, y: s.y2 }); }
    }
    return verts;
  },

  // ---- Coleta ângulos para todos os vértices dos segmentos ----
  _collectAngles(origin, segs) {
    const angles = new Set();
    segs.forEach(s => {
      [[s.x1, s.y1], [s.x2, s.y2]].forEach(([x, y]) => {
        const a = Math.atan2(y - origin.y, x - origin.x);
        angles.add(a - 0.0001);
        angles.add(a);
        angles.add(a + 0.0001);
      });
    });
    return Array.from(angles);
  },

  // ---- Lança raios em cada ângulo e encontra o ponto de impacto ----
  _castRays(origin, angles, segs, radius) {
    const hits = [];

    angles.forEach(angle => {
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);

      // Ray: origem → origem + radius * direção
      let minT = radius * 2;
      let hitX = origin.x + dx * radius;
      let hitY = origin.y + dy * radius;

      segs.forEach(s => {
        const t = this._raySegIntersect(
          origin.x, origin.y, dx, dy,
          s.x1, s.y1, s.x2, s.y2
        );
        if (t !== null && t < minT) {
          minT = t;
          hitX = origin.x + dx * t;
          hitY = origin.y + dy * t;
        }
      });

      // Limita ao raio
      const dist = Math.hypot(hitX - origin.x, hitY - origin.y);
      if (dist > radius) {
        hitX = origin.x + dx * radius;
        hitY = origin.y + dy * radius;
      }

      hits.push({ x: hitX, y: hitY, angle });
    });

    // Ordena por ângulo para formar o polígono
    hits.sort((a, b) => a.angle - b.angle);
    return hits;
  },

  // ---- Interseção raio com segmento ----
  // Retorna t (distância ao longo do raio) ou null se não intersecta
  _raySegIntersect(ox, oy, dx, dy, x1, y1, x2, y2) {
    const ex = x2 - x1, ey = y2 - y1;
    const denom = dx * ey - dy * ex;
    if (Math.abs(denom) < 1e-10) return null;

    const tx = x1 - ox, ty = y1 - oy;
    const t = (tx * ey - ty * ex) / denom;
    const u = (tx * dy - ty * dx) / denom;

    if (t > 0 && u >= 0 && u <= 1) return t;
    return null;
  }
};
</script>
