<script>
// lighting-control.html — API pública simples
console.log('lighting-control carregado');

window.Lighting = window.Lighting || {};
Lighting.Control = {
  toggleTokenLight(tokenId) {
    const existing = Lighting.Model.objects.find((o) => o.tokenId === tokenId);
    if (existing) {
      Lighting.Model.removeObject(existing.id);
      Lighting.Model._save();
      Lighting.Render.draw();
      return null;
    }

    if (!window.TokenPlugin || !TokenPlugin.Model) return null;
    const t = TokenPlugin.Model.all().find((tt) => tt.id === tokenId);
    if (!t) return null;

    const gs = window.VTTGrid?.size || Lighting.Model.gridSize || 50;
    const x = t.gx * gs + (t.cells * gs) / 2;
    const y = t.gy * gs + (t.cells * gs) / 2;

    const l = Lighting.Model.addObject({
      name: 'Tocha - ' + (t.appearance?.name || 'Token'),
      shape: 'circle',
      mode: 'light',
      x,
      y,
      radius: (t.light?.radius || 6) * gs,
      luminosity: t.light?.radius || 6,
      penumbra: t.light?.dimRadius || 12,
      type: 'token',
      tokenId: tokenId,
      lightSource: true,
    });

    Lighting.Model._save();
    Lighting.Render.buildSpatialIndex();
    Lighting.Render.draw();
    return l;
  },

  attachTokenMovementPolling(intervalMs = 100) {
    if (this._poller) return;
    this._poller = setInterval(() => {
      const tokens = window.TokenPlugin?.Model?.all ? TokenPlugin.Model.all() : [];
      tokens.forEach((t) => {
        const l = Lighting.Model.objects.find((ll) => ll.tokenId === t.id);
        if (l) {
          const gs = window.VTTGrid?.size || Lighting.Model.gridSize || 50;
          const nx = t.gx * gs + (t.cells * gs) / 2;
          const ny = t.gy * gs + (t.cells * gs) / 2;
          if (l.x !== nx || l.y !== ny) {
            l.x = nx;
            l.y = ny;
            Lighting.Render.draw();
          }
        }
      });
    }, intervalMs);
  },
};

// Start token poller automatically
setTimeout(() => {
  Lighting.Control.attachTokenMovementPolling(120);
}, 400);
</script>
