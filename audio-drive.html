<script>
/* ============================================================
   AudioPlugin.Drive — VERSÃO CORRIGIDA (compatível com o boot
   e com audio-ui.html / audio-control.html já existentes)
   ------------------------------------------------------------
   O bug original: este arquivo tinha connect/scanLibrary/
   rescanLibrary mas NÃO tinha init(), e audio-main.html chama
   AudioPlugin.Drive.init() no boot. Resultado: TypeError e o
   AudioPlugin inteiro para de inicializar (Player, Control, UI
   nunca rodam, porque o boot quebra antes de chegar neles).

   Esta versão:
   1. Adiciona init() (não faz nada de especial, só loga — mantém
      o boot compatível com os outros módulos que também têm
      init() vazio/simples).
   2. scanAudioLibrary() no servidor retorna {id, name} por track
      (sem dataUrl) — então cada track novo é "carregado sob
      demanda" pelo Player via _loadAudioById, que é chamado
      diretamente por audio-control.html. Por isso este arquivo
      NÃO precisa de buildUrl() nem de lógica de URL pública:
      isso é responsabilidade do audio-player.html.
   ============================================================ */

window.AudioPlugin = window.AudioPlugin || {};

AudioPlugin.Drive = {

  _scanning: false,

  init() {
    console.log("AudioPlugin.Drive INIT");
  },

  connect(onSuccess, onError) {
    google.script.run
      .withSuccessHandler(result => {
        if (result && result.error) {
          console.error("[AudioPlugin.Drive] Erro ao conectar:", result.error);
          if (onError) onError(result.error);
          return;
        }
        AudioPlugin.Model.audioFolderId = result.audioFolderId;
        AudioPlugin.Model._saveToStorage();
        console.log("[AudioPlugin.Drive] Conectado. audioFolderId:", result.audioFolderId);
        if (onSuccess) onSuccess(result.audioFolderId);
        // Conectar já dispara o primeiro scan, igual ao comportamento
        // original (_onConnectClick chamava scanLibrary só quando já
        // havia um ID digitado; aqui cobrimos o caso de ID novo).
        AudioPlugin.Drive.scanLibrary();
      })
      .withFailureHandler(err => {
        console.error("[AudioPlugin.Drive] Falha RPC ensureAudioStructure:", err.message);
        if (onError) onError(err.message);
      })
      .ensureAudioStructure();
  },

  scanLibrary(onSuccess, onError) {
    const folderId = AudioPlugin.Model.audioFolderId;
    if (!folderId) {
      const msg = "audioFolderId não definido. Conecte o Drive primeiro.";
      console.warn("[AudioPlugin.Drive]", msg);
      if (onError) onError(msg);
      return;
    }
    if (this._scanning) {
      console.warn("[AudioPlugin.Drive] Scan já em andamento, ignorando chamada duplicada.");
      return;
    }
    this._scanning = true;
    if (AudioPlugin.UI && AudioPlugin.UI.setStatus) {
      AudioPlugin.UI.setStatus("⏳ Escaneando biblioteca...");
    }

    google.script.run
      .withSuccessHandler(result => {
        AudioPlugin.Drive._scanning = false;
        if (result && result.error) {
          console.error("[AudioPlugin.Drive] Erro ao escanear:", result.error);
          if (AudioPlugin.UI && AudioPlugin.UI.setStatus) {
            AudioPlugin.UI.setStatus("❌ " + result.error);
          }
          if (onError) onError(result.error);
          return;
        }
        // result = { music: {...}, ambience: {...}, effects: {...} }
        // cada track = { id, name } — SEM dataUrl/url.
        AudioPlugin.Model.setLibrary(result);
        if (AudioPlugin.UI) {
          if (AudioPlugin.UI.setStatus) AudioPlugin.UI.setStatus("✅ Biblioteca carregada.");
          if (AudioPlugin.UI.renderLibrary) AudioPlugin.UI.renderLibrary();
        }
        console.log("[AudioPlugin.Drive] Biblioteca carregada (modo id sob demanda).");
        if (onSuccess) onSuccess(result);
      })
      .withFailureHandler(err => {
        AudioPlugin.Drive._scanning = false;
        console.error("[AudioPlugin.Drive] Falha RPC scanAudioLibrary:", err.message);
        if (AudioPlugin.UI && AudioPlugin.UI.setStatus) {
          AudioPlugin.UI.setStatus("❌ " + err.message);
        }
        if (onError) onError(err.message);
      })
      .scanAudioLibrary(folderId);
  },

  rescanLibrary() {
    this.scanLibrary(
      () => console.log("[AudioPlugin.Drive] Rescan completo."),
      err => console.error("[AudioPlugin.Drive] Rescan falhou:", err)
    );
  }
};
</script>
