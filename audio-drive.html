<script>
/* ============================================================
   AudioPlugin.Drive — VERSÃO MIGRADA (sem base64)
   ------------------------------------------------------------
   Mudança principal: scanAudioLibrary() agora retorna apenas
   {id, name} por track. A URL pública é montada aqui no client
   com AudioPlugin.Drive.buildUrl(fileId), nunca mais com
   "data:audio/...;base64,...".

   Pré-requisito: os arquivos no Drive precisam estar com
   permissão "Qualquer pessoa com o link pode visualizar".
   ============================================================ */

window.AudioPlugin = window.AudioPlugin || {};

AudioPlugin.Drive = {

  _scanning: false,

  /**
   * Monta a URL pública de streaming a partir do fileId.
   * Esta é a função-chave da migração: antes a track já vinha
   * com track.url pronto (base64). Agora track.id vem do servidor
   * e a URL é construída aqui, sob demanda.
   */
  buildUrl(fileId) {
    if (!fileId) return null;
    return "https://drive.google.com/uc?export=view&id=" + fileId;
  },

  connect(onSuccess, onError) {
    google.script.run
      .withSuccessHandler(result => {
        if (result && result.error) {
          console.error("[AudioPlugin.Drive] Erro ao conectar:", result.error);
          if (onError) onError(result.error);
          return;
        }
        AudioPlugin.Model.setAudioFolderId(result.audioFolderId);
        console.log("[AudioPlugin.Drive] Conectado. audioFolderId:", result.audioFolderId);
        if (onSuccess) onSuccess(result.audioFolderId);
      })
      .withFailureHandler(err => {
        console.error("[AudioPlugin.Drive] Falha RPC ensureAudioStructure:", err.message);
        if (onError) onError(err.message);
      })
      .ensureAudioStructure();
  },

  scanLibrary(onSuccess, onError) {
    const folderId = AudioPlugin.Model.getAudioFolderId();
    if (!folderId) {
      if (onError) onError("audioFolderId não definido. Conecte o Drive primeiro.");
      return;
    }
    if (this._scanning) {
      console.warn("[AudioPlugin.Drive] Scan já em andamento, ignorando chamada duplicada.");
      return;
    }
    this._scanning = true;

    google.script.run
      .withSuccessHandler(result => {
        AudioPlugin.Drive._scanning = false;
        if (result && result.error) {
          console.error("[AudioPlugin.Drive] Erro ao escanear:", result.error);
          if (onError) onError(result.error);
          return;
        }
        // result = { music: {...}, ambience: {...}, effects: {...} }
        // cada track = { id, name } — SEM dataUrl.
        AudioPlugin.Model.setLibrary(result);
        console.log("[AudioPlugin.Drive] Biblioteca carregada (modo URL direta).");
        if (onSuccess) onSuccess(result);
      })
      .withFailureHandler(err => {
        AudioPlugin.Drive._scanning = false;
        console.error("[AudioPlugin.Drive] Falha RPC scanAudioLibrary:", err.message);
        if (onError) onError(err.message);
      })
      .scanAudioLibrary(folderId);
  },

  rescanLibrary() {
    this.scanLibrary(
      () => console.log("[AudioPlugin.Drive] Rescan completo."),
      err => console.error("[AudioPlugin.Drive] Rescan falhou:", err)
    );
  }
};
</script>
