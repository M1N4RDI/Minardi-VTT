<script>
// ============================================================
// MINARDI VTT — AudioPlugin
// audio-drive.html — Comunicação com o Google Drive
// ============================================================

console.log("audio-drive carregado");

window.AudioPlugin = window.AudioPlugin || {};

AudioPlugin.Drive = {

  _scanning: false,

  init() {
    console.log("AudioPlugin.Drive INIT");
  },

  // ============================================================
  // Garante estrutura de pastas e escaneia a biblioteca.
  // Chamado pelo botão "Conectar" na UI ou no boot se já houver folderId salvo.
  // ============================================================

  connect(onSuccess, onError) {
    if (this._scanning) return;
    this._scanning = true;
    // Etapa 0: se já temos a pasta Audio/ identificada via biblioteca raiz,
    // podemos pular o ensureAudioStructure e ir direto para scanLibrary.
    // Isso evita criar estrutura de pastas duplicada.
    var audioAssets = window.BibliotecaPlugin
      ? BibliotecaPlugin.Model.getAssetsPorTipo("audio")
      : [];
  },  

scanLibrary(onSuccess, onError) {
    const folderId = AudioPlugin.Model.audioFolderId;
    if (!folderId) {
      AudioPlugin.UI.setStatus("Nenhuma pasta configurada.");
      this._scanning = false;
      return;
    }

    AudioPlugin.UI.setStatus("Escaneando biblioteca...");

    // Usa scanAudioLibraryMetadata — retorna apenas metadados, sem base64.
    // O áudio é carregado sob demanda ao clicar em uma faixa.
    google.script.run
      .withSuccessHandler(library => {
        this._scanning = false;
        if (library.error) {
          AudioPlugin.UI.setStatus("Erro ao escanear: " + library.error);
          if (onError) onError(library.error);
          return;
        }
        AudioPlugin.Model.setLibrary(library);
        AudioPlugin.UI.renderLibrary();
        AudioPlugin.UI.setStatus("✅ Biblioteca pronta.");
        if (onSuccess) onSuccess(library);
      })
      .withFailureHandler(err => {
        this._scanning = false;
        AudioPlugin.UI.setStatus("Falha: " + err.message);
        if (onError) onError(err.message);
      })
      .scanAudioLibraryMetadata(folderId);
  },

  // ============================================================
  // Re-escaneia sem re-criar estrutura. Botão "Sincronizar".
  // ============================================================

  rescanLibrary() {
    this._scanning = false;
    this.scanLibrary();
  }

};
</script>
