<script>
/* ============================================================
   ScenePlugin.Model
   ------------------------------------------------------------
   Responsável por:
   - capture(): monta o objeto JSON leve de uma cena
   - restore(): aplica uma cena salva ao estado atual
   - clearCurrentScene(): zera o estado em memória
   - comunicação com o Drive (ensureSceneFolder, list, save,
     load, delete) — incluída aqui porque é simples demais
     para justificar um arquivo scene-drive.html separado.

   IMPORTANTE — princípio de leveza:
   Nunca salvamos mídia (base64, dataUrl) dentro do JSON da cena.
   Mapas e imagens de token são salvos como REFERÊNCIA — o fileId do
   Drive (driveFileId), nunca o nome ou o conteúdo. Isso mantém cada
   save na faixa de poucos KB, independente do tamanho dos assets, e
   sobrevive a renomes/acentos porque o ID nunca muda.
   ============================================================ */

window.ScenePlugin = window.ScenePlugin || {};

ScenePlugin.Model = {

  _sceneFolderId: null,
  _currentScene: { id: null, name: null }, // cena ativa (se já foi salva/carregada)
  _autosaveEnabled: true,

  init() {
    const saved = localStorage.getItem("vtt_scene_v1");
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        this._sceneFolderId = parsed.sceneFolderId || null;
        this._autosaveEnabled = parsed.autosaveEnabled !== false; // default true
      } catch (e) {
        console.warn("[ScenePlugin.Model] vtt_scene_v1 corrompido, ignorando.");
      }
    }
    console.log("[ScenePlugin.Model] init OK. autosave =", this._autosaveEnabled);
  },

  _persistLocal() {
    localStorage.setItem("vtt_scene_v1", JSON.stringify({
      sceneFolderId: this._sceneFolderId,
      autosaveEnabled: this._autosaveEnabled
    }));
  },

  getAutosaveEnabled() {
    return this._autosaveEnabled;
  },

  setAutosaveEnabled(value) {
    this._autosaveEnabled = !!value;
    this._persistLocal();
  },

  getCurrentScene() {
    return this._currentScene;
  },

  setCurrentScene(id, name) {
    this._currentScene = { id, name };
  },

  // ----------------------------------------------------------
  // DRIVE
  // ----------------------------------------------------------

  ensureFolder(onSuccess, onError) {
    google.script.run
      .withSuccessHandler(result => {
        if (result && result.error) {
          if (onError) onError(result.error);
          return;
        }
        ScenePlugin.Model._sceneFolderId = result.sceneFolderId;
        ScenePlugin.Model._persistLocal();
        if (onSuccess) onSuccess(result.sceneFolderId);
      })
      .withFailureHandler(err => {
        console.error("[ScenePlugin.Model] Falha RPC ensureSceneFolder:", err.message);
        if (onError) onError(err.message);
      })
      .ensureSceneFolder();
  },

  listScenes(onSuccess, onError) {
    if (!this._sceneFolderId) {
      if (onError) onError("Pasta de cenas não conectada ainda.");
      return;
    }
    google.script.run
      .withSuccessHandler(result => {
        if (result && result.error) {
          if (onError) onError(result.error);
          return;
        }
        if (onSuccess) onSuccess(result); // [{id, name, updatedAt}]
      })
      .withFailureHandler(err => {
        console.error("[ScenePlugin.Model] Falha RPC listScenes:", err.message);
        if (onError) onError(err.message);
      })
      .listScenes(this._sceneFolderId);
  },

  saveToDrive(sceneName, sceneDataObj, onSuccess, onError) {
    if (!this._sceneFolderId) {
      if (onError) onError("Pasta de cenas não conectada ainda.");
      return;
    }
    const jsonString = JSON.stringify(sceneDataObj);

    google.script.run
      .withSuccessHandler(result => {
        if (result && result.error) {
          if (onError) onError(result.error);
          return;
        }
        console.log("[ScenePlugin] Cena salva:", result.name);
        if (onSuccess) onSuccess(result); // {id, name}
      })
      .withFailureHandler(err => {
        console.error("[ScenePlugin.Model] Falha RPC saveScene:", err.message);
        if (onError) onError(err.message);
      })
      .saveScene(this._sceneFolderId, sceneName, jsonString);
  },

  loadFromDrive(sceneFileId, onSuccess, onError) {
    google.script.run
      .withSuccessHandler(result => {
        if (result && result.error) {
          if (onError) onError(result.error);
          return;
        }
        let parsed;
        try {
          parsed = JSON.parse(result.content);
        } catch (e) {
          if (onError) onError("JSON da cena corrompido.");
          return;
        }
        if (onSuccess) onSuccess(parsed);
      })
      .withFailureHandler(err => {
        console.error("[ScenePlugin.Model] Falha RPC loadScene:", err.message);
        if (onError) onError(err.message);
      })
      .loadScene(sceneFileId);
  },

  deleteFromDrive(sceneFileId, onSuccess, onError) {
    google.script.run
      .withSuccessHandler(result => {
        if (result && result.error) {
          if (onError) onError(result.error);
          return;
        }
        console.log("[ScenePlugin] Cena removida:", sceneFileId);
        if (onSuccess) onSuccess();
      })
      .withFailureHandler(err => {
        console.error("[ScenePlugin.Model] Falha RPC deleteScene:", err.message);
        if (onError) onError(err.message);
      })
      .deleteScene(sceneFileId);
  },

  // ----------------------------------------------------------
  // CAPTURE — monta o objeto da cena a partir do estado atual
  // ----------------------------------------------------------

  capture() {
    const scene = {
      version: 1,
      name: this._currentScene.name || null,
      createdAt: this._currentScene.createdAt || Date.now(),
      updatedAt: Date.now(),

      map: this._captureMap(),
      grid: this._captureGrid(),
      tokens: this._captureTokens(),
      tracker: this._captureTracker(),
      lighting: this._captureLighting(),
      audio: this._captureAudio()
    };
    return scene;
  },

  _captureMap() {
    // Referência leve: guardamos o fileId do Drive (estável, não
    // muda com renome/acento), não o dataUrl. O BibliotecaPlugin já
    // mantém cada asset com {id, nome, mimeType, caminho, assetType},
    // então window._currentMapRef só precisa guardar o id retornado
    // por carregarMapaPorId() — ver patch em biblioteca-ui.html.
    const ref = window._currentMapRef;
    if (!ref || !ref.driveFileId) return null;

    const fitEl = document.getElementById('map-fit');
    const scaleEl = document.getElementById('map-scale');

    return {
      driveFileId: ref.driveFileId,   // referência estável no Drive
      name: ref.name || null,          // só para exibição/debug
      type: ref.type || "image",       // "image" | "video"
      fit: fitEl ? fitEl.value : "original",
      mapScale: scaleEl ? scaleEl.value : "0"  // slider -100..+100, não confundir com "scale-ratio" (régua)
    };
  },

  _captureGrid() {
    // VTTGrid só expõe { size } em pixels (calculado) — os valores de
    // configuração reais vivem nos campos do formulário da sidebar.
    function val(id, fallback) {
      const el = document.getElementById(id);
      return el ? el.value : fallback;
    }
    return {
      gridColor: val('grid-color', '#ffffff'),
      gridOpacity: val('grid-opacity', '0.4'),
      gridCm: val('grid-cm', '2.5'),
      screenInches: val('screen-inches', '24'),
      scaleRatio: val('scale-ratio', '1.5'),     // metros por quadrado (régua)
      coneAngle: val('cone-angle', '60'),
      toolMode: val('tool-mode', 'line')
    };
  },

  _captureTokens() {
    if (!window.TokenPlugin || !TokenPlugin.Model) return [];

    // O token guarda appearance.image já resolvido (URL/dataUrl), sem
    // referência ao arquivo de origem. Para achar o driveFileId,
    // comparamos com a imageLibrary do TokenPlugin — cada entrada lá
    // carrega driveFileId desde que veio do BibliotecaPlugin
    // (ver biblioteca-ui.html: _popularTokens). Tokens cuja imagem foi
    // carregada por outro caminho (ex: galeria antiga) não terão
    // driveFileId e a imagem simplesmente não será restaurada depois.
    const library = TokenPlugin.Model.getImageLibrary() || [];

    return TokenPlugin.Model.all().map(t => {
      const clone = JSON.parse(JSON.stringify(t)); // deep clone simples, só dados

      if (clone.appearance) {
        const currentImg = clone.appearance.image;
        let driveFileId = null;
        if (currentImg) {
          const found = library.find(img => img.dataUrl === currentImg);
          driveFileId = found ? found.driveFileId : null;
        }
        clone.appearance.driveFileId = driveFileId;
        delete clone.appearance.image; // remove URL/dataUrl pesada ou volátil
      }
      return clone;
    });
  },

  _captureTracker() {
    if (!window.TokenPlugin || !TokenPlugin.Tracker) return null;
    const tr = TokenPlugin.Tracker;
    // Salva apenas os IDs da lista (não os tokens inteiros, que já
    // são salvos em scene.tokens) — evita duplicar dados na cena.
    return {
      listIds: tr.list.map(t => t.id),
      currentIndex: tr.currentIndex || 0,
      round: tr.round || 1,
      turn: tr.turn || 1,
      playing: !!tr.playing
    };
  },

  _captureLighting() {
    if (!window.Lighting || !Lighting.Model) return null;
    const m = Lighting.Model;
    // Preserva IDs originais — não regenerar.
    // ⚠️ darknessObjects/lightObjects/wallObjects são nomes herdados
    // da documentação original (anterior ao rename LightPlugin ->
    // Lighting). Avisa se não baterem, em vez de salvar tudo vazio
    // em silêncio.
    if (!("darknessObjects" in m) && !("lightObjects" in m) && !("wallObjects" in m)) {
      console.warn("[ScenePlugin] Lighting.Model não tem os campos esperados ao " +
        "capturar a cena — a iluminação salva pode ficar vazia mesmo se houver " +
        "paredes/luzes no mapa. Verifique os nomes reais em lighting-model.html.");
    }
    return {
      darknessObjects: JSON.parse(JSON.stringify(m.darknessObjects || [])),
      lightObjects: JSON.parse(JSON.stringify(m.lightObjects || [])),
      wallObjects: JSON.parse(JSON.stringify(m.wallObjects || [])),
      settings: JSON.parse(JSON.stringify(m.settings || {}))
    };
  },

  _captureAudio() {
    if (!window.AudioPlugin || !AudioPlugin.Model) return null;
    const m = AudioPlugin.Model;
    return {
      currentCategory: m.getCurrentCategory ? m.getCurrentCategory() : null,
      currentTrackName: m.getCurrentTrackName ? m.getCurrentTrackName() : null,
      ambienceActive: m.getActiveAmbiences ? m.getActiveAmbiences() : [], // [categoryName,...]
      volumes: JSON.parse(JSON.stringify(m.volumes || {})),
      soundscapeName: m.getActiveSoundscapeName ? m.getActiveSoundscapeName() : null
      // Sem posição de faixa: ao restaurar, a track recomeça do início.
    };
  },

  // ----------------------------------------------------------
  // CLEAR
  // ----------------------------------------------------------

  clearCurrentScene() {
    // Tracker primeiro: reset() zera a iniciativa de cada token vivo,
    // então precisa rodar ANTES de TokenPlugin.Model.restoreAll([]).
    // Depois disso a lista interna do tracker também é esvaziada.
    if (window.TokenPlugin && TokenPlugin.Tracker) {
      TokenPlugin.Tracker.list = [];
      TokenPlugin.Tracker.currentIndex = 0;
      TokenPlugin.Tracker.round = 1;
      TokenPlugin.Tracker.turn = 1;
      TokenPlugin.Tracker.playing = false;
    }
    // Tokens
    if (window.TokenPlugin && TokenPlugin.Model) {
      TokenPlugin.Model.clearSelection();
      if (TokenPlugin.Model.restoreAll) {
        TokenPlugin.Model.restoreAll([]);
      }
    }
    // Iluminação
    // ⚠️ darknessObjects/lightObjects/wallObjects/_save() são nomes
    // herdados da documentação original do projeto, de antes do
    // namespace ser renomeado de LightPlugin para Lighting. Não
    // confirmados contra o código-fonte atual (lighting-model.html
    // real). Se algo aqui não bater, avisa no console em vez de
    // falhar em silêncio ou travar o resto de clearCurrentScene().
    if (window.Lighting && Lighting.Model) {
      const lm = Lighting.Model;
      if ("darknessObjects" in lm && "lightObjects" in lm && "wallObjects" in lm) {
        lm.darknessObjects = [];
        lm.lightObjects = [];
        lm.wallObjects = [];
        if (typeof lm._save === "function") lm._save();
      } else {
        console.warn("[ScenePlugin] Lighting.Model não tem os campos esperados " +
          "(darknessObjects/lightObjects/wallObjects). A iluminação pode não ter " +
          "sido limpa. Verifique os nomes reais em lighting-model.html.");
      }
    } else {
      console.warn("[ScenePlugin] window.Lighting não disponível ao limpar cena.");
    }
    // Áudio
    if (window.AudioPlugin && AudioPlugin.Control && AudioPlugin.Control.silence) {
      AudioPlugin.Control.silence();
    }
    console.log("[ScenePlugin] Estado atual limpo.");
  },

  // ----------------------------------------------------------
  // RESTORE — aplica uma cena salva
  // ----------------------------------------------------------

  restore(sceneData, onComplete) {
    this.clearCurrentScene();

    this._restoreGrid(sceneData.grid);
    this._restoreLighting(sceneData.lighting);
    this._restoreTokens(sceneData.tokens);
    this._restoreTracker(sceneData.tracker);

    // Mapa é assíncrono (RPC ao Drive) — entra por último na cadeia.
    this._restoreMap(sceneData.map, () => {
      this._restoreAudio(sceneData.audio);
      this._refreshUIAndRedraw();
      console.log("[ScenePlugin] Cena restaurada:", sceneData.name);
      if (onComplete) onComplete();
    });
  },

  _restoreGrid(grid) {
    if (!grid) return;
    function setVal(id, value) {
      const el = document.getElementById(id);
      if (el && value != null) el.value = value;
    }
    setVal('grid-color', grid.gridColor);
    setVal('grid-opacity', grid.gridOpacity);
    setVal('grid-cm', grid.gridCm);
    setVal('screen-inches', grid.screenInches);
    setVal('scale-ratio', grid.scaleRatio);
    setVal('cone-angle', grid.coneAngle);
    setVal('tool-mode', grid.toolMode);

    // Recalcula ppi/squarePx e redesenha o grid com os novos valores.
    if (typeof updateCalibration === "function") updateCalibration();
    if (typeof toggleToolParams === "function") toggleToolParams();
  },

  _restoreTokens(tokens) {
    if (!window.TokenPlugin || !TokenPlugin.Model || !tokens) return;
    if (!TokenPlugin.Model.restoreAll) {
      console.error("[ScenePlugin] TokenPlugin.Model.restoreAll() não existe. " +
        "Ver patch token-model.html.");
      return;
    }

    const library = TokenPlugin.Model.getImageLibrary ? TokenPlugin.Model.getImageLibrary() : [];
    const pendingImageLoads = []; // tokens cuja imagem ainda não tem dataUrl carregado

    function resolveImage(driveFileId) {
      if (!driveFileId) return { image: null, pending: false };
      const found = library.find(img => img.driveFileId === driveFileId);
      if (!found) return { image: null, pending: false }; // asset não está mais na biblioteca
      if (!found.dataUrl) return { image: null, pending: true }; // existe, mas ainda não carregado
      return { image: found.dataUrl, pending: false };
    }

    // _buildToken(data) só lê data.image/data.color/data.name/data.notes
    // e SEMPRE zera stats/effects/light/bars/initiative/armor para o
    // default — exatamente como create() faz. Por isso, depois de
    // construir a base, sobrescrevemos manualmente os campos salvos,
    // no mesmo padrão usado em TokenPlugin.Model.pasteClipboard().
    const rebuilt = tokens.map(saved => {
      const driveFileId = saved.appearance ? saved.appearance.driveFileId : null;
      const { image, pending } = resolveImage(driveFileId);

      const t = TokenPlugin.Model._buildToken({
        gx: saved.gx,
        gy: saved.gy,
        cells: saved.cells,
        image: image,
        color: saved.appearance ? saved.appearance.color : "red",
        name: saved.appearance ? saved.appearance.name : null,
        notes: saved.notes
      });

      // Preserva o ID original da cena salva (restoreAll recalcula
      // nextId depois, então não há risco de colisão).
      if (typeof saved.id === "number") t.id = saved.id;

      if (saved.stats) t.stats = JSON.parse(JSON.stringify(saved.stats));
      if (saved.effects) t.effects = JSON.parse(JSON.stringify(saved.effects));
      if (saved.light) t.light = JSON.parse(JSON.stringify(saved.light));
      if (saved.bars) t.bars = JSON.parse(JSON.stringify(saved.bars));
      if (saved.armor) t.armor = JSON.parse(JSON.stringify(saved.armor));
      if (saved.initiative !== undefined) t.initiative = saved.initiative;

      if (pending && driveFileId) {
        pendingImageLoads.push({ tokenId: t.id, driveFileId });
      }

      return t;
    });

    TokenPlugin.Model.restoreAll(rebuilt);

    if (pendingImageLoads.length > 0) {
      console.warn("[ScenePlugin] " + pendingImageLoads.length +
        " token(s) restaurado(s) sem imagem carregada ainda (dataUrl pendente na " +
        "Etapa 1 do BibliotecaPlugin). Os tokens aparecem com a cor de fallback até " +
        "a imagem ser carregada sob demanda.");
      this._loadPendingTokenImages(pendingImageLoads);
    }
  },

  /**
   * Tenta carregar sob demanda o dataUrl dos tokens cuja imagem ainda
   * não tinha sido baixada (BibliotecaPlugin só guarda metadados até
   * a imagem ser usada pela primeira vez). Usa o mesmo RPC que o mapa
   * usa (getFileAsDataUrl), já que a Etapa 1 de tokens ainda não existe.
   */
  _loadPendingTokenImages(pendingList) {
    pendingList.forEach(item => {
      google.script.run
        .withSuccessHandler(resultado => {
          if (!resultado || resultado.erro || !resultado.dataUrl) return;

          // Atualiza a entrada na imageLibrary para não precisar buscar de novo.
          const library = TokenPlugin.Model.getImageLibrary();
          const entry = library.find(img => img.driveFileId === item.driveFileId);
          if (entry) entry.dataUrl = resultado.dataUrl;

          // Aplica no token já restaurado, se ele ainda existir.
          const token = TokenPlugin.Model.getById(item.tokenId);
          if (token) {
            token.appearance.image = resultado.dataUrl;
            if (window.TokenPlugin.Canvas) TokenPlugin.Canvas.draw();
          }
        })
        .withFailureHandler(err => {
          console.warn("[ScenePlugin] Falha ao carregar imagem pendente de token:", err.message);
        })
        .getFileAsDataUrl(item.driveFileId);
    });
  },

  _restoreTracker(tracker) {
    if (!window.TokenPlugin || !TokenPlugin.Tracker || !tracker) return;
    const tr = TokenPlugin.Tracker;

    // Reconstrói a lista a partir dos IDs salvos, buscando os tokens
    // (já restaurados nesse ponto, pois _restoreTokens roda antes).
    const allTokens = TokenPlugin.Model.all();
    tr.list = (tracker.listIds || [])
      .map(id => allTokens.find(t => t.id === id))
      .filter(Boolean); // remove IDs que não existem mais

    tr.currentIndex = tracker.currentIndex || 0;
    tr.round = tracker.round || 1;
    tr.turn = tracker.turn || 1;
    tr.playing = !!tracker.playing;

    if (tr.playing) {
      tr._selectCurrent();
    }
    tr.updateUI();
  },

  _restoreLighting(lighting) {
    if (!window.Lighting || !Lighting.Model || !lighting) return;
    const m = Lighting.Model;
    m.darknessObjects = JSON.parse(JSON.stringify(lighting.darknessObjects || []));
    m.lightObjects = JSON.parse(JSON.stringify(lighting.lightObjects || []));
    m.wallObjects = JSON.parse(JSON.stringify(lighting.wallObjects || []));
    m.settings = JSON.parse(JSON.stringify(lighting.settings || m.settings));
    if (m._save) m._save();
  },

  _restoreMap(mapRef, cb) {
    if (!mapRef || !mapRef.driveFileId) { cb(); return; }

    if (!window.BibliotecaPlugin || !BibliotecaPlugin.Model) {
      console.warn("[ScenePlugin] BibliotecaPlugin não disponível, mapa não restaurado.");
      cb();
      return;
    }

    const asset = BibliotecaPlugin.Model.getAssetPorId(mapRef.driveFileId);
    if (!asset) {
      console.warn("[ScenePlugin] Mapa não encontrado na biblioteca (fileId: " +
        mapRef.driveFileId + "). Sincronize a Biblioteca e tente carregar a cena de novo.");
      cb();
      return;
    }

    // carregarMapaPorId já existe em biblioteca-ui.html: faz o RPC
    // getFileAsDataUrl e chama selectMap() internamente. Hoje ele não
    // tem callback de conclusão, então aplicamos fit/escala com um
    // pequeno atraso (mesmo padrão pessimista usado para selectMap puro).
    carregarMapaPorId(asset);

    const fitEl = document.getElementById('map-fit');
    const scaleEl = document.getElementById('map-scale');
    if (fitEl && mapRef.fit) fitEl.value = mapRef.fit;

    setTimeout(() => {
      if (scaleEl && mapRef.mapScale != null && typeof applyMapScale === "function") {
        applyMapScale(parseInt(mapRef.mapScale));
      }
      cb();
    }, 400); // carregarMapaPorId faz RPC ao servidor — folga maior que selectMap puro
  },

  _restoreAudio(audio) {
    if (!window.AudioPlugin || !AudioPlugin.Control || !audio) return;

    if (audio.soundscapeName && AudioPlugin.Control.activateSoundscapeByName) {
      AudioPlugin.Control.activateSoundscapeByName(audio.soundscapeName);
      return; // soundscape já cobre música + ambiências
    }

    if (audio.currentCategory && audio.currentTrackName && AudioPlugin.Control.playTrack) {
      AudioPlugin.Control.playTrack(audio.currentCategory, audio.currentTrackName, false);
    }
    if (Array.isArray(audio.ambienceActive)) {
      audio.ambienceActive.forEach(cat => {
        if (AudioPlugin.Control.toggleAmbience) AudioPlugin.Control.toggleAmbience(cat);
      });
    }
    if (audio.volumes && AudioPlugin.Control.setVolume) {
      for (const channel in audio.volumes) {
        AudioPlugin.Control.setVolume(channel, audio.volumes[channel]);
      }
    }
  },

  _refreshUIAndRedraw() {
    if (window.TokenPlugin && TokenPlugin.Canvas) TokenPlugin.Canvas.draw();
    if (window.Lighting && Lighting.Render && Lighting.Render.draw) Lighting.Render.draw();
    if (window.ScenePlugin && ScenePlugin.UI && ScenePlugin.UI.refreshList) {
      ScenePlugin.UI.refreshList();
    }
  }
};
</script>
