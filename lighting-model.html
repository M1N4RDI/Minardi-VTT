<script>
// lighting-model.html — Modelo unificado de iluminação
console.log('lighting-model carregado');

window.Lighting = window.Lighting || {};

Lighting.Model = {
  gridSize: 50,
  objects: [],  // [{ id, name, shape, mode, locked, visible, ... }]
  walls: [],    // [{ id, p1, p2, locked, visible }]
  _nextId: 1,
  masterReveal: false,
  enabled: false,   // ← NOVO: iluminação desativada por padrão

  // CRUD objeto genérico
  addObject(props) {
    const id = this._nextId++;
    const obj = Object.assign({
      id,
      name: props.name || 'Objeto',
      shape: props.shape || 'rect',
      mode: props.mode || 'dark',
      locked: false,
      visible: true,
      lightSource: props.lightSource || false,
      x: props.x || 0,
      y: props.y || 0,
      width:  props.width  || 100,
      height: props.height || 100,
      radius: props.radius || 50,
      luminosity: props.luminosity || 6,
      penumbra:   props.penumbra   || 12,
      points: props.points || [],
    }, props);
    this.objects.push(obj);
    return obj;
  },

  updateObject(id, updates) {
    const idx = this.objects.findIndex(o => o.id === id);
    if (idx === -1) return null;
    this.objects[idx] = Object.assign({}, this.objects[idx], updates);
    return this.objects[idx];
  },

  removeObject(id) {
    this.objects = this.objects.filter(o => o.id !== id);
  },

  getObject(id) {
    return this.objects.find(o => o.id === id);
  },

  // Paredes
  addWall(p1, p2, opts = {}) {
    const id = this._nextId++;
    const wall = Object.assign({ id, p1, p2, locked: false, visible: true }, opts);
    this.walls.push(wall);
    return wall;
  },

  removeWall(id) {
    this.walls = this.walls.filter(w => w.id !== id);
  },

  getWall(id) {
    return this.walls.find(w => w.id === id);
  },

  // Utilitários
  toggleObjectMode(id) {
    const obj = this.getObject(id);
    if (!obj) return null;
    return this.updateObject(id, { mode: obj.mode === 'dark' ? 'light' : 'dark' });
  },

  toggleObjectLocked(id) {
    const obj = this.getObject(id);
    if (!obj) return null;
    return this.updateObject(id, { locked: !obj.locked });
  },

  duplicateObject(id) {
    const orig = this.getObject(id);
    if (!orig) return null;
    const copy = Object.assign({}, orig);
    copy.id = this._nextId++;
    copy.name = 'Cópia de ' + orig.name;
    copy.x += this.gridSize * 0.5;
    copy.y += this.gridSize * 0.5;
    if (copy.points) copy.points = copy.points.map(p => ({ x: p.x, y: p.y }));
    this.objects.push(copy);
    return copy;
  },

window.LightPlugin = window.LightPlugin || {};

(function() {
  LightPlugin.Model = LightPlugin.Model || {};

  function obterObjetos() {
    if (typeof LightPlugin.Model.getObjects === 'function') {
      return LightPlugin.Model.getObjects() || [];
    }

    if (!Array.isArray(LightPlugin.objects)) {
      LightPlugin.objects = [];
    }

    return LightPlugin.objects;
  }

  function salvarERedesenhar() {
    if (typeof LightPlugin.Model._save === 'function') {
      LightPlugin.Model._save();
      return;
    }

    if (LightPlugin.Render && typeof LightPlugin.Render.draw === 'function') {
      LightPlugin.Render.draw();
    }
  }

  function criarIdCoberturaTotal() {
    return 'lighting-total-cover';
  }

  function ehCoberturaTotal(obj) {
    if (!obj) {
      return false;
    }

    if (obj.id === criarIdCoberturaTotal()) {
      return true;
    }

    if (obj.name === 'Cobertura total' || obj.nome === 'Cobertura total') {
      return true;
    }

    return false;
  }

  LightPlugin.Model.hasTotalCover = function() {
    var objetos = obterObjetos();

    for (var i = 0; i < objetos.length; i++) {
      if (ehCoberturaTotal(objetos[i])) {
        return true;
      }
    }

    return false;
  };

  LightPlugin.Model.removeTotalCover = function() {
    var objetos = obterObjetos();

    for (var i = objetos.length - 1; i >= 0; i--) {
      if (ehCoberturaTotal(objetos[i])) {
        objetos.splice(i, 1);
      }
    }

    salvarERedesenhar();
  };

  LightPlugin.Model.addTotalCover = function() {
    var objetos = obterObjetos();

    if (LightPlugin.Model.hasTotalCover()) {
      return;
    }

    objetos.push({
      id: criarIdCoberturaTotal(),
      name: 'Cobertura total',
      nome: 'Cobertura total',
      mode: 'dark',
      modo: 'sombra',
      type: 'rect',
      tipo: 'retangulo',
      x: -50000,
      y: -50000,
      width: 100000,
      height: 100000,
      opacity: 0.85,
      opacidade: 0.85,
      locked: true,
      travado: true,
      system: true,
      sistema: true
    });

    salvarERedesenhar();
  };

  LightPlugin.Model.toggleTotalCover = function() {
    if (LightPlugin.Model.hasTotalCover()) {
      LightPlugin.Model.removeTotalCover();
      return false;
    }

    LightPlugin.Model.addTotalCover();
    return true;
  };
})();

  // Persistência
  window.LightPlugin = window.LightPlugin || {};

(function() {
  LightPlugin.Model = LightPlugin.Model || {};

  LightPlugin.Model._save = function() {
    /*
      Iluminação é estado de sessão no cliente.
      Não chamar Código.js aqui.

      Motivo:
      - Código.js não deve participar do estado visual temporário.
      - google.script.run é assíncrono e pode redesenhar com estado atrasado.
      - Isso causava fantasmas visuais ao criar/remover luz e sombra.
    */

    if (LightPlugin.Render && typeof LightPlugin.Render.draw === 'function') {
      LightPlugin.Render.draw();
    }
  };
})();

  _load() {
    try {
      const raw = localStorage.getItem('lighting_state_v3');
      if (!raw) return;
      const s = JSON.parse(raw);
      this.objects      = s.objects      || [];
      this.walls        = s.walls        || [];
      this.masterReveal = s.masterReveal || false;
      this.enabled      = s.enabled      || false;  // ← restaura estado
    } catch (e) {
      console.warn('Lighting load failed', e);
    }
  },
};

Lighting.Model._load();
</script>
