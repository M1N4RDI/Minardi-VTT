<script>
// lighting-model.html — Modelo unificado de iluminação
console.log('lighting-model carregado');

window.Lighting = window.Lighting || {};

Lighting.Model = {
  gridSize:       50,
  objects:        [],   // [{ id, name, shape, mode, locked, visible, ... }]
  walls:          [],   // [{ id, name, points:[{x,y}…], locked, visible }]
  _nextId:        1,
  masterReveal:   false,
  fogEnabled:     false,   // liga/desliga o fog of war
  selectedWallId: null,

  // ── CRUD objetos ─────────────────────────────────────────────
  addObject(props) {
    const id  = this._nextId++;
    const obj = Object.assign({
      id,
      name:        props.name  || 'Objeto',
      shape:       props.shape || 'rect',   // rect | circle | polygon
      mode:        props.mode  || 'dark',   // dark | light
      locked:      false,
      visible:     true,
      lightSource: props.lightSource || false,
      x:           props.x      || 0,
      y:           props.y      || 0,
      // rect
      width:       props.width  || 100,
      height:      props.height || 100,
      rotation:    props.rotation || 0,
      // circle dark → radius em pixels
      radius:      props.radius || 50,

      // circle light → diâmetros em quadrados de grid
lightDiameter:
  props.lightDiameter
  ?? props.lightDiameter
  ?? 6,

penumbraDiameter:
  props.penumbraDiameter
  ?? props.penumbraDiameter
  ?? 12,
      // polygon
      points:      props.points || [],
    }, props);
    this.objects.push(obj);
    return obj;
  },

  updateObject(id, updates) {
    const idx = this.objects.findIndex(o => o.id === id);
    if (idx === -1) return null;
    this.objects[idx] = Object.assign({}, this.objects[idx], updates);
    return this.objects[idx];
  },

  removeObject(id) {
    this.objects = this.objects.filter(o => o.id !== id);
  },

  getObject(id) {
    return this.objects.find(o => o.id === id) || null;
  },

  toggleObjectMode(id) {
    const obj = this.getObject(id);
    if (!obj) return null;
    return this.updateObject(id, { mode: obj.mode === 'dark' ? 'light' : 'dark' });
  },

  toggleObjectLocked(id) {
    const obj = this.getObject(id);
    if (!obj) return null;
    return this.updateObject(id, { locked: !obj.locked });
  },

  duplicateObject(id) {
    const orig = this.getObject(id);
    if (!orig) return null;
    const copy  = Object.assign({}, orig);
    copy.id     = this._nextId++;
    copy.name   = 'Cópia de ' + orig.name;
    copy.x     += this.gridSize * 0.5;
    copy.y     += this.gridSize * 0.5;
    if (copy.points) copy.points = copy.points.map(p => ({ x: p.x, y: p.y }));
    this.objects.push(copy);
    return copy;
  },

  // ── CRUD paredes ─────────────────────────────────────────────
  // points: [{x,y}, …] — mínimo 2

  addWall(points, name) {
    if (!points || points.length < 2) return null;
    const id   = this._nextId++;
    const wall = {
      id,
      name:    name || ('Parede ' + id),
      points:  points.map(p => ({ x: p.x, y: p.y })),
      locked:  false,
      visible: true,
    };
    this.walls.push(wall);
    return wall;
  },

  updateWall(id, updates) {
    const idx = this.walls.findIndex(w => w.id === id);
    if (idx === -1) return null;
    this.walls[idx] = Object.assign({}, this.walls[idx], updates);
    return this.walls[idx];
  },

  removeWall(id) {
    this.walls = this.walls.filter(w => w.id !== id);
    if (this.selectedWallId === id) this.selectedWallId = null;
  },

  getWall(id) {
    return this.walls.find(w => w.id === id) || null;
  },

  duplicateWall(id) {
    const orig = this.getWall(id);
    if (!orig) return null;
    const gs   = this.gridSize || 50;
    const copy = {
      id:      this._nextId++,
      name:    'Cópia de ' + orig.name,
      points:  orig.points.map(p => ({ x: p.x + gs * 0.5, y: p.y + gs * 0.5 })),
      locked:  false,
      visible: true,
    };
    this.walls.push(copy);
    return copy;
  },

  insertWallVertex(wallId, afterIndex) {
    const wall = this.getWall(wallId);
    if (!wall) return;
    const a   = wall.points[afterIndex];
    const b   = wall.points[afterIndex + 1];
    if (!a || !b) return;
    const pts = wall.points.slice();
    pts.splice(afterIndex + 1, 0, { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    this.updateWall(wallId, { points: pts });
  },

  removeWallVertex(wallId, index) {
    const wall = this.getWall(wallId);
    if (!wall || wall.points.length <= 2) return;
    this.updateWall(wallId, { points: wall.points.filter((_, i) => i !== index) });
  },

  selectWall(id)      { this.selectedWallId = id; },
  clearWallSelection(){ this.selectedWallId = null; },

  // Interface futura para raycasting
  getWallSegments() {
    const segs = [];
    for (const wall of this.walls) {
      if (!wall.visible) continue;
      for (let i = 0; i < wall.points.length - 1; i++) {
        segs.push({
          x1: wall.points[i].x,     y1: wall.points[i].y,
          x2: wall.points[i+1].x,   y2: wall.points[i+1].y,
          wallId: wall.id,
        });
      }
    }
    return segs;
  },

  // ── Persistência ─────────────────────────────────────────────
  _save() {
    try {
      const payload = JSON.stringify({
        objects:      this.objects,
        walls:        this.walls,
        masterReveal: this.masterReveal,
        fogEnabled:   this.fogEnabled,
        _nextId:      this._nextId,
      });
      localStorage.setItem('lighting_state_v3', payload);
      try {
        if (window.google?.script?.run?.saveLightingState) {
          google.script.run.withFailureHandler(() => {}).saveLightingState(payload);
        }
      } catch (e) {}
    } catch (e) {
      console.warn('Lighting save failed', e);
    }
  },

  _load() {
    try {
      const raw = localStorage.getItem('lighting_state_v3');
      if (!raw) return;
      const s           = JSON.parse(raw);
      this.masterReveal = s.masterReveal || false;
      this.fogEnabled   = s.fogEnabled   || false;
      this._nextId      = s._nextId      || 1;

      // Migração de objetos: campos antigos → novos
      this.objects = (s.objects || []).map(obj => {
        const o = Object.assign({}, obj);
        if (o.shape === 'circle') {
          if (o.mode === 'light') {

  if (o.lightDiameter === undefined && o.lightDiameter !== undefined) {
    o.lightDiameter = o.lightDiameter;
  }

  if (o.penumbraDiameter === undefined) {
  o.penumbraDiameter = 12;
}

} else {
            // dark circle: garantir que radius existe em pixels
            if (o.radius === undefined || o.radius === 50) {
              if (o.penumbraDiameter !== undefined) {
  o.radius = (o.penumbraDiameter / 2) * (this.gridSize || 50);
} else if (o.lightDiameter !== undefined) {
                o.radius = (o.lightDiameter / 2) * (this.gridSize || 50);
              }
            }
          }
        }

delete o.lightDiameter;
delete o.penumbraDiameter;

        return o;
      });

      // Migração de paredes: formato antigo {p1,p2} → {points:[…]}
      this.walls = (s.walls || []).map(w => {
        if (w.points) return w;
        return {
          id:      w.id,
          name:    w.name || ('Parede ' + w.id),
          points:  [
            { x: w.p1.x, y: w.p1.y },
            { x: w.p2.x, y: w.p2.y },
          ],
          locked:  w.locked  || false,
          visible: w.visible !== false,
        };
      });
    } catch (e) {
      console.warn('Lighting load failed', e);
    }
  },
};

Lighting.Model._load();
</script>
