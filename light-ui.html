<script>
// ============================================================
// MINARDI VTT — LightPlugin
// light-ui.html — Interface
// ============================================================

console.log("light-ui carregado");

window.LightPlugin = window.LightPlugin || {};

LightPlugin.UI = {

  _panel: null,
  searchQuery: "",

  init() {
    console.log("LightPlugin.UI INIT");
    this._injectSidebar();
    this._createPanel();
    this._injectTokenMenuItem();
  },

  // ============================================================
  // SIDEBAR
  // ============================================================

  _injectSidebar() {
    const sidebar = document.getElementById("sidebar");
    if (!sidebar) return;

    const cat = document.createElement("div");
    cat.className = "category";
    cat.id = "light-sidebar-section";
    cat.innerHTML = `
      <div class="category-title">💡 Iluminação</div>
      <div class="control-group">
        <button class="btn-full" id="light-toggle-btn"
          onclick="LightPlugin.Control.toggleLighting()">
          💡 ATIVAR ILUMINAÇÃO
        </button>
        <button class="btn-full" id="light-reveal-btn" style="background:#3a3a3a;margin-top:4px;"
          onclick="LightPlugin.Control.toggleMasterReveal()">
          👁 MOSTRAR TUDO  <kbd style="font-size:0.7em;opacity:0.6">L</kbd>
        </button>
        <button class="btn-full" id="light-walls-vis-btn" style="background:#3a3a3a;margin-top:4px;"
          onclick="LightPlugin.Control.toggleShowWalls()">
          🧱 VER PAREDES
        </button>
        <button class="btn-full" style="background:#444;margin-top:6px;"
          onclick="LightPlugin.UI.togglePanel()">
          🎛️ Painel de Iluminação
        </button>
      </div>
    `;
    sidebar.appendChild(cat);
    this.updateToggleButtons();
  },

  updateToggleButtons() {
    const m = LightPlugin.Model.settings;

    const tb = document.getElementById("light-toggle-btn");
    if (tb) {
      tb.textContent  = m.enabled ? "✅ ILUMINAÇÃO ATIVA" : "💡 ATIVAR ILUMINAÇÃO";
      tb.style.background = m.enabled ? "#3a7a3a" : "";
    }

    const rb = document.getElementById("light-reveal-btn");
    if (rb) {
      rb.innerHTML = m.masterReveal
        ? "✅ MOSTRANDO TUDO <kbd style='font-size:0.7em;opacity:0.6'>L</kbd>"
        : "👁 MOSTRAR TUDO <kbd style='font-size:0.7em;opacity:0.6'>L</kbd>";
      rb.style.background = m.masterReveal ? "#5a5a1a" : "#3a3a3a";
    }

    const wb = document.getElementById("light-walls-vis-btn");
    if (wb) {
      wb.textContent  = m.showWalls ? "✅ PAREDES VISÍVEIS" : "🧱 VER PAREDES";
      wb.style.background = m.showWalls ? "#4a3a1a" : "#3a3a3a";
    }

    this.updateToolbar();
  },

  // ============================================================
  // PAINEL FLUTUANTE
  // ============================================================

  _createPanel() {
    if (document.getElementById("light-panel")) return;

    const panel = document.createElement("div");
    panel.id = "light-panel";
    panel.style.cssText = `
      position:fixed; top:55px; right:20px;
      width:360px; max-width:97vw; max-height:88vh;
      display:none; flex-direction:column;
      background:#111;
      border:1px solid rgba(255,200,50,0.2);
      border-radius:12px;
      box-shadow:0 16px 48px rgba(0,0,0,0.85);
      z-index:200; font-family:inherit; color:#e0e0e0;
      overflow:hidden;
    `;

    panel.innerHTML = `
      <!-- HEADER -->
      <div id="light-panel-hdr" style="
        display:flex;justify-content:space-between;align-items:center;
        padding:12px 15px 10px;
        background:linear-gradient(180deg,#1c1c1c,#161616);
        border-bottom:1px solid rgba(255,255,255,0.05);
        cursor:move;flex-shrink:0;
      ">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:16px;">💡</span>
          <span style="font-weight:700;font-size:0.92em;color:#fff;">Iluminação</span>
        </div>
        <button onclick="LightPlugin.UI.togglePanel()" style="
          background:rgba(255,255,255,0.06);border:none;color:#888;
          width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px;
        ">✕</button>
      </div>

      <!-- TOOLBAR — Categoria + Formato + Função -->
      <div id="light-toolbar" style="
        padding:10px 12px;
        background:#0f0f0f;
        border-bottom:1px solid rgba(255,255,255,0.05);
        flex-shrink:0;
      ">
        <!-- Linha 1: Categorias -->
        <div style="display:flex;gap:4px;margin-bottom:6px;">
          ${[
            { cat:"darkness", icon:"🌑", label:"Escuridão" },
            { cat:"light",    icon:"💡", label:"Luz"       },
            { cat:"walls",    icon:"🧱", label:"Paredes"   }
          ].map(c => `
            <button class="lt-cat-btn" data-cat="${c.cat}"
              onclick="LightPlugin.Control.setState({cat:'${c.cat}'});LightPlugin.Control.enterLightMode();"
              style="flex:1;padding:6px 4px;font-size:0.72em;font-weight:600;
                border:1px solid rgba(255,255,255,0.08);border-radius:6px;
                background:transparent;color:#666;cursor:pointer;transition:all 0.15s;">
              ${c.icon} ${c.label}
            </button>
          `).join("")}
        </div>

        <!-- Linha 2: Formato -->
        <div id="lt-fmt-row" style="display:flex;gap:4px;margin-bottom:6px;"></div>

        <!-- Linha 3: Função -->
        <div style="display:flex;gap:4px;">
          ${[
            { fn:"select", icon:"↖", label:"Selecionar" },
            { fn:"draw",   icon:"✏", label:"Desenhar"   },
            { fn:"erase",  icon:"✕", label:"Apagar"     }
          ].map(f => `
            <button class="lt-fn-btn" data-fn="${f.fn}"
              onclick="LightPlugin.Control.setState({fn:'${f.fn}'})"
              style="flex:1;padding:5px 4px;font-size:0.7em;font-weight:600;
                border:1px solid rgba(255,255,255,0.07);border-radius:5px;
                background:transparent;color:#555;cursor:pointer;transition:all 0.15s;">
              ${f.icon} ${f.label}
            </button>
          `).join("")}
        </div>
      </div>

      <!-- ABAS -->
      <div style="display:flex;background:#0c0c0c;border-bottom:1px solid rgba(255,255,255,0.04);flex-shrink:0;">
        ${[["objetos","Objetos"],["config","Config"]].map(([k,l],i) => `
          <button class="lt-tab-btn" data-tab="${k}"
            onclick="LightPlugin.UI.switchTab('${k}')"
            style="flex:1;padding:8px;font-size:0.7em;font-weight:600;text-transform:uppercase;
              letter-spacing:0.7px;border:none;border-bottom:2px solid ${i===0?"#f1c40f":"transparent"};
              background:transparent;color:${i===0?"#e0e0e0":"#444"};cursor:pointer;transition:all 0.15s;">
            ${l}
          </button>
        `).join("")}
      </div>

      <!-- CONTEÚDO -->
      <div style="overflow-y:auto;flex:1;">
        <div id="lt-tab-objetos" style="padding:12px;" class="lt-tab-content">
          <!-- Propriedades do objeto selecionado -->
          <div id="lt-obj-props" style="
            margin-bottom:10px;padding:10px;
            background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.05);
            border-radius:7px;display:none;
          "></div>

          <div style="margin-bottom:10px;">
            <input id="lt-search-input" type="search" placeholder="Buscar por nome..."
              value=""
              style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#eee;"
              oninput="LightPlugin.UI.setSearch(this.value)">
          </div>
          <div style="display:flex;gap:8px;margin-bottom:12px;">
            <button onclick="LightPlugin.Control.fillWithDarkness()"
              style="flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(231,76,60,0.12);color:#f39c12;cursor:pointer;">
              Preencher com sombra
            </button>
            <button onclick="LightPlugin.Control.fillWithLight()"
              style="flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(46,204,113,0.12);color:#2ecc71;cursor:pointer;">
              Preencher com luz
            </button>
          </div>

          <!-- Listas -->
          <div style="margin-bottom:8px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <div style="font-size:0.65em;text-transform:uppercase;color:#444;letter-spacing:1px;">🌑 Escuridão</div>
            <button onclick="LightPlugin.Control.clearAllDarkness()"
              style="font-size:0.65em;padding:3px 8px;background:rgba(231,76,60,0.1);color:#e74c3c;
                border:1px solid rgba(231,76,60,0.2);border-radius:4px;cursor:pointer;">
              Limpar tudo
            </button>
          </div>
          <div id="lt-list-darkness" style="display:flex;flex-direction:column;gap:3px;"></div>
          </div>
          <div style="margin-bottom:8px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <div style="font-size:0.65em;text-transform:uppercase;color:#444;letter-spacing:1px;">💡 Luzes</div>
            <button onclick="LightPlugin.Control.clearAllLights()"
              style="font-size:0.65em;padding:3px 8px;background:rgba(231,76,60,0.1);color:#e74c3c;
                border:1px solid rgba(231,76,60,0.2);border-radius:4px;cursor:pointer;">
              Limpar tudo
            </button>
          </div>
          <div id="lt-list-lights" style="display:flex;flex-direction:column;gap:3px;"></div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <span style="font-size:0.65em;text-transform:uppercase;color:#444;letter-spacing:1px;">🧱 Paredes</span>
              <button onclick="if(confirm('Apagar todas as paredes?'))LightPlugin.Control.clearAllWalls()"
                style="font-size:0.65em;padding:3px 8px;background:rgba(231,76,60,0.1);color:#e74c3c;
                  border:1px solid rgba(231,76,60,0.2);border-radius:4px;cursor:pointer;">
                Limpar tudo
              </button>
            </div>
            <div id="lt-list-walls" style="display:flex;flex-direction:column;gap:3px;"></div>
          </div>
        </div>

        <div id="lt-tab-config" style="padding:12px;display:none;" class="lt-tab-content">
          <div style="display:flex;flex-direction:column;gap:14px;">

            <div>
              <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                <label style="font-size:0.78em;color:#888;">Opacidade Sombra</label>
                <span id="lt-fog-lbl" style="font-size:0.75em;color:#f1c40f;">
                  ${Math.round(LightPlugin.Model.settings.fogOpacity*100)}%
                </span>
              </div>
              <input type="range" min="0" max="100"
                value="${Math.round(LightPlugin.Model.settings.fogOpacity*100)}"
                style="accent-color:#f1c40f;"
                oninput="LightPlugin.Model.settings.fogOpacity=+this.value/100;
                  document.getElementById('lt-fog-lbl').textContent=this.value+'%';
                  LightPlugin.Control.requestRedraw();">
            </div>

            <div>
              <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                <label style="font-size:0.78em;color:#888;">Opacidade Penumbra</label>
                <span id="lt-dim-lbl" style="font-size:0.75em;color:#f1c40f;">
                  ${Math.round(LightPlugin.Model.settings.dimOpacity*100)}%
                </span>
              </div>
              <input type="range" min="0" max="100"
                value="${Math.round(LightPlugin.Model.settings.dimOpacity*100)}"
                style="accent-color:#f1c40f;"
                oninput="LightPlugin.Model.settings.dimOpacity=+this.value/100;
                  document.getElementById('lt-dim-lbl').textContent=this.value+'%';
                  LightPlugin.Control.requestRedraw();">
            </div>

          </div>
        </div>
      </div>
    `;

    document.body.appendChild(panel);
    this._panel = panel;
    this._makeDraggable(panel, document.getElementById("light-panel-hdr"));
    this.updateToolbar();
    this.refreshLists();
  },

  togglePanel() {
    if (!this._panel) this._createPanel();
    const v = this._panel.style.display !== "none";
    this._panel.style.display = v ? "none" : "flex";
    if (!v) { this.updateToolbar(); this.refreshLists(); }
  },

  switchTab(key) {
    document.querySelectorAll(".lt-tab-btn").forEach(b => {
      const active = b.dataset.tab === key;
      b.style.borderBottom = active ? "2px solid #f1c40f" : "2px solid transparent";
      b.style.color        = active ? "#e0e0e0" : "#444";
    });
    document.querySelectorAll(".lt-tab-content").forEach(el => {
      el.style.display = el.id === "lt-tab-" + key ? "block" : "none";
    });
  },

  // ============================================================
  // TOOLBAR
  // ============================================================

  updateToolbar() {
    const s = LightPlugin.Control.state;

    // Categorias
    document.querySelectorAll(".lt-cat-btn").forEach(b => {
      const active = b.dataset.cat === s.cat;
      b.style.background  = active ? "rgba(241,196,15,0.15)" : "transparent";
      b.style.color       = active ? "#f1c40f" : "#666";
      b.style.borderColor = active ? "rgba(241,196,15,0.35)" : "rgba(255,255,255,0.08)";
    });

    // Atualiza campo de busca se preciso
    const searchInput = document.getElementById("lt-search-input");
    if (searchInput && searchInput.value !== this.searchQuery) {
      searchInput.value = this.searchQuery;
    }

    // Formatos (dependem da categoria)
    const fmtRow = document.getElementById("lt-fmt-row");
    if (fmtRow) {
      const fmts = s.cat === "walls"
        ? [{ fmt:"line", icon:"╱", label:"Linha" }]
        : [{ fmt:"rect", icon:"▭", label:"Retângulo" }, { fmt:"circle", icon:"◯", label:"Círculo" }];

      fmtRow.innerHTML = fmts.map(f => `
        <button class="lt-fmt-btn" data-fmt="${f.fmt}"
          onclick="LightPlugin.Control.setState({fmt:'${f.fmt}'})"
          style="flex:1;padding:5px 4px;font-size:0.7em;font-weight:600;
            border:1px solid rgba(255,255,255,0.07);border-radius:5px;
            background:${s.fmt===f.fmt?"rgba(241,196,15,0.12)":"transparent"};
            color:${s.fmt===f.fmt?"#f1c40f":"#555"};cursor:pointer;transition:all 0.15s;">
          ${f.icon} ${f.label}
        </button>
      `).join("");

      // Se o fmt atual não é válido para esta categoria, corrige
      if (s.cat === "walls" && s.fmt !== "line") {
        LightPlugin.Control.state.fmt = "line";
      }
    }

    // Funções
    document.querySelectorAll(".lt-fn-btn").forEach(b => {
      const active = b.dataset.fn === s.fn;
      b.style.background  = active ? "rgba(78,154,241,0.15)" : "transparent";
      b.style.color       = active ? "#4e9af1" : "#555";
      b.style.borderColor = active ? "rgba(78,154,241,0.3)" : "rgba(255,255,255,0.07)";
    });
  },

  // ============================================================
  // LISTAS DE OBJETOS
  // ============================================================

  refreshLists() {
    this._renderList(
      "lt-list-darkness",
      LightPlugin.Model.darknessObjects,
      o => `🌑 ${o.name} <span style='opacity:.4;font-size:.7em'>${o.type}</span>`,
      id => { LightPlugin.Model.removeDarkness(id); LightPlugin.Control.requestRedraw(); LightPlugin.UI.refreshLists(); }
    );
    this._renderList(
      "lt-list-lights",
      LightPlugin.Model.lightObjects,
      o => `💡 ${o.name} <span style='opacity:.4;font-size:.7em'>${o.lightType}</span>`,
      id => LightPlugin.Control.removeLight(id)
    );
    this._renderList(
      "lt-list-walls",
      LightPlugin.Model.wallObjects,
      o => `🧱 ${o.name}`,
      id => { LightPlugin.Model.removeWall(id); LightPlugin.Control.requestRedraw(); LightPlugin.UI.refreshLists(); }
    );
  },

  _renderList(containerId, items, labelFn, onDelete) {
    const el = document.getElementById(containerId);
    if (!el) return;

    const query = this.searchQuery.trim().toLowerCase();
    const filtered = query
      ? items.filter(o => (o.name || "").toLowerCase().includes(query))
      : items;

    if (!filtered.length) {
      el.innerHTML = `<div style="color:#333;font-size:0.75em;padding:4px 0;">Nenhum resultado.</div>`;
      return;
    }

    el.innerHTML = "";
    filtered.forEach(obj => {
      const row = document.createElement("div");
      row.style.cssText = `
        display:flex;align-items:center;justify-content:space-between;
        padding:5px 8px;border-radius:5px;
        background:rgba(255,255,255,0.02);
        border:1px solid rgba(255,255,255,0.05);
        font-size:0.78em;cursor:pointer;
      `;
      const nameEl = document.createElement("div");
      nameEl.style.cssText = "flex:1;color:#bbb;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;";
      nameEl.innerHTML = labelFn(obj);

      const delBtn = document.createElement("button");
      delBtn.textContent = "✕";
      delBtn.style.cssText = `
        background:none;border:none;color:#555;cursor:pointer;
        font-size:12px;padding:0 4px;flex-shrink:0;
      `;
      delBtn.onmouseenter = () => delBtn.style.color = "#e74c3c";
      delBtn.onmouseleave = () => delBtn.style.color = "#555";
      delBtn.onclick = e => { e.stopPropagation(); onDelete(obj.id); };

      row.onclick = () => {
        if (containerId === "lt-list-darkness") {
          LightPlugin.Control.selectObject("darkness", obj.id);
          LightPlugin.Control.setState({ cat: "darkness" });
          LightPlugin.UI.showObjectProperties(obj);
        } else if (containerId === "lt-list-lights") {
          LightPlugin.Control.selectObject("light", obj.id);
          LightPlugin.Control.setState({ cat: "light" });
          LightPlugin.UI.showObjectProperties(obj);
        } else if (containerId === "lt-list-walls") {
          LightPlugin.Control.clearSelection();
          LightPlugin.Control.setState({ cat: "walls" });
          LightPlugin.UI.showObjectProperties(obj);
        }
        LightPlugin.UI.updateToolbar();
      };

      row.appendChild(nameEl);
      row.appendChild(delBtn);
      el.appendChild(row);
    });
  },

  // ============================================================
  // PAINEL DE PROPRIEDADES DO OBJETO SELECIONADO
  // ============================================================

  showObjectProperties(obj) {
    const el = document.getElementById("lt-obj-props");
    if (!el) return;

    if (!obj) { el.style.display = "none"; return; }
    el.style.display = "block";

    if (obj.lightType !== undefined) {
      // Objeto de luz
      el.innerHTML = `
        <div style="font-size:0.7em;color:#f1c40f;font-weight:700;margin-bottom:8px;">💡 ${obj.name}</div>
        <div style="margin-bottom:10px;">
          <label style="display:block;font-size:0.72em;color:#888;margin-bottom:4px;">Nome</label>
          <input type="text" value=${JSON.stringify(obj.name)}
            style="width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#eee;"
            oninput="LightPlugin.UI.updateObjectName(${obj.id},'light',this.value)"
            onblur="LightPlugin.UI.refreshLists()">
        </div>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <div style="flex:1;padding:5px;font-size:0.7em;border-radius:5px;border:1px solid rgba(255,255,255,0.1);
              background:rgba(255,255,255,0.04);color:#777; text-align:center;">
            ☀ Fonte de Luz
          </div>
        </div>
        <div style="margin-bottom:6px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
            <label style="font-size:0.72em;color:#888;">Raio Luz (sq)</label>
            <span id="lp-lr" style="font-size:0.72em;color:#f1c40f;">${obj.lightRadius}</span>
          </div>
          <input type="range" min="1" max="30" value="${obj.lightRadius}" style="accent-color:#f1c40f;"
            oninput="document.getElementById('lp-lr').textContent=this.value;
              LightPlugin.Control.updateLight(${obj.id},{lightRadius:+this.value})">
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
            <label style="font-size:0.72em;color:#888;">Raio Penumbra (sq)</label>
            <span id="lp-dr" style="font-size:0.72em;color:#f1c40f;">${obj.dimRadius}</span>
          </div>
          <input type="range" min="1" max="40" value="${obj.dimRadius}" style="accent-color:#f1c40f;"
            oninput="document.getElementById('lp-dr').textContent=this.value;
              LightPlugin.Control.updateLight(${obj.id},{dimRadius:+this.value})">
        </div>
      `;
    } else if (obj.behavior !== undefined) {
      // Objeto de escuridão
      el.innerHTML = `
        <div style="font-size:0.7em;color:#aaa;font-weight:700;margin-bottom:8px;">🌑 ${obj.name}</div>
        <div style="margin-bottom:10px;">
          <label style="display:block;font-size:0.72em;color:#888;margin-bottom:4px;">Nome</label>
          <input type="text" value=${JSON.stringify(obj.name)}
            style="width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#eee;"
            oninput="LightPlugin.UI.updateObjectName(${obj.id},'darkness',this.value)">
        </div>
        <div style="display:flex;gap:6px;">
          <button onclick="LightPlugin.Model.updateDarkness(${obj.id},{behavior:'eternal'});LightPlugin.Control.requestRedraw();"
            style="flex:1;padding:5px;font-size:0.7em;border-radius:5px;border:1px solid rgba(255,255,255,0.1);
              background:${obj.behavior==="eternal"?"rgba(100,100,200,0.2)":"rgba(255,255,255,0.04)"};
              color:${obj.behavior==="eternal"?"#aaf":"#777"};cursor:pointer;">
            ♾ Eterna
          </button>
          <button onclick="LightPlugin.Model.updateDarkness(${obj.id},{behavior:'temporary'});LightPlugin.Control.requestRedraw();"
            style="flex:1;padding:5px;font-size:0.7em;border-radius:5px;border:1px solid rgba(255,255,255,0.1);
              background:${obj.behavior==="temporary"?"rgba(100,200,100,0.2)":"rgba(255,255,255,0.04)"};
              color:${obj.behavior==="temporary"?"#afa":"#777"};cursor:pointer;">
            ⏱ Temporária
          </button>
        </div>
      `;
    } else {
      el.innerHTML = `<div style="font-size:0.75em;color:#888;">🧱 ${obj.name}</div>`;
    }
  },

  updateObjectName(id, cat, value) {
    if (cat === "light") {
      LightPlugin.Model.updateLight(id, { name: value });
    } else if (cat === "darkness") {
      LightPlugin.Model.updateDarkness(id, { name: value });
    }
  },

  setSearch(value) {
    this.searchQuery = value;
    this.refreshLists();
  },

  // ============================================================
  // INTEGRAÇÃO TOKEN — injeta "Luz do Token" no menu de contexto
  // ============================================================

  _injectTokenMenuItem() {
    const t = setInterval(() => {
      const menu = document.getElementById("token-context-menu");
      if (!menu) return;
      clearInterval(t);
      if (menu.querySelector("[data-action='token-light']")) return;

      const item = document.createElement("div");
      item.className = "menu-item";
      item.dataset.action = "token-light";
      item.textContent = "💡 Luz do Token";
      menu.appendChild(item);

      menu.addEventListener("click", e => {
        if (!e.target.closest("[data-action='token-light']")) return;
        const id    = window.TokenPlugin?.UI?.currentTokenId;
        if (id == null) return;
        const token = TokenPlugin.Model.getById(id);
        if (token) this._openTokenLightDialog(token);
      });
    }, 300);
  },

  _openTokenLightDialog(token) {
    if (document.getElementById("tl-dialog")) return;
    const l = token.light || { enabled: false, radius: 6, dimRadius: 12 };

    const d = document.createElement("div");
    d.id = "tl-dialog";
    d.style.cssText = `
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      z-index:10000;background:#1a1a1a;border:1px solid rgba(241,196,15,0.3);
      border-radius:10px;padding:18px;width:280px;
      box-shadow:0 8px 32px rgba(0,0,0,0.8);
      font-family:inherit;color:#e0e0e0;
    `;
    d.innerHTML = `
      <div style="font-weight:700;color:#f1c40f;margin-bottom:14px;font-size:0.95em;">
        💡 Luz — ${token.appearance?.name || "Token"}
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.85em;">
          <input type="checkbox" id="tl-en" ${l.enabled?"checked":""}> Emitir Luz
        </label>
        <div>
          <div style="display:flex;justify-content:space-between;">
            <label style="font-size:0.73em;color:#888;">Raio de Luz (sq)</label>
            <span id="tl-lr-v" style="font-size:0.73em;color:#f1c40f;">${l.radius}</span>
          </div>
          <input type="range" min="1" max="30" value="${l.radius}" id="tl-lr"
            style="accent-color:#f1c40f;width:100%;"
            oninput="document.getElementById('tl-lr-v').textContent=this.value">
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;">
            <label style="font-size:0.73em;color:#888;">Raio de Penumbra (sq)</label>
            <span id="tl-dr-v" style="font-size:0.73em;color:#f1c40f;">${l.dimRadius}</span>
          </div>
          <input type="range" min="1" max="40" value="${l.dimRadius}" id="tl-dr"
            style="accent-color:#f1c40f;width:100%;"
            oninput="document.getElementById('tl-dr-v').textContent=this.value">
        </div>
        <div style="display:flex;gap:8px;margin-top:4px;">
          <button onclick="document.body.removeChild(document.getElementById('tl-dialog'))"
            style="flex:1;padding:8px;background:rgba(255,255,255,0.07);color:#888;border:none;border-radius:6px;cursor:pointer;">
            Cancelar
          </button>
          <button onclick="LightPlugin.UI._saveTokenLight(${token.id})"
            style="flex:1;padding:8px;background:rgba(241,196,15,0.2);color:#f1c40f;
              border:1px solid rgba(241,196,15,0.3);border-radius:6px;cursor:pointer;font-weight:600;">
            ✔ Salvar
          </button>
        </div>
      </div>
    `;
    document.body.appendChild(d);
  },

  _saveTokenLight(tokenId) {
    const token = TokenPlugin.Model.getById(tokenId);
    if (!token) return;
    token.light = {
      enabled:   !!document.getElementById("tl-en")?.checked,
      radius:    parseInt(document.getElementById("tl-lr")?.value)  || 6,
      dimRadius: parseInt(document.getElementById("tl-dr")?.value)  || 12
    };
    LightPlugin.Control.requestRedraw();
    const d = document.getElementById("tl-dialog");
    if (d) document.body.removeChild(d);
  },

  // ============================================================
  // UTILS
  // ============================================================

  _makeDraggable(el, handle) {
    let drag = false, ox = 0, oy = 0;
    (handle||el).addEventListener("mousedown", e => {
      if (["BUTTON","INPUT","SELECT"].includes(e.target.tagName)) return;
      drag = true;
      const r = el.getBoundingClientRect();
      ox = e.clientX - r.left; oy = e.clientY - r.top;
      el.style.transform = "none";
    });
    document.addEventListener("mousemove", e => {
      if (!drag) return;
      el.style.left = (e.clientX - ox) + "px";
      el.style.top  = (e.clientY - oy) + "px";
    });
    document.addEventListener("mouseup", () => { drag = false; });
  }
};
</script>
