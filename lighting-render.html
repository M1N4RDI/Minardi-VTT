<script>
// lighting-render.html — Renderização do sistema de iluminação
console.log('lighting-render carregado');

window.Lighting = window.Lighting || {};

Lighting.Render = {
  _canvas:  null,
  _ctx:     null,
  _off:     null,     // canvas offscreen para composição
  _offCtx:  null,

  init() {
    if (this._canvas) return;
    const map = document.getElementById('map-container');
    if (!map) { setTimeout(() => this.init(), 200); return; }

    const c = document.createElement('canvas');
    c.id = 'lighting-overlay-canvas';
    c.style.cssText =
      'position:absolute;top:0;left:0;width:100%;height:100%;' +
      'pointer-events:none;z-index:999;';
    map.appendChild(c);

    this._canvas  = c;
    this._ctx     = c.getContext('2d');
    this._off     = document.createElement('canvas');
    this._offCtx  = this._off.getContext('2d');

    this._sync();
    const ro = new ResizeObserver(() => this._sync());
    ro.observe(map);
    window.addEventListener('resize', () => this._sync());
  },

  _sync() {
    const map = document.getElementById('map-container');
    if (!map || !this._canvas) return;
    const w = map.clientWidth  || map.offsetWidth  || 800;
    const h = map.clientHeight || map.offsetHeight || 600;
    this._canvas.width  = w;  this._canvas.height  = h;
    this._off.width     = w;  this._off.height     = h;
    this.draw();
  },

  // Mantido por compatibilidade — não mais necessário com points[]
  buildSpatialIndex() {},

  // ── Pipeline principal ───────────────────────────────────────
  draw() {
    if (!this._canvas) { this.init(); return; }

    const ctx = this._ctx;
    const W   = this._canvas.width;
    const H   = this._canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Sem fog: só mostra paredes e UI
    if (!Lighting.Model.fogEnabled) {
      this._drawWalls(ctx);
      this._drawUI(ctx);
      return;
    }

    // Master reveal: overlay leve + paredes
    if (Lighting.Model.masterReveal) {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(0, 0, W, H);
      this._drawWalls(ctx);
      this._drawUI(ctx);
      return;
    }

    const darkObjs  = Lighting.Model.objects.filter(o => o.visible && o.mode === 'dark');
    const lightObjs = Lighting.Model.objects.filter(o => o.visible && o.mode === 'light');

    console.log('[Lighting.Render.draw]', {
      fogEnabled: Lighting.Model.fogEnabled,
      objects:    Lighting.Model.objects.length,
      dark:       darkObjs.length,
      light:      lightObjs.length,
      W, H,
    });

    // Sem áreas escuras: nada a fazer
    if (darkObjs.length === 0) {
      this._drawWalls(ctx);
      this._drawUI(ctx);
      return;
    }

    // ── Offscreen: constrói a máscara ────────────────────────
    const offCtx = this._offCtx;
    offCtx.clearRect(0, 0, W, H);

    // Passo 1 — pinta escuridão
    offCtx.globalCompositeOperation = 'source-over';
    darkObjs.forEach(obj => this._fillDarkShape(offCtx, obj));

    // Passo 2 — recorta luz (destination-out)
    const gs = window.VTTGrid?.size || Lighting.Model.gridSize || 50;

    lightObjs.forEach(obj => {
      offCtx.save();
      offCtx.globalCompositeOperation = 'destination-out';

      if (obj.shape === 'circle') {
        // luminosity e penumbra estão em QUADRADOS DE GRID
        const lightR =
  ((obj.lightDiameter || 6) / 2) * gs;

const penumR =
  ((obj.penumbraDiameter || 12) / 2) * gs;
        const cx = obj.x, cy = obj.y;

        // Penumbra: gradiente do raio de luz até o raio de penumbra
        if (penumR > lightR) {
          const grad = offCtx.createRadialGradient(cx, cy, lightR, cx, cy, penumR);
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          offCtx.fillStyle = grad;
          offCtx.beginPath();
          offCtx.arc(cx, cy, penumR, 0, Math.PI * 2);
          offCtx.fill();
        }

        // Núcleo de luz total
        offCtx.fillStyle = 'rgba(0,0,0,1)';
        offCtx.beginPath();
        offCtx.arc(cx, cy, lightR, 0, Math.PI * 2);
        offCtx.fill();

      } else {
        // rect / polygon: recorte direto
        offCtx.fillStyle = 'rgba(0,0,0,1)';
        this._fillLightShape(offCtx, obj);
      }

      offCtx.restore();
    });

    // Passo 3 — copia máscara para o canvas visível
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(this._off, 0, 0);

    // Passo 4 — paredes e UI por cima
    this._drawWalls(ctx);
    this._drawUI(ctx);
  },

  // ── Preenche forma escura ────────────────────────────────────
  _fillDarkShape(ctx, obj) {
    const gs = window.VTTGrid?.size || Lighting.Model.gridSize || 50;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,1)';

    if (obj.shape === 'rect') {
      if (obj.rotation) {
        const cx = obj.x + (obj.width  || 100) / 2;
        const cy = obj.y + (obj.height || 100) / 2;
        ctx.translate(cx, cy);
        ctx.rotate(obj.rotation * Math.PI / 180);
        ctx.translate(-cx, -cy);
      }
      ctx.fillRect(obj.x, obj.y, obj.width || 100, obj.height || 100);

    } else if (obj.shape === 'circle') {
      // radius está em PIXELS (como o usuário arrastou no canvas)
      const r = obj.radius || 50;
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, r, 0, Math.PI * 2);
      ctx.fill();

    } else if (obj.shape === 'polygon' && obj.points?.length >= 3) {
      ctx.beginPath();
      ctx.moveTo(obj.points[0].x, obj.points[0].y);
      for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  },

  // ── Preenche forma de luz (rect/polygon) ─────────────────────
  _fillLightShape(ctx, obj) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,1)';

    if (obj.shape === 'rect') {
      if (obj.rotation) {
        const cx = obj.x + (obj.width  || 100) / 2;
        const cy = obj.y + (obj.height || 100) / 2;
        ctx.translate(cx, cy);
        ctx.rotate(obj.rotation * Math.PI / 180);
        ctx.translate(-cx, -cy);
      }
      ctx.fillRect(obj.x, obj.y, obj.width || 100, obj.height || 100);

    } else if (obj.shape === 'polygon' && obj.points?.length >= 3) {
      ctx.beginPath();
      ctx.moveTo(obj.points[0].x, obj.points[0].y);
      for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  },

  // ── Paredes ──────────────────────────────────────────────────
  _drawWalls(ctx) {
    if (!Lighting.Model.walls?.length) return;
    const selId = Lighting.Model.selectedWallId;

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    Lighting.Model.walls.forEach(wall => {
      if (!wall.visible || wall.points.length < 2) return;
      const isSel = wall.id === selId;

      ctx.beginPath();
      ctx.moveTo(wall.points[0].x, wall.points[0].y);
      for (let i = 1; i < wall.points.length; i++) {
        ctx.lineTo(wall.points[i].x, wall.points[i].y);
      }
      ctx.strokeStyle = isSel ? 'rgba(255,220,60,0.95)' : 'rgba(255,80,80,0.85)';
      ctx.lineWidth   = isSel ? 3 : 2;
      ctx.setLineDash([]);
      ctx.stroke();

      // Vértices
      wall.points.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, isSel ? 5 : 4, 0, Math.PI * 2);
        ctx.fillStyle = isSel ? 'rgba(255,220,60,0.95)' : 'rgba(255,80,80,0.9)';
        ctx.fill();
      });
    });

    ctx.restore();
  },

  // ── UI: seleção, handles, previews ──────────────────────────
  _drawUI(ctx) {
    if (!window.Lighting?.Input) return;

    const input      = Lighting.Input;
    const selectedId = input.selectedObjectId;
    const activeTool = input.activeTool;
    const ts         = input.toolState || {};

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    // Seleção de objeto
    if (selectedId) {
      const obj = Lighting.Model.getObject(selectedId);
      if (obj) {
        ctx.strokeStyle = 'rgba(255,220,60,0.95)';
        ctx.lineWidth   = 2;
        ctx.setLineDash([4, 3]);
        this._strokeShape(ctx, obj);
        ctx.setLineDash([]);
        if (!obj.locked) this._drawHandles(ctx, obj);
      }
    }

    // Handles de parede selecionada
    const selWall = Lighting.Model.getWall(Lighting.Model.selectedWallId);
    if (selWall) this._drawWallHandles(ctx, selWall);

    // Previews de ferramentas
    ctx.setLineDash([4, 4]);

    if (activeTool === 'rect' && ts.start && ts.current) {
      const x1 = Math.min(ts.start.x, ts.current.x);
      const y1 = Math.min(ts.start.y, ts.current.y);
      const w  = Math.abs(ts.current.x - ts.start.x);
      const h  = Math.abs(ts.current.y - ts.start.y);
      ctx.strokeStyle = 'rgba(80,220,120,0.9)';
      ctx.fillStyle   = 'rgba(80,220,120,0.15)';
      ctx.lineWidth   = 2;
      ctx.fillRect(x1, y1, w, h);
      ctx.strokeRect(x1, y1, w, h);
    }

    if (activeTool === 'circle' && ts.start && ts.current) {
      const dx = ts.current.x - ts.start.x;
      const dy = ts.current.y - ts.start.y;
      const r  = Math.hypot(dx, dy);
      ctx.strokeStyle = 'rgba(80,220,120,0.9)';
      ctx.fillStyle   = 'rgba(80,220,120,0.15)';
      ctx.lineWidth   = 2;
      ctx.beginPath();
      ctx.arc(ts.start.x, ts.start.y, r, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }

    if (activeTool === 'polygon' && ts.points?.length > 0) {
      const pts = ts.points;
      ctx.strokeStyle = 'rgba(80,200,100,0.8)';
      ctx.lineWidth   = 2;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      if (ts.current) ctx.lineTo(ts.current.x, ts.current.y);
      ctx.stroke();
      ctx.setLineDash([]);
      pts.forEach((p, i) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, i === 0 ? 7 : 5, 0, Math.PI * 2);
        ctx.fillStyle = i === 0 ? 'rgba(255,200,50,0.95)' : 'rgba(80,200,100,0.9)';
        ctx.fill();
      });
    }

    // Preview de parede em construção
    // Suporta tanto toolState.p1 (formato antigo) quanto toolState.points[] (novo)
    if (activeTool === 'wall') {
      const pts = ts.points || (ts.p1 ? [ts.p1] : null);
      if (pts?.length > 0) {
        ctx.strokeStyle = 'rgba(255,100,100,0.9)';
        ctx.lineWidth   = 3;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        if (ts.current) ctx.lineTo(ts.current.x, ts.current.y);
        ctx.stroke();
        ctx.setLineDash([]);
        pts.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,100,100,0.9)';
          ctx.fill();
        });
      }
    }

    ctx.setLineDash([]);
    ctx.restore();
  },

  // ── Stroke de seleção ────────────────────────────────────────
  _strokeShape(ctx, obj) {
    const gs = window.VTTGrid?.size || Lighting.Model.gridSize || 50;
    ctx.save();

    if (obj.shape === 'rect') {
      if (obj.rotation) {
        const cx = obj.x + (obj.width  || 100) / 2;
        const cy = obj.y + (obj.height || 100) / 2;
        ctx.translate(cx, cy);
        ctx.rotate(obj.rotation * Math.PI / 180);
        ctx.translate(-cx, -cy);
      }
      ctx.strokeRect(obj.x, obj.y, obj.width || 100, obj.height || 100);

    } else if (obj.shape === 'circle') {
      const r = obj.mode === 'dark'
        ? (obj.radius || 50)                  // dark: pixels
        : ((obj.lightDiameter || 6) / 2) * gs;         // light: quadrados → pixels
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, r, 0, Math.PI * 2);
      ctx.stroke();

    } else if (obj.shape === 'polygon' && obj.points?.length >= 3) {
      ctx.beginPath();
      ctx.moveTo(obj.points[0].x, obj.points[0].y);
      for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
      ctx.closePath();
      ctx.stroke();
    }

    ctx.restore();
  },

  // ── Handles de objetos ───────────────────────────────────────
  _drawHandles(ctx, obj) {
    const hs = 8;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle   = 'rgba(255,220,100,0.9)';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth   = 1;

    if (obj.shape === 'rect') {
      const corners = [
        [obj.x,              obj.y             ],
        [obj.x + obj.width,  obj.y             ],
        [obj.x,              obj.y + obj.height],
        [obj.x + obj.width,  obj.y + obj.height],
      ];
      corners.forEach(([cx, cy]) => {
        ctx.fillRect(cx - hs/2, cy - hs/2, hs, hs);
      });

      const rot = this.getRotateHandlePos(obj);

ctx.beginPath();
ctx.moveTo(rot.x, rot.y + 15);
ctx.lineTo(rot.x, obj.y);
ctx.stroke();

ctx.beginPath();
ctx.arc(rot.x, rot.y, hs/2 + 2, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();

    } else if (obj.shape === 'circle') {
      const gs = window.VTTGrid?.size || Lighting.Model.gridSize || 50;
      const r  = obj.mode === 'dark'
        ? (obj.radius || 50)
        : ((obj.lightDiameter || 6) / 2) * gs;
      // Handle central
      ctx.beginPath(); ctx.arc(obj.x, obj.y, hs/2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // Handle de raio
      ctx.fillStyle = 'rgba(255,180,50,0.9)';
      ctx.beginPath(); ctx.arc(obj.x + r, obj.y, hs/2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // Preview do raio
      ctx.strokeStyle = 'rgba(255,220,100,0.4)';
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(obj.x, obj.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      // Para círculos de luz: handle e preview de penumbra
      if (obj.mode === 'light') {
        const penumR =
  ((obj.penumbraDiameter || 12) / 2) * gs;
        ctx.fillStyle = 'rgba(255,120,50,0.8)';
        ctx.beginPath(); ctx.arc(obj.x + penumR, obj.y, hs/2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,150,50,0.3)';
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(obj.x, obj.y, penumR, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }

    } else if (obj.shape === 'polygon' && obj.points) {
      obj.points.forEach(p => {
        ctx.beginPath(); 
        ctx.arc(p.x, p.y, hs/2, 0, Math.PI * 2); 
        ctx.fill(); 
        ctx.stroke();
      });

const rot = this.getRotateHandlePos(obj);

ctx.beginPath();
ctx.moveTo(rot.x, rot.y + 15);
ctx.lineTo(rot.x, rot.y + 35);
ctx.stroke();

ctx.beginPath();
ctx.arc(rot.x, rot.y, hs/2 + 2, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();

    }

    ctx.restore();
  },

  // ── Handles de parede selecionada ────────────────────────────
  _drawWallHandles(ctx, wall) {
    if (!wall || wall.locked) return;
    const HANDLE_R = 7;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    wall.points.forEach((p, i) => {
      const isSel = (i === Lighting.Input?.selectedVertexIndex);
      ctx.beginPath();
      ctx.arc(p.x, p.y, HANDLE_R, 0, Math.PI * 2);
      ctx.fillStyle   = isSel ? 'rgba(255,100,80,0.95)' : 'rgba(255,220,60,0.9)';
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth   = 1;
      ctx.fill();
      ctx.stroke();
    });

    // Midpoints (inserção de vértice)
    for (let i = 0; i < wall.points.length - 1; i++) {
      const a  = wall.points[i], b = wall.points[i+1];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      ctx.beginPath();
      ctx.arc(mx, my, 4, 0, Math.PI * 2);
      ctx.fillStyle   = 'rgba(100,200,255,0.7)';
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  },

  // ─────────────────────────────────────────────────────────────
  // Helpers usados pelo Input
  // ─────────────────────────────────────────────────────────────

  _getCenter(obj) {
    if (obj.shape === 'polygon' && obj.points?.length) {
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;

      obj.points.forEach(p => {
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x);
        maxY = Math.max(maxY, p.y);
      });

      return {
        x: (minX + maxX) / 2,
        y: (minY + maxY) / 2,
      };
    }

    return {
      x: obj.x + (obj.width || 100) / 2,
      y: obj.y + (obj.height || 100) / 2,
    };
  },

  _wallCenter(wall) {
    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;

    wall.points.forEach(p => {
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x);
      maxY = Math.max(maxY, p.y);
    });

    return {
      x: (minX + maxX) / 2,
      y: (minY + maxY) / 2,
    };
  },

    getRotateHandlePos(obj) {
    if (!obj) return null;

    const c = this._getCenter(obj);

    return {
      x: c.x,
      y: c.y - 40,
    };
  },

  _wallRotateHandlePos(wall) {
    if (!wall) return null;

    const c = this._wallCenter(wall);

    return {
      x: c.x,
      y: c.y - 40,
    };
  },

    getHandles(obj) {
    if (!obj) return [];

    if (obj.shape === 'rect') {
      const x = obj.x;
      const y = obj.y;
      const w = obj.width || 100;
      const h = obj.height || 100;

      return [
        { handleId:'tl', x:x,     y:y     },
        { handleId:'tr', x:x+w,   y:y     },
        { handleId:'bl', x:x,     y:y+h   },
        { handleId:'br', x:x+w,   y:y+h   },

        { handleId:'tm', x:x+w/2, y:y     },
        { handleId:'bm', x:x+w/2, y:y+h   },
        { handleId:'ml', x:x,     y:y+h/2 },
        { handleId:'mr', x:x+w,   y:y+h/2 },
      ];
    }

    if (obj.shape === 'circle') {
      const gs = window.VTTGrid?.size || 50;

      if (obj.mode === 'dark') {
        const r = obj.radius || 50;

        return [
          {
            handleId:'center',
            x:obj.x,
            y:obj.y
          },
          {
            handleId:'light-r',
            x:obj.x + r,
            y:obj.y
          }
        ];
      }

      const lightR =
        ((obj.lightDiameter || 6) / 2) * gs;

      const penumR =
        ((obj.penumbraDiameter || 12) / 2) * gs;

      return [
        {
          handleId:'center',
          x:obj.x,
          y:obj.y
        },
        {
          handleId:'light-r',
          x:obj.x + lightR,
          y:obj.y
        },
        {
          handleId:'penum-r',
          x:obj.x + penumR,
          y:obj.y
        }
      ];
    }

    return [];
  },

};

setTimeout(() => { Lighting.Render.init(); }, 300);
</script>
