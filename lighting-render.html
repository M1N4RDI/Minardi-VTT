<script>
// lighting-render.html
console.log('lighting-render carregado');

window.Lighting = window.Lighting || {};

Lighting.Render = {
  _canvas: null,   // canvas visível (overlay sobre o mapa)
  _ctx:    null,
  _off:    null,   // canvas offscreen para composição
  _offCtx: null,

  init() {
    if (this._canvas) return;
    const map = document.getElementById('map-container');
    if (!map) { setTimeout(() => this.init(), 200); return; }

    let c = document.getElementById('lighting-overlay-canvas');
    if (!c) {
      c = document.createElement('canvas');
      c.id = 'lighting-overlay-canvas';
      c.style.cssText =
        'position:absolute;top:0;left:0;width:100%;height:100%;' +
        'pointer-events:none;z-index:999;';
      map.appendChild(c);
    }
    this._canvas = c;
    this._ctx    = c.getContext('2d');

    // Canvas offscreen para composição sem vazar transparência
    this._off    = document.createElement('canvas');
    this._offCtx = this._off.getContext('2d');

    this._sync();
    const ro = new ResizeObserver(() => this._sync());
    ro.observe(map);
    window.addEventListener('resize', () => this._sync());
  },

  _sync() {
    const map = document.getElementById('map-container');
    if (!map || !this._canvas) return;
    const w = map.offsetWidth  || map.clientWidth  || 800;
    const h = map.offsetHeight || map.clientHeight || 600;
    if (this._canvas.width !== w || this._canvas.height !== h) {
      this._canvas.width = w;  this._canvas.height = h;
      this._off.width    = w;  this._off.height    = h;
    }
    this.draw();
  },

  buildSpatialIndex() { /* compatibilidade */ },

  draw() {
    if (!this._canvas) { this.init(); return; }

    const ctx = this._ctx;
    const W   = this._canvas.width;
    const H   = this._canvas.height;

    // Sempre começa limpo
    ctx.clearRect(0, 0, W, H);

    if (!Lighting.Model.enabled) return;

    // masterReveal: overlay levíssimo + paredes
    if (Lighting.Model.masterReveal) {
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(0, 0, W, H);
      this._drawWalls(ctx);
      this._drawUI();
      return;
    }

    const darkObjs  = Lighting.Model.objects.filter(o => o.visible && o.mode === 'dark');
    const lightObjs = Lighting.Model.objects.filter(o => o.visible && o.mode === 'light');

    // Se não há escuridão: canvas limpo (mapa totalmente visível)
    if (darkObjs.length === 0) {
      this._drawWalls(ctx);
      this._drawUI();
      return;
    }

    // ── Pipeline offscreen ──────────────────────────────────────
    // O segredo: compor no offscreen e copiar para o visível.
    // Assim o destination-out nunca toca o canvas visível diretamente.

    const off    = this._off;
    const offCtx = this._offCtx;

    // 1. Offscreen começa TOTALMENTE PRETO OPACO
    offCtx.clearRect(0, 0, W, H);
    offCtx.globalCompositeOperation = 'source-over';
    offCtx.fillStyle = 'rgba(0,0,0,1)';
    offCtx.fillRect(0, 0, W, H);

    // 2. Pinta objetos de escuridão manual que NÃO sejam cobertura total
    //    (a cobertura total já está embutida no fillRect acima)
    const manualDark = darkObjs.filter(o => !o._totalCover);
    if (manualDark.length > 0) {
      offCtx.globalCompositeOperation = 'source-over';
      offCtx.fillStyle = 'rgba(0,0,0,1)';
      manualDark.forEach(obj => this._fillShape(offCtx, obj));
    }

    // 3. Para cada fonte de luz: primeiro penumbra (suave), depois luz plena
    //    Ambas usam destination-out para abrir buraco no preto
    lightObjs.forEach(obj => {
      const gs = window.VTTGrid?.size || Lighting.Model.gridSize || 50;

      // Raios em pixels (modelo armazena em células de grid)
      const lightR   = ((obj.lightDiameter   || 6)  / 2) * gs;
      const penumR   = ((obj.penumbraDiameter || 12) / 2) * gs;
      const cx = obj.x;
      const cy = obj.y;

      // 3a. Penumbra (gradiente de destination-out entre lightR e penumR)
      if (penumR > lightR) {
        offCtx.save();
        offCtx.globalCompositeOperation = 'destination-out';
        const grad = offCtx.createRadialGradient(cx, cy, lightR * 0.85, cx, cy, penumR);
        grad.addColorStop(0,   'rgba(0,0,0,1)');    // totalmente recortado
        grad.addColorStop(0.5, 'rgba(0,0,0,0.65)'); // meio recortado (penumbra)
        grad.addColorStop(1,   'rgba(0,0,0,0)');    // sem recorte (borda)
        offCtx.fillStyle = grad;
        offCtx.beginPath();
        offCtx.arc(cx, cy, penumR, 0, Math.PI * 2);
        offCtx.fill();
        offCtx.restore();
      }

      // 3b. Luz plena (destination-out total dentro de lightR)
      offCtx.save();
      offCtx.globalCompositeOperation = 'destination-out';
      offCtx.fillStyle = 'rgba(0,0,0,1)';
      offCtx.beginPath();
      offCtx.arc(cx, cy, lightR, 0, Math.PI * 2);
      offCtx.fill();
      offCtx.restore();
    });

    // Para objetos de luz não-círculo (rect, polygon): luz plena sem penumbra
    lightObjs.filter(o => o.shape !== 'circle').forEach(obj => {
      offCtx.save();
      offCtx.globalCompositeOperation = 'destination-out';
      offCtx.fillStyle = 'rgba(0,0,0,1)';
      this._fillShape(offCtx, obj);
      offCtx.restore();
    });

    // 4. Copia offscreen → canvas visível (source-over normal)
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(off, 0, 0);

    // 5. Paredes e UI sempre por cima, no canvas visível
    this._drawWalls(ctx);
    this._drawUI();
  },

  // ── Helpers de forma ────────────────────────────────────────

  _fillShape(ctx, obj) {
    ctx.save();
    if (obj.rotation && obj.shape === 'rect') {
      const cx = obj.x + (obj.width  || 100) / 2;
      const cy = obj.y + (obj.height || 100) / 2;
      ctx.translate(cx, cy);
      ctx.rotate((obj.rotation || 0) * Math.PI / 180);
      ctx.translate(-cx, -cy);
    }
    ctx.beginPath();
    if (obj.shape === 'rect') {
      ctx.rect(obj.x, obj.y, obj.width || 100, obj.height || 100);
    } else if (obj.shape === 'circle') {
      const gs     = window.VTTGrid?.size || Lighting.Model.gridSize || 50;
      const radius = ((obj.lightDiameter || 6) / 2) * gs;
      ctx.arc(obj.x, obj.y, radius, 0, Math.PI * 2);
    } else if (obj.shape === 'polygon' && obj.points && obj.points.length >= 3) {
      ctx.moveTo(obj.points[0].x, obj.points[0].y);
      for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
  },

  _strokeShape(ctx, obj) {
    ctx.save();
    if (obj.rotation && obj.shape === 'rect') {
      const cx = obj.x + (obj.width  || 100) / 2;
      const cy = obj.y + (obj.height || 100) / 2;
      ctx.translate(cx, cy);
      ctx.rotate((obj.rotation || 0) * Math.PI / 180);
      ctx.translate(-cx, -cy);
    }
    ctx.beginPath();
    if (obj.shape === 'rect') {
      ctx.rect(obj.x, obj.y, obj.width || 100, obj.height || 100);
    } else if (obj.shape === 'circle') {
      const gs     = window.VTTGrid?.size || Lighting.Model.gridSize || 50;
      const radius = ((obj.lightDiameter || 6) / 2) * gs;
      ctx.arc(obj.x, obj.y, radius, 0, Math.PI * 2);
    } else if (obj.shape === 'polygon' && obj.points && obj.points.length >= 3) {
      ctx.moveTo(obj.points[0].x, obj.points[0].y);
      for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
      ctx.closePath();
    }
    ctx.stroke();
    ctx.restore();
  },

  _drawWalls(ctx) {
    if (!Lighting.Model.walls || !Lighting.Model.walls.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(255,90,90,0.65)';
    ctx.lineWidth   = 2;
    ctx.setLineDash([5, 4]);
    Lighting.Model.walls.forEach(w => {
      if (!w.visible || !w.p1 || !w.p2) return;
      ctx.beginPath();
      ctx.moveTo(w.p1.x, w.p1.y);
      ctx.lineTo(w.p2.x, w.p2.y);
      ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.restore();
  },

  // ── UI: seleção, alças, preview de ferramenta ───────────────

  _drawUI() {
    if (!window.Lighting || !Lighting.Input) return;
    const ctx        = this._ctx;
    const selectedId = Lighting.Input.selectedObjectId;
    const activeTool = Lighting.Input.activeTool;
    const toolState  = Lighting.Input.toolState || {};

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    // Objeto selecionado
    if (selectedId) {
      const obj = Lighting.Model.getObject(selectedId);
      if (obj) {
        ctx.strokeStyle = 'rgba(255,220,60,0.95)';
        ctx.lineWidth   = 2;
        ctx.setLineDash([4, 3]);
        this._strokeShape(ctx, obj);
        ctx.setLineDash([]);
        if (!obj.locked) {
          this._drawHandles(ctx, obj);
          if (obj.shape === 'rect') this._drawRotateHandle(ctx, obj);
        }
      }
    }

    // Previews de ferramenta
    ctx.strokeStyle = 'rgba(80,220,120,0.9)';
    ctx.fillStyle   = 'rgba(80,220,120,0.15)';
    ctx.lineWidth   = 2;
    ctx.setLineDash([4, 4]);

    if (activeTool === 'rect' && toolState.start && toolState.current) {
      const x1 = Math.min(toolState.start.x, toolState.current.x);
      const y1 = Math.min(toolState.start.y, toolState.current.y);
      const w  = Math.abs(toolState.current.x - toolState.start.x);
      const h  = Math.abs(toolState.current.y - toolState.start.y);
      ctx.fillRect(x1, y1, w, h);
      ctx.strokeRect(x1, y1, w, h);
    }

    if (activeTool === 'circle' && toolState.start && toolState.current) {
      const dx = toolState.current.x - toolState.start.x;
      const dy = toolState.current.y - toolState.start.y;
      const r  = Math.sqrt(dx * dx + dy * dy);
      ctx.beginPath();
      ctx.arc(toolState.start.x, toolState.start.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    if (activeTool === 'polygon' && toolState.points && toolState.points.length > 0) {
      const pts = toolState.points;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      if (toolState.current) ctx.lineTo(toolState.current.x, toolState.current.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(80,220,120,0.9)';
      pts.forEach(p => ctx.fillRect(p.x - 4, p.y - 4, 8, 8));
    }

    if (activeTool === 'wall' && toolState.p1) {
      ctx.strokeStyle = 'rgba(255,100,100,0.9)';
      ctx.lineWidth   = 3;
      ctx.beginPath();
      ctx.moveTo(toolState.p1.x, toolState.p1.y);
      if (toolState.current) ctx.lineTo(toolState.current.x, toolState.current.y);
      ctx.stroke();
    }

    ctx.setLineDash([]);
    ctx.restore();
  },

  // Retorna as alças de redimensionamento de um objeto
  // Cada alça: { x, y, cursor, handleId }
  getHandles(obj) {
    const gs = window.VTTGrid?.size || 50;

    if (obj.shape === 'rect') {
      const { x, y } = obj;
      const w = obj.width  || 100;
      const h = obj.height || 100;
      return [
        { x,     y,     cursor: 'nw-resize', handleId: 'tl' },
        { x:x+w, y,     cursor: 'ne-resize', handleId: 'tr' },
        { x,     y:y+h, cursor: 'sw-resize', handleId: 'bl' },
        { x:x+w, y:y+h, cursor: 'se-resize', handleId: 'br' },
        { x:x+w/2, y,     cursor: 'n-resize',  handleId: 'tm' },
        { x:x+w/2, y:y+h, cursor: 's-resize',  handleId: 'bm' },
        { x,       y:y+h/2, cursor: 'w-resize', handleId: 'ml' },
        { x:x+w,   y:y+h/2, cursor: 'e-resize', handleId: 'mr' },
      ];
    }

    if (obj.shape === 'circle') {
      const lightR   = ((obj.lightDiameter   || 6)  / 2) * gs;
      const penumR   = ((obj.penumbraDiameter || 12) / 2) * gs;
      return [
        { x: obj.x + lightR, y: obj.y, cursor: 'ew-resize', handleId: 'light-r'  },
        { x: obj.x,          y: obj.y, cursor: 'move',       handleId: 'center'   },
        { x: obj.x + penumR, y: obj.y, cursor: 'ew-resize', handleId: 'penum-r'  },
      ];
    }

    return [];
  },

  _drawHandles(ctx, obj) {
    const handles = this.getHandles(obj);
    const gs      = window.VTTGrid?.size || 50;

    handles.forEach(h => {
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';

      // Cor: alças de luz = amarelo, de penumbra = laranja, resto = branco
      if (h.handleId === 'light-r')  ctx.fillStyle = 'rgba(255,230,80,0.95)';
      else if (h.handleId === 'penum-r') ctx.fillStyle = 'rgba(255,150,50,0.85)';
      else if (h.handleId === 'center')  ctx.fillStyle = 'rgba(100,200,255,0.85)';
      else                               ctx.fillStyle = 'rgba(255,255,255,0.9)';

      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.arc(h.x, h.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });

    // Para círculo: desenha os anéis de referência
    if (obj.shape === 'circle') {
      const lightR = ((obj.lightDiameter   || 6)  / 2) * gs;
      const penumR = ((obj.penumbraDiameter || 12) / 2) * gs;

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      // Anel de luz
      ctx.strokeStyle = 'rgba(255,230,80,0.6)';
      ctx.lineWidth   = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, lightR, 0, Math.PI * 2);
      ctx.stroke();
      // Anel de penumbra
      ctx.strokeStyle = 'rgba(255,150,50,0.4)';
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, penumR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  },

  // Alça de rotação para rect: círculo acima do centro superior
  _drawRotateHandle(ctx, obj) {
    if (obj.shape !== 'rect') return;
    const cx  = obj.x + (obj.width  || 100) / 2;
    const cy  = obj.y - 22;
    const rot = (obj.rotation || 0) * Math.PI / 180;

    // Rotaciona em torno do centro do rect
    const rcx = obj.x + (obj.width  || 100) / 2;
    const rcy = obj.y + (obj.height || 100) / 2;
    const dx  = cx - rcx;
    const dy  = cy - rcy;
    const rx  = rcx + dx * Math.cos(rot) - dy * Math.sin(rot);
    const ry  = rcy + dx * Math.sin(rot) + dy * Math.cos(rot);

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle   = 'rgba(200,100,255,0.9)';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.arc(rx, ry, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Linha do centro ao handle
    ctx.strokeStyle = 'rgba(200,100,255,0.5)';
    ctx.lineWidth   = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(rcx, obj.y);
    ctx.lineTo(rx, ry);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  },

  // Retorna a posição da alça de rotação para hit-test
  getRotateHandlePos(obj) {
    if (obj.shape !== 'rect') return null;
    const cx  = obj.x + (obj.width  || 100) / 2;
    const cy  = obj.y - 22;
    const rot = (obj.rotation || 0) * Math.PI / 180;
    const rcx = obj.x + (obj.width  || 100) / 2;
    const rcy = obj.y + (obj.height || 100) / 2;
    const dx  = cx - rcx;
    const dy  = cy - rcy;
    return {
      x: rcx + dx * Math.cos(rot) - dy * Math.sin(rot),
      y: rcy + dx * Math.sin(rot) + dy * Math.cos(rot),
    };
  },
};

setTimeout(() => { Lighting.Render.init(); }, 300);
</script>
