<script>
// lighting-render.html
// Renderizador e algoritmo de visibilidade para o módulo Lighting
console.log('lighting-render carregado');

window.Lighting = window.Lighting || {};
Lighting.Render = {
  _canvas: null,
  _ctx: null,
  _spatialIndex: null,
  _cellSize: null,

  init() {
    if (this._canvas) return;
    const map = document.getElementById('map-container');
    if (!map) return;
    const c = document.createElement('canvas');
    c.id = 'lighting-overlay-canvas';
    c.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;';
    map.appendChild(c);
    this._canvas = c;
    this._ctx = c.getContext('2d');
    this._sync();
    window.addEventListener('resize', () => this._sync());
  },

  _sync() {
    const map = document.getElementById('map-container');
    if (!map || !this._canvas) return;
    const w = map.clientWidth || map.offsetWidth;
    const h = map.clientHeight || map.offsetHeight;
    this._canvas.width = w; this._canvas.height = h;
    this._cellSize = (Lighting.Model.gridSize || 50) * 2; // cell size for spatial index
    this.buildSpatialIndex();
  },

  // Build simple spatial hash for wall segments
  buildSpatialIndex() {
    const cell = this._cellSize || 100;
    const idx = new Map();
    const segs = Lighting.Model.walls.map(w => ({ x1:w.p1.x, y1:w.p1.y, x2:w.p2.x, y2:w.p2.y, id:w.id }));
    for (let s = 0; s < segs.length; s++) {
      const sg = segs[s];
      const minX = Math.min(sg.x1, sg.x2), maxX = Math.max(sg.x1, sg.x2);
      const minY = Math.min(sg.y1, sg.y2), maxY = Math.max(sg.y1, sg.y2);
      const ix0 = Math.floor(minX / cell), ix1 = Math.floor(maxX / cell);
      const iy0 = Math.floor(minY / cell), iy1 = Math.floor(maxY / cell);
      for (let ix = ix0; ix <= ix1; ix++) for (let iy = iy0; iy <= iy1; iy++) {
        const key = ix + ',' + iy;
        if (!idx.has(key)) idx.set(key, []);
        idx.get(key).push(sg);
      }
    }
    this._spatialIndex = { map: idx, cell };
  },

  // Get candidate segments along a ray by sampling cells
  _getCandidateSegmentsForRay(ox, oy, dx, dy, maxDist) {
    const out = [];
    if (!this._spatialIndex) return out;
    const { map, cell } = this._spatialIndex;
    const steps = Math.max(3, Math.ceil(maxDist / cell) * 2);
    const seen = new Set();
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * maxDist;
      const x = ox + dx * t, y = oy + dy * t;
      const ix = Math.floor(x / cell), iy = Math.floor(y / cell);
      const key = ix + ',' + iy;
      const bucket = map.get(key);
      if (!bucket) continue;
      for (let j = 0; j < bucket.length; j++) {
        const sg = bucket[j];
        if (!seen.has(sg.id)) { seen.add(sg.id); out.push(sg); }
      }
    }
    return out;
  },

  // Core: compute visibility polygon (angles derived from wall vertices)
  computeVisibility(origin, radiusPx) {
    const walls = Lighting.Model.walls;
    if (!walls || walls.length === 0) return this._circlePoly(origin, radiusPx, 64);

    // collect segments
    const segs = walls.map(w => ({ x1:w.p1.x, y1:w.p1.y, x2:w.p2.x, y2:w.p2.y }));

    // collect unique vertices
    const verts = [];
    const seen = new Set();
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      const k1 = s.x1 + ',' + s.y1; if (!seen.has(k1)) { seen.add(k1); verts.push({x:s.x1,y:s.y1}); }
      const k2 = s.x2 + ',' + s.y2; if (!seen.has(k2)) { seen.add(k2); verts.push({x:s.x2,y:s.y2}); }
    }

    const angs = [];
    for (let i = 0; i < verts.length; i++) {
      const v = verts[i];
      const a = Math.atan2(v.y - origin.y, v.x - origin.x);
      angs.push(a - 0.0001, a, a + 0.0001);
    }
    angs.sort((a,b)=>a-b);
    const uniq = [];
    for (let i=0;i<angs.length;i++) if (i===0||Math.abs(angs[i]-angs[i-1])>1e-7) uniq.push(angs[i]);

    const hits = [];
    const ox = origin.x, oy = origin.y;
    for (let i = 0; i < uniq.length; i++) {
      const angle = uniq[i];
      const dx = Math.cos(angle), dy = Math.sin(angle);

      let nearestT = radiusPx;
      let hitX = ox + dx * radiusPx, hitY = oy + dy * radiusPx;

      // candidate segments from spatial index
      const candidates = this._getCandidateSegmentsForRay(ox, oy, dx, dy, radiusPx);
      // fallback: if none, test all
      const toTest = candidates.length ? candidates : segs;

      for (let s = 0; s < toTest.length; s++) {
        const seg = toTest[s];
        const t = this._raySegIntersect(ox, oy, dx, dy, seg.x1, seg.y1, seg.x2, seg.y2);
        if (t !== null && t >= 0 && t < nearestT) {
          nearestT = t;
          hitX = ox + dx * t; hitY = oy + dy * t;
        }
      }

      hits.push({ x: hitX, y: hitY, angle });
    }

    hits.sort((a,b)=>a.angle-b.angle);
    return hits;
  },

  _circlePoly(origin, radius, res) {
    const pts = [];
    for (let i=0;i<res;i++){
      const a = (i/res)*Math.PI*2;
      pts.push({ x: origin.x + Math.cos(a)*radius, y: origin.y + Math.sin(a)*radius, angle:a });
    }
    return pts;
  },

  // ray-seg intersection (returns t along ray) — copied/inline fast
  _raySegIntersect(ox, oy, dx, dy, x1, y1, x2, y2) {
    const ex = x2 - x1, ey = y2 - y1;
    const denom = dx * ey - dy * ex;
    if (Math.abs(denom) < 1e-10) return null;
    const tx = x1 - ox, ty = y1 - oy;
    const t = (tx * ey - ty * ex) / denom;
    const u = (tx * dy - ty * dx) / denom;
    if (t > 0 && u >= 0 && u <= 1) return t;
    return null;
  },

  // Draw full lighting pass using 3-state rendering: darkness, penumbra (gray), light (reveal)
  draw() {
    if (!this._canvas) this.init();
    const c = this._canvas; if (!c) return;
    const ctx = this._ctx; const W = c.width, H = c.height;
    ctx.clearRect(0,0,W,H);

    // Draw darkness base
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fillRect(0,0,W,H);
    ctx.restore();

    const gridSize = Lighting.Model.gridSize || 50;

    // Draw penumbras first: cut then paint gray
    for (let i=0;i<Lighting.Model.lights.length;i++){
      const L = Lighting.Model.lights[i];
      const rPenPx = (L.rPenumbra || L.rPenumbra===0 ? L.rPenumbra : 12) * gridSize;
      const poly = this.computeVisibility({x:L.x,y:L.y}, rPenPx);
      if (!poly || !poly.length) continue;

      // cut
      ctx.save(); ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath();
      ctx.moveTo(poly[0].x, poly[0].y); for (let p=1;p<poly.length;p++) ctx.lineTo(poly[p].x, poly[p].y); ctx.closePath(); ctx.fill(); ctx.restore();
      // paint gray (penumbra)
      ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = 'rgba(120,120,120,1)'; ctx.beginPath(); ctx.moveTo(poly[0].x, poly[0].y); for (let p=1;p<poly.length;p++) ctx.lineTo(poly[p].x, poly[p].y); ctx.closePath(); ctx.fill(); ctx.restore();
    }

    // Draw full light (reveal) — cut the gray to reveal map
    for (let i=0;i<Lighting.Model.lights.length;i++){
      const L = Lighting.Model.lights[i];
      const rLightPx = (L.rLight || 6) * gridSize;
      const poly = this.computeVisibility({x:L.x,y:L.y}, rLightPx);
      if (!poly || !poly.length) continue;
      ctx.save(); ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.moveTo(poly[0].x, poly[0].y); for (let p=1;p<poly.length;p++) ctx.lineTo(poly[p].x, poly[p].y); ctx.closePath(); ctx.fill(); ctx.restore();

      // If explored mode, accumulate
      // For now, assume explore mode active if any fog.behavior==='explored'
      const hasExploredMode = Lighting.Model.fogs.some(f=>f.behavior==='explored');
      if (hasExploredMode) Lighting.Model.accumulateExplored(poly.map(p=>({x:p.x,y:p.y}))); 
    }

    // Apply fog manual permanent masks on top
    for (let i=0;i<Lighting.Model.fogs.length;i++){
      const f = Lighting.Model.fogs[i];
      if (f.behavior === 'permanent'){
        ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = 'rgba(0,0,0,1)'; ctx.beginPath();
        const pts = f.points || [];
        if (pts.length){ ctx.moveTo(pts[0].x, pts[0].y); for (let p=1;p<pts.length;p++) ctx.lineTo(pts[p].x, pts[p].y); ctx.closePath(); ctx.fill(); }
        ctx.restore();
      }
    }

    // Draw explored mask overlay (if any) — reveal explored areas permanently
    if (Lighting.Model.exploredMask && Lighting.Model.exploredMask.length){
      ctx.save(); ctx.globalCompositeOperation = 'destination-out';
      for (let i=0;i<Lighting.Model.exploredMask.length;i++){
        const poly = Lighting.Model.exploredMask[i];
        if (!poly || !poly.length) continue; ctx.beginPath(); ctx.moveTo(poly[0].x, poly[0].y); for (let p=1;p<poly.length;p++) ctx.lineTo(poly[p].x, poly[p].y); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }
};

// Auto-init if map exists
setTimeout(()=>{ Lighting.Render.init(); }, 200);
</script>
