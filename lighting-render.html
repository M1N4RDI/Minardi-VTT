<script>
// lighting-render.html — Renderização do sistema de iluminação
console.log('lighting-render carregado');

window.Lighting = window.Lighting || {};

Lighting.Render = {
  _canvas: null,
  _ctx: null,

  init() {
    if (this._canvas) return;
    const map = document.getElementById('map-container');
    if (!map) { setTimeout(() => this.init(), 200); return; }

    let c = document.getElementById('lighting-overlay-canvas');
    if (!c) {
      c = document.createElement('canvas');
      c.id = 'lighting-overlay-canvas';
      c.style.cssText =
        'position:absolute;top:0;left:0;width:100%;height:100%;' +
        'pointer-events:none;z-index:999;';
      map.appendChild(c);
    }
    this._canvas = c;
    this._ctx    = c.getContext('2d');

    this._sync();

    const ro = new ResizeObserver(() => this._sync());
    ro.observe(map);
    window.addEventListener('resize', () => this._sync());
  },

  _sync() {
    const map = document.getElementById('map-container');
    if (!map || !this._canvas) return;
    const w = map.offsetWidth  || map.clientWidth  || 800;
    const h = map.offsetHeight || map.clientHeight || 600;
    // Só redimensiona se mudou — evita clear desnecessário
    if (this._canvas.width !== w || this._canvas.height !== h) {
      this._canvas.width  = w;
      this._canvas.height = h;
    }
    this.draw();
  },

  buildSpatialIndex() {
    // Mantido por compatibilidade com lighting-input.html que chama isso ao criar paredes
    // Não faz nada aqui pois o render atual não usa raycasting
  },

  draw() {
    if (!this._canvas) { this.init(); return; }

    const ctx = this._ctx;
    const W   = this._canvas.width;
    const H   = this._canvas.height;

    // Sempre começa limpo
    ctx.clearRect(0, 0, W, H);

    // Se desativado: apenas limpa (mapa visível normalmente)
    if (!Lighting.Model.enabled) return;

    // masterReveal: mestre vê tudo — overlay fino + paredes visíveis
    if (Lighting.Model.masterReveal) {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(0, 0, W, H);
      this._drawWalls(ctx);
      this._drawUI();
      return;
    }

    // ─────────────────────────────────────────────────────────────
    // PIPELINE CORRETO para fog of war com canvas 2d:
    //
    //  1. Começar com canvas transparente (clearRect já feito acima)
    //  2. Pintar TODA escuridão (objetos dark) em source-over
    //  3. Recortar as LUZES com destination-out (remove pixels escuros)
    //  4. Pintar penumbra das luzes (gradiente suave nas bordas)
    //  5. Desenhar paredes e UI por cima (source-over)
    //
    // A chave: luz SEMPRE recorta a escuridão — não importa a ordem
    // dos objetos na lista, porque são operações de composição.
    // ─────────────────────────────────────────────────────────────

    const darkObjs  = Lighting.Model.objects.filter(o => o.visible && o.mode === 'dark');
    const lightObjs = Lighting.Model.objects.filter(o => o.visible && o.mode === 'light');

    // Se não há nenhum objeto escuro, não há nada para escurecer —
    // mas ainda mostra paredes e UI se existirem
    if (darkObjs.length === 0) {
      this._drawWalls(ctx);
      this._drawUI();
      return;
    }

    // ── Passo 1: Pintar escuridão ──────────────────────────────
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    darkObjs.forEach(obj => {
      ctx.fillStyle = 'rgba(0,0,0,0.92)';
      this._fillShape(ctx, obj);
    });

    ctx.restore();

    // ── Passo 2: Recortar penumbra das luzes (destination-out suave) ─
    lightObjs.forEach(obj => {
      if (obj.shape !== 'circle') return; // penumbra só para círculos por enquanto
      const penPx = (obj.penumbra || 4) * (window.VTTGrid?.size || Lighting.Model.gridSize || 50);
      if (penPx <= 0) return;

      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';

      const r    = obj.radius;
      const cx   = obj.x;
      const cy   = obj.y;
      const grad = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r + penPx);
      grad.addColorStop(0,   'rgba(0,0,0,1)');   // totalmente recortado no centro
      grad.addColorStop(0.6, 'rgba(0,0,0,0.7)'); // penumbra
      grad.addColorStop(1,   'rgba(0,0,0,0)');   // borda sem recorte

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r + penPx, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    });

    // ── Passo 3: Recortar luz plena (destination-out total) ────
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,1)';

    lightObjs.forEach(obj => {
      this._fillShape(ctx, obj);
    });

    ctx.restore();

    // ── Passo 4: Paredes e UI (sempre visíveis, por cima) ──────
    this._drawWalls(ctx);
    this._drawUI();
  },

  // Preenche a forma de um objeto no ctx atual
  _fillShape(ctx, obj) {
    if (obj.shape === 'rect') {
      ctx.fillRect(obj.x, obj.y, obj.width || 100, obj.height || 100);

    } else if (obj.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, obj.radius || 50, 0, Math.PI * 2);
      ctx.fill();

    } else if (obj.shape === 'polygon' && obj.points && obj.points.length >= 3) {
      ctx.beginPath();
      ctx.moveTo(obj.points[0].x, obj.points[0].y);
      for (let i = 1; i < obj.points.length; i++) {
        ctx.lineTo(obj.points[i].x, obj.points[i].y);
      }
      ctx.closePath();
      ctx.fill();
    }
  },

  _drawWalls(ctx) {
    if (!Lighting.Model.walls || !Lighting.Model.walls.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(255,100,100,0.6)';
    ctx.lineWidth   = 2;
    ctx.setLineDash([5, 4]);
    Lighting.Model.walls.forEach(wall => {
      if (!wall.visible || !wall.p1 || !wall.p2) return;
      ctx.beginPath();
      ctx.moveTo(wall.p1.x, wall.p1.y);
      ctx.lineTo(wall.p2.x, wall.p2.y);
      ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.restore();
  },

  _strokeShape(ctx, obj) {
    if (obj.shape === 'rect') {
      ctx.strokeRect(obj.x, obj.y, obj.width || 100, obj.height || 100);
    } else if (obj.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, obj.radius || 50, 0, Math.PI * 2);
      ctx.stroke();
    } else if (obj.shape === 'polygon' && obj.points && obj.points.length >= 3) {
      ctx.beginPath();
      ctx.moveTo(obj.points[0].x, obj.points[0].y);
      for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
      ctx.closePath();
      ctx.stroke();
    }
  },

  _drawHandles(ctx, obj) {
    const s = 8;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(255,220,80,0.95)';
    if (obj.shape === 'rect') {
      [
        [obj.x,              obj.y             ],
        [obj.x + obj.width,  obj.y             ],
        [obj.x,              obj.y + obj.height],
        [obj.x + obj.width,  obj.y + obj.height],
      ].forEach(([cx, cy]) => ctx.fillRect(cx - s/2, cy - s/2, s, s));
    } else if (obj.shape === 'circle') {
      ctx.fillRect(obj.x - s/2,              obj.y - s/2, s, s);
      ctx.fillRect(obj.x + obj.radius - s/2, obj.y - s/2, s, s);
    }
    ctx.restore();
  },

  _drawUI() {
    if (!window.Lighting || !Lighting.Input) return;

    const ctx        = this._ctx;
    const selectedId = Lighting.Input.selectedObjectId;
    const activeTool = Lighting.Input.activeTool;
    const toolState  = Lighting.Input.toolState || {};

    // Destaque do objeto selecionado
    if (selectedId) {
      const obj = Lighting.Model.getObject(selectedId);
      if (obj) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = 'rgba(255,220,80,0.95)';
        ctx.lineWidth   = 2;
        ctx.setLineDash([4, 3]);
        this._strokeShape(ctx, obj);
        ctx.setLineDash([]);
        if (!obj.locked) this._drawHandles(ctx, obj);
        ctx.restore();
      }
    }

    // Preview da ferramenta em uso
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(80,220,120,0.9)';
    ctx.fillStyle   = 'rgba(80,220,120,0.18)';
    ctx.lineWidth   = 2;
    ctx.setLineDash([4, 4]);

    if (activeTool === 'rect' && toolState.start && toolState.current) {
      const x1 = Math.min(toolState.start.x, toolState.current.x);
      const y1 = Math.min(toolState.start.y, toolState.current.y);
      const w  = Math.abs(toolState.current.x - toolState.start.x);
      const h  = Math.abs(toolState.current.y - toolState.start.y);
      ctx.fillRect(x1, y1, w, h);
      ctx.strokeRect(x1, y1, w, h);
    }

    if (activeTool === 'circle' && toolState.start && toolState.current) {
      const dx = toolState.current.x - toolState.start.x;
      const dy = toolState.current.y - toolState.start.y;
      const r  = Math.sqrt(dx * dx + dy * dy);
      ctx.beginPath();
      ctx.arc(toolState.start.x, toolState.start.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    if (activeTool === 'polygon' && toolState.points && toolState.points.length > 0) {
      const pts = toolState.points;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      if (toolState.current) ctx.lineTo(toolState.current.x, toolState.current.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(80,220,120,0.9)';
      pts.forEach(p => ctx.fillRect(p.x - 4, p.y - 4, 8, 8));
    }

    if (activeTool === 'wall' && toolState.p1) {
      ctx.strokeStyle = 'rgba(255,100,100,0.9)';
      ctx.lineWidth   = 3;
      ctx.beginPath();
      ctx.moveTo(toolState.p1.x, toolState.p1.y);
      if (toolState.current) ctx.lineTo(toolState.current.x, toolState.current.y);
      ctx.stroke();
    }

    ctx.setLineDash([]);
    ctx.restore();
  },
};

setTimeout(() => { Lighting.Render.init(); }, 300);
</script>
