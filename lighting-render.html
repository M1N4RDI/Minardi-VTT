<script>
// lighting-render.html — Renderização do sistema de iluminação
console.log('lighting-render carregado');

window.Lighting = window.Lighting || {};
Lighting.Render = {
  _canvas: null,
  _ctx: null,
  _spatialIndex: null,

  init() {
    if (this._canvas) return;
    const map = document.getElementById('map-container');
    if (!map) {
      setTimeout(() => this.init(), 200);
      return;
    }
    const c = document.createElement('canvas');
    c.id = 'lighting-overlay-canvas';
    c.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;';
    map.appendChild(c);
    this._canvas = c;
    this._ctx = c.getContext('2d');
    this._sync();
    window.addEventListener('resize', () => this._sync());
  },

  _sync() {
    const map = document.getElementById('map-container');
    if (!map || !this._canvas) return;
    const w = map.clientWidth || map.offsetWidth;
    const h = map.clientHeight || map.offsetHeight;
    this._canvas.width = w;
    this._canvas.height = h;
    this.buildSpatialIndex();
  },

  buildSpatialIndex() {
    // Quadtree para paredes
    function QTNode(x, y, w, h, depth = 0) {
      this.x = x;
      this.y = y;
      this.w = w;
      this.h = h;
      this.depth = depth;
      this.segs = [];
      this.children = null;
    }
    QTNode.prototype.insert = function (seg) {
      if (this.children) {
        const boxes = this.children;
        for (let i = 0; i < 4; i++) boxes[i].insert(seg);
        return;
      }
      this.segs.push(seg);
      if (this.segs.length > 8 && this.depth < 8) {
        this.subdivide();
        const old = this.segs;
        this.segs = [];
        for (let i = 0; i < old.length; i++) this.insert(old[i]);
      }
    };
    QTNode.prototype.subdivide = function () {
      const hw = this.w / 2,
        hh = this.h / 2,
        d = this.depth + 1;
      this.children = [
        new QTNode(this.x, this.y, hw, hh, d),
        new QTNode(this.x + hw, this.y, hw, hh, d),
        new QTNode(this.x, this.y + hh, hw, hh, d),
        new QTNode(this.x + hw, this.y + hh, hw, hh, d),
      ];
    };

    const c = this._canvas;
    if (!c) return;
    const root = new QTNode(0, 0, c.width, c.height, 0);
    const segs = Lighting.Model.walls.map((w) => ({
      x1: w.p1.x,
      y1: w.p1.y,
      x2: w.p2.x,
      y2: w.p2.y,
      id: w.id,
    }));
    for (let i = 0; i < segs.length; i++) root.insert(segs[i]);
    this._spatialIndex = { root };
  },

  draw() {
    if (!this._canvas) this.init();
    const c = this._canvas;
    if (!c) return;
    const ctx = this._ctx;
    const W = c.width,
      H = c.height;
    ctx.clearRect(0, 0, W, H);

    // fundo escuro base
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0, 0, W, H);

    // desenhar objetos
    Lighting.Model.objects.forEach((obj) => {
      if (!obj.visible) return;

      ctx.save();

      if (obj.mode === 'dark') {
        // áreas escuras são mantidas
        // nada a fazer - já começamos com background escuro
      } else if (obj.mode === 'light') {
        // áreas iluminadas: remover escuridão
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = 'rgba(0,0,0,1)';
        this._drawShape(ctx, obj);
        ctx.fill();

        // penumbra: cinza
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(100,100,100,0.9)';
        const penRadius = (obj.penumbra || 12) * (Lighting.Model.gridSize || 50);
        if (obj.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(obj.x, obj.y, obj.radius + penRadius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();
    });

    // desenhar paredes
    ctx.save();
    ctx.strokeStyle = 'rgba(200,200,200,0.3)';
    ctx.lineWidth = 2;
    Lighting.Model.walls.forEach((wall) => {
      if (!wall.visible) return;
      ctx.beginPath();
      ctx.moveTo(wall.p1.x, wall.p1.y);
      ctx.lineTo(wall.p2.x, wall.p2.y);
      ctx.stroke();
    });
    ctx.restore();

    // UI overlay: seleção, handles, preview
    this._drawUI();
  },

  _drawShape(ctx, obj) {
    if (obj.shape === 'rect') {
      ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
    } else if (obj.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
      ctx.fill();
    } else if (obj.shape === 'polygon' && obj.points) {
      ctx.beginPath();
      if (obj.points.length > 0) {
        ctx.moveTo(obj.points[0].x, obj.points[0].y);
        for (let i = 1; i < obj.points.length; i++) {
          ctx.lineTo(obj.points[i].x, obj.points[i].y);
        }
        ctx.closePath();
      }
      ctx.fill();
    }
  },

  _drawUI() {
    const ctx = this._ctx;
    const selectedId = Lighting.Input.selectedObjectId;
    const activeTool = Lighting.Input.activeTool;

    // desenhar objeto selecionado
    if (selectedId) {
      const obj = Lighting.Model.getObject(selectedId);
      if (obj) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,220,100,0.95)';
        ctx.lineWidth = 2;
        this._drawShape(ctx, obj);
        ctx.stroke();

        // draw handles
        if (!obj.locked) {
          this._drawHandles(ctx, obj);
        }

        // mostra o raio externo da penumbra para lights
        if (obj.mode === 'light' && obj.shape === 'circle') {
          ctx.strokeStyle = 'rgba(255,200,100,0.5)';
          ctx.setLineDash([4, 4]);
          const penRadius = (obj.penumbra || 12) * (Lighting.Model.gridSize || 50);
          ctx.beginPath();
          ctx.arc(obj.x, obj.y, obj.radius + penRadius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.restore();
      }
    }

    // preview de tool em progresso
    if (activeTool === 'rect' && Lighting.Input.toolState.start && Lighting.Input.toolState.current) {
      const s = Lighting.Input.toolState;
      ctx.save();
      ctx.strokeStyle = 'rgba(80,200,100,0.8)';
      ctx.fillStyle = 'rgba(80,200,100,0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      const x1 = Math.min(s.start.x, s.current.x);
      const y1 = Math.min(s.start.y, s.current.y);
      const w = Math.abs(s.current.x - s.start.x);
      const h = Math.abs(s.current.y - s.start.y);
      ctx.fillRect(x1, y1, w, h);
      ctx.strokeRect(x1, y1, w, h);
      ctx.restore();
    }

    if (activeTool === 'circle' && Lighting.Input.toolState.start && Lighting.Input.toolState.current) {
      const s = Lighting.Input.toolState;
      const dx = s.current.x - s.start.x;
      const dy = s.current.y - s.start.y;
      const r = Math.sqrt(dx * dx + dy * dy);
      ctx.save();
      ctx.strokeStyle = 'rgba(80,200,100,0.8)';
      ctx.fillStyle = 'rgba(80,200,100,0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(s.start.x, s.start.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    if (activeTool === 'polygon' && Lighting.Input.toolState.points) {
      const pts = Lighting.Input.toolState.points;
      ctx.save();
      ctx.strokeStyle = 'rgba(80,200,100,0.8)';
      ctx.fillStyle = 'rgba(80,200,100,0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      if (pts.length > 0) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i].x, pts[i].y);
        }
        if (Lighting.Input.toolState.current) {
          ctx.lineTo(Lighting.Input.toolState.current.x, Lighting.Input.toolState.current.y);
        }
        ctx.stroke();
        // pontos
        pts.forEach((p) => {
          ctx.fillStyle = 'rgba(80,200,100,0.9)';
          ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
        });
      }
      ctx.restore();
    }

    if (activeTool === 'wall' && Lighting.Input.toolState.p1) {
      const p1 = Lighting.Input.toolState.p1;
      const current = Lighting.Input.toolState.current;
      ctx.save();
      ctx.strokeStyle = 'rgba(200,100,100,0.8)';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      if (current) {
        ctx.lineTo(current.x, current.y);
      }
      ctx.stroke();
      ctx.restore();
    }
  },

  _drawHandles(ctx, obj) {
    const handleSize = 8;
    if (obj.shape === 'rect') {
      const corners = [
        [obj.x, obj.y],
        [obj.x + obj.width, obj.y],
        [obj.x, obj.y + obj.height],
        [obj.x + obj.width, obj.y + obj.height],
      ];
      corners.forEach((corner) => {
        ctx.fillStyle = 'rgba(255,220,100,0.9)';
        ctx.fillRect(corner[0] - handleSize / 2, corner[1] - handleSize / 2, handleSize, handleSize);
      });
    } else if (obj.shape === 'circle') {
      ctx.fillStyle = 'rgba(255,220,100,0.9)';
      ctx.fillRect(obj.x - handleSize / 2, obj.y - handleSize / 2, handleSize, handleSize);
      ctx.fillRect(obj.x + obj.radius - handleSize / 2, obj.y - handleSize / 2, handleSize, handleSize);
    }
  },
};

setTimeout(() => {
  Lighting.Render.init();
}, 300);
</script>
