<script>
// lighting-render.html — Renderização do sistema de iluminação
// v3.1 — raycasting integrado como máscara de clipping para objetos mode='light'

console.log('lighting-render carregado');

window.Lighting = window.Lighting || {};

Lighting.Render = {

  _canvas: null,
  _ctx: null,
  _spatialIndex: null,

  // Cache de segmentos de parede — reconstruído por draw(), reutilizado por todos os objetos
  _cachedWallSegments: null,

  init() {
    if (this._canvas) return;

    const map = document.getElementById('map-container');
    if (!map) {
      setTimeout(() => this.init(), 200);
      return;
    }

    const c = document.createElement('canvas');
    c.id = 'lighting-overlay-canvas';
    c.style.cssText =
      'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;';
    map.appendChild(c);
    this._canvas = c;
    this._ctx = c.getContext('2d');
    this._sync();

    window.addEventListener('resize', () => this._sync());
  },

  _sync() {
    const map = document.getElementById('map-container');
    if (!map || !this._canvas) return;
    const w = map.clientWidth || map.offsetWidth;
    const h = map.clientHeight || map.offsetHeight;
    this._canvas.width = w;
    this._canvas.height = h;
    this.buildSpatialIndex();
  },

  buildSpatialIndex() {
    // Quadtree para paredes (mantido do original para compatibilidade)
    function QTNode(x, y, w, h, depth) {
      depth = depth || 0;
      this.x = x; this.y = y; this.w = w; this.h = h; this.depth = depth;
      this.segs = []; this.children = null;
    }
    QTNode.prototype.insert = function (seg) {
      if (this.children) {
        for (let i = 0; i < 4; i++) this.children[i].insert(seg);
        return;
      }
      this.segs.push(seg);
      if (this.segs.length > 8 && this.depth < 8) {
        this.subdivide();
        const old = this.segs;
        this.segs = [];
        for (let i = 0; i < old.length; i++) this.insert(old[i]);
      }
    };
    QTNode.prototype.subdivide = function () {
      const hw = this.w / 2, hh = this.h / 2, d = this.depth + 1;
      this.children = [
        new QTNode(this.x,      this.y,      hw, hh, d),
        new QTNode(this.x + hw, this.y,      hw, hh, d),
        new QTNode(this.x,      this.y + hh, hw, hh, d),
        new QTNode(this.x + hw, this.y + hh, hw, hh, d),
      ];
    };

    const c = this._canvas;
    if (!c) return;
    const root = new QTNode(0, 0, c.width, c.height, 0);
    const segs = Lighting.Model.walls.map((w) => ({
      x1: w.p1.x, y1: w.p1.y, x2: w.p2.x, y2: w.p2.y, id: w.id,
    }));
    for (let i = 0; i < segs.length; i++) root.insert(segs[i]);
    this._spatialIndex = { root };
  },

  draw() {
    if (!this._canvas) this.init();
    const c = this._canvas;
    if (!c) return;

    const ctx = this._ctx;
    const W = c.width, H = c.height;

    ctx.clearRect(0, 0, W, H);

    // ── Passo 1: fundo escuro base ────────────────────────────────────────────
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0, 0, W, H);

    // ── Passo 2: pré-calcular segmentos de parede UMA VEZ por frame ──────────
    // Apenas paredes visíveis são usadas como obstáculos de luz.
    const hasWalls = Lighting.Model.walls && Lighting.Model.walls.length > 0;
    this._cachedWallSegments = hasWalls
      ? Lighting.Raycast._getWallSegments(Lighting.Model.walls)
      : [];

    // ── Passo 3: desenhar objetos ─────────────────────────────────────────────
    Lighting.Model.objects.forEach((obj) => {
      if (!obj.visible) return;
      ctx.save();

      if (obj.mode === 'dark') {
        // Áreas escuras: mantidas (já começamos com background escuro)
        // Nada a fazer aqui.

      } else if (obj.mode === 'light') {
        // ── Luz com raycasting como máscara ──────────────────────────────────
        //
        // Fluxo:
        //   1. Calcular polígono de visibilidade (a partir da origem da luz)
        //   2. Aplicar como clipping path
        //   3. Dentro do clip, desenhar a luz exatamente como antes:
        //      a. destination-out para revelar o mapa
        //      b. penumbra (source-over cinza)
        //
        // Se não há paredes, o polígono de visibilidade cobre tudo — comportamento
        // idêntico ao anterior.

        const cx = obj.x;
        const cy = obj.y;
        const lightRadius = obj.radius || (obj.luminosity || 6) * (Lighting.Model.gridSize || 50);
        const penRadius   = (obj.penumbra || 12) * (Lighting.Model.gridSize || 50);
        const totalRadius = lightRadius + penRadius;

        // Calcular polígono de visibilidade apenas se houver paredes
        let poly = null;
        if (this._cachedWallSegments.length > 0) {
          poly = Lighting.Raycast.getVisibilityPolygon(cx, cy, Lighting.Model.walls, totalRadius);
        }

        // ── a. Revelar área de luz (destination-out) ─────────────────────────
        ctx.save();

        // Aplicar clipping do polígono de visibilidade
        if (poly && poly.length >= 3) {
          Lighting.Raycast.buildClipPath(ctx, poly);
          ctx.clip();
        }

        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = 'rgba(0,0,0,1)';
        this._drawShape(ctx, obj);
        ctx.fill();

        ctx.restore();

        // ── b. Penumbra (source-over cinza) ──────────────────────────────────
        if (obj.shape === 'circle') {
          ctx.save();

          // Aplicar clipping do polígono também na penumbra
          if (poly && poly.length >= 3) {
            Lighting.Raycast.buildClipPath(ctx, poly);
            ctx.clip();
          }

          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = 'rgba(100,100,100,0.9)';
          ctx.beginPath();
          ctx.arc(cx, cy, lightRadius + penRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      ctx.restore();
    });

    // ── Passo 4: desenhar paredes (visual de referência) ─────────────────────
    ctx.save();
    ctx.strokeStyle = 'rgba(200,200,200,0.3)';
    ctx.lineWidth = 2;
    Lighting.Model.walls.forEach((wall) => {
      if (!wall.visible) return;
      ctx.beginPath();
      ctx.moveTo(wall.p1.x, wall.p1.y);
      ctx.lineTo(wall.p2.x, wall.p2.y);
      ctx.stroke();
    });
    ctx.restore();

    // ── Passo 5: UI overlay (seleção, handles, preview de ferramentas) ────────
    this._drawUI();
  },

  // ── Helpers ──────────────────────────────────────────────────────────────────

  _drawShape(ctx, obj) {
    if (obj.shape === 'rect') {
      ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
    } else if (obj.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
      ctx.fill();
    } else if (obj.shape === 'polygon' && obj.points) {
      ctx.beginPath();
      if (obj.points.length > 0) {
        ctx.moveTo(obj.points[0].x, obj.points[0].y);
        for (let i = 1; i < obj.points.length; i++) {
          ctx.lineTo(obj.points[i].x, obj.points[i].y);
        }
        ctx.closePath();
      }
      ctx.fill();
    }
  },

  _drawUI() {
    const ctx = this._ctx;
    const selectedId  = Lighting.Input.selectedObjectId;
    const activeTool  = Lighting.Input.activeTool;

    // ── Objeto selecionado ────────────────────────────────────────────────────
    if (selectedId) {
      const obj = Lighting.Model.getObject(selectedId);
      if (obj) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,220,100,0.95)';
        ctx.lineWidth = 2;
        this._drawShape(ctx, obj);
        ctx.stroke();

        if (!obj.locked) {
          this._drawHandles(ctx, obj);
        }

        // Círculo tracejado da penumbra para luzes circulares
        if (obj.mode === 'light' && obj.shape === 'circle') {
          ctx.strokeStyle = 'rgba(255,200,100,0.5)';
          ctx.setLineDash([4, 4]);
          const penRadius = (obj.penumbra || 12) * (Lighting.Model.gridSize || 50);
          ctx.beginPath();
          ctx.arc(obj.x, obj.y, obj.radius + penRadius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.restore();
      }
    }

    // ── Preview ferramenta rect ───────────────────────────────────────────────
    if (
      activeTool === 'rect' &&
      Lighting.Input.toolState.start &&
      Lighting.Input.toolState.current
    ) {
      const s = Lighting.Input.toolState;
      const x1 = Math.min(s.start.x, s.current.x);
      const y1 = Math.min(s.start.y, s.current.y);
      const w  = Math.abs(s.current.x - s.start.x);
      const h  = Math.abs(s.current.y - s.start.y);
      ctx.save();
      ctx.strokeStyle = 'rgba(80,200,100,0.8)';
      ctx.fillStyle   = 'rgba(80,200,100,0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.fillRect(x1, y1, w, h);
      ctx.strokeRect(x1, y1, w, h);
      ctx.restore();
    }

    // ── Preview ferramenta circle ─────────────────────────────────────────────
    if (
      activeTool === 'circle' &&
      Lighting.Input.toolState.start &&
      Lighting.Input.toolState.current
    ) {
      const s  = Lighting.Input.toolState;
      const dx = s.current.x - s.start.x;
      const dy = s.current.y - s.start.y;
      const r  = Math.sqrt(dx * dx + dy * dy);
      ctx.save();
      ctx.strokeStyle = 'rgba(80,200,100,0.8)';
      ctx.fillStyle   = 'rgba(80,200,100,0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(s.start.x, s.start.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // ── Preview ferramenta polygon ────────────────────────────────────────────
    if (activeTool === 'polygon' && Lighting.Input.toolState.points) {
      const pts = Lighting.Input.toolState.points;
      ctx.save();
      ctx.strokeStyle = 'rgba(80,200,100,0.8)';
      ctx.fillStyle   = 'rgba(80,200,100,0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      if (pts.length > 0) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        if (Lighting.Input.toolState.current) {
          ctx.lineTo(Lighting.Input.toolState.current.x, Lighting.Input.toolState.current.y);
        }
        ctx.stroke();
        pts.forEach((p) => {
          ctx.fillStyle = 'rgba(80,200,100,0.9)';
          ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
        });
      }
      ctx.restore();
    }

    // ── Preview ferramenta wall ───────────────────────────────────────────────
    if (activeTool === 'wall' && Lighting.Input.toolState.p1) {
      const p1      = Lighting.Input.toolState.p1;
      const current = Lighting.Input.toolState.current;
      ctx.save();
      ctx.strokeStyle = 'rgba(200,100,100,0.8)';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      if (current) ctx.lineTo(current.x, current.y);
      ctx.stroke();
      ctx.restore();
    }
  },

  _drawHandles(ctx, obj) {
    const s = 8;
    if (obj.shape === 'rect') {
      const corners = [
        [obj.x,             obj.y],
        [obj.x + obj.width, obj.y],
        [obj.x,             obj.y + obj.height],
        [obj.x + obj.width, obj.y + obj.height],
      ];
      corners.forEach((c) => {
        ctx.fillStyle = 'rgba(255,220,100,0.9)';
        ctx.fillRect(c[0] - s / 2, c[1] - s / 2, s, s);
      });
    } else if (obj.shape === 'circle') {
      ctx.fillStyle = 'rgba(255,220,100,0.9)';
      ctx.fillRect(obj.x - s / 2,              obj.y - s / 2, s, s);
      ctx.fillRect(obj.x + obj.radius - s / 2, obj.y - s / 2, s, s);
    }
  },
};

setTimeout(() => {
  Lighting.Render.init();
}, 300);
</script>
