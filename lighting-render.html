<script>
// lighting-render.html
console.log('lighting-render carregado');

window.Lighting = window.Lighting || {};

Lighting.Render = {
  _canvas: null,
  _ctx:    null,
  _off:    null,
  _offCtx: null,

  init() {
    if (this._canvas) return;
    const map = document.getElementById('map-container');
    if (!map) { setTimeout(() => this.init(), 200); return; }

    let c = document.getElementById('lighting-overlay-canvas');
    if (!c) {
      c = document.createElement('canvas');
      c.id = 'lighting-overlay-canvas';
      c.style.cssText =
        'position:absolute;top:0;left:0;width:100%;height:100%;' +
        'pointer-events:none;z-index:999;';
      map.appendChild(c);
    }
    this._canvas = c;
    this._ctx    = c.getContext('2d');
    this._off    = document.createElement('canvas');
    this._offCtx = this._off.getContext('2d');

    this._sync();
    const ro = new ResizeObserver(() => this._sync());
    ro.observe(map);
    window.addEventListener('resize', () => this._sync());
  },

  _sync() {
    const map = document.getElementById('map-container');
    if (!map || !this._canvas) return;
    const w = map.offsetWidth  || map.clientWidth  || 800;
    const h = map.offsetHeight || map.clientHeight || 600;
    if (this._canvas.width !== w || this._canvas.height !== h) {
      this._canvas.width = w; this._canvas.height = h;
      this._off.width    = w; this._off.height    = h;
    }
    this.draw();
  },

  buildSpatialIndex() { /* compatibilidade */ },

  draw() {
    if (!this._canvas) { this.init(); return; }

    const ctx = this._ctx;
    const W   = this._canvas.width;
    const H   = this._canvas.height;

    ctx.clearRect(0, 0, W, H);
    if (!Lighting.Model.enabled) return;

    if (Lighting.Model.masterReveal) {
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(0, 0, W, H);
      this._drawWalls(ctx);
      this._drawUI();
      return;
    }

    const darkObjs  = Lighting.Model.objects.filter(o => o.visible && o.mode === 'dark');
    const lightObjs = Lighting.Model.objects.filter(o => o.visible && o.mode === 'light');

    // Se não há objetos de escuridão: mapa totalmente visível
    if (darkObjs.length === 0) {
      this._drawWalls(ctx);
      this._drawUI();
      return;
    }

    // ── Pipeline offscreen ──────────────────────────────────────
    // Garante sombra 100% opaca e luz recortando corretamente
    const off    = this._off;
    const offCtx = this._offCtx;

    offCtx.clearRect(0, 0, W, H);

    // ── PASSO 1: Pintar APENAS os objetos de sombra ─────────────
    // NÃO há fillRect global — só os shapes dos objetos dark.
    // O objeto _totalCover (99999×99999) já cobre tudo sozinho quando ativo.
    offCtx.globalCompositeOperation = 'source-over';
    offCtx.fillStyle = 'rgba(0,0,0,1)';
    darkObjs.forEach(obj => this._fillDarkShape(offCtx, obj));

    // ── PASSO 2: Recortar luz dos objetos de luz ────────────────
    // Cada objeto de luz "perfura" a sombra com destination-out.
    // Círculos: penumbra suave + luz plena
    // Outros shapes (rect, polygon): só luz plena

    const gs           = window.VTTGrid?.size || Lighting.Model.gridSize || 50;
    const penumOpacity = Lighting.Model.penumbraOpacity !== undefined
                         ? Lighting.Model.penumbraOpacity
                         : 0.9; // 0 = transparente (luz), 1 = opaco (sombra)

    lightObjs.forEach(obj => {
      if (obj.shape === 'circle') {
        const lightR = ((obj.lightDiameter   || 4)  / 2) * gs;
        const penumR = ((obj.penumbraDiameter || 8)  / 2) * gs;
        const cx     = obj.x;
        const cy     = obj.y;

        // 2a. Penumbra: gradiente do raio de luz até o raio de penumbra
        if (penumR > lightR) {
          offCtx.save();
          offCtx.globalCompositeOperation = 'destination-out';
          // O gradiente vai de 1 (totalmente recortado) até (1 - penumOpacity) na borda
          // penumOpacity=1 → borda opaca (sombra total) → stopFinal=0
          // penumOpacity=0 → borda transparente (luz total) → stopFinal=1
          const stopFinal = 1 - penumOpacity;
          const grad = offCtx.createRadialGradient(cx, cy, lightR, cx, cy, penumR);
          grad.addColorStop(0,   `rgba(0,0,0,1)`);
          grad.addColorStop(0.5, `rgba(0,0,0,${(1 - penumOpacity * 0.5).toFixed(3)})`);
          grad.addColorStop(1,   `rgba(0,0,0,${stopFinal.toFixed(3)})`);
          offCtx.fillStyle = grad;
          offCtx.beginPath();
          offCtx.arc(cx, cy, penumR, 0, Math.PI * 2);
          offCtx.fill();
          offCtx.restore();
        }

        // 2b. Luz plena: recorte total dentro de lightR
        offCtx.save();
        offCtx.globalCompositeOperation = 'destination-out';
        offCtx.fillStyle = 'rgba(0,0,0,1)';
        offCtx.beginPath();
        offCtx.arc(cx, cy, lightR, 0, Math.PI * 2);
        offCtx.fill();
        offCtx.restore();

      } else {
        // Rect ou polygon de luz: recorte total da forma
        offCtx.save();
        offCtx.globalCompositeOperation = 'destination-out';
        offCtx.fillStyle = 'rgba(0,0,0,1)';
        this._fillLightShape(offCtx, obj);
        offCtx.restore();
      }
    });

    // ── PASSO 3: Copia offscreen → canvas visível ───────────────
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(off, 0, 0);

    // ── PASSO 4: Paredes e UI ───────────────────────────────────
    this._drawWalls(ctx);
    this._drawUI();
  },

  // Preenche shapes de ESCURIDÃO (dark objects)
  // Inclui rotação para rects
  _fillDarkShape(ctx, obj) {
    ctx.save();
    if (obj.shape === 'rect' && obj.rotation) {
      const cx = obj.x + (obj.width  || 100) / 2;
      const cy = obj.y + (obj.height || 100) / 2;
      ctx.translate(cx, cy);
      ctx.rotate((obj.rotation || 0) * Math.PI / 180);
      ctx.translate(-cx, -cy);
    }
     ctx.beginPath();
  if (obj.shape === 'rect') {
    ctx.rect(obj.x, obj.y, obj.width || 100, obj.height || 100);
  } else if (obj.shape === 'circle') {
    const gs = window.VTTGrid?.size || Lighting.Model.gridSize || 50;
    const r  = ((obj.penumbraDiameter || obj.lightDiameter || 4) / 2) * gs;
    ctx.arc(obj.x, obj.y, r, 0, Math.PI * 2);
  } else if (obj.shape === 'polygon' && obj.points && obj.points.length >= 3) {
    ctx.moveTo(obj.points[0].x, obj.points[0].y);
    for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
    ctx.closePath();
  }
  ctx.fill();
    ctx.restore();
  },

  // Preenche shapes de LUZ não-circulares (rect, polygon)
  // Separado de _fillDarkShape para evitar confusão de branches
  _fillLightShape(ctx, obj) {
    ctx.save();
    if (obj.shape === 'rect' && obj.rotation) {
      const cx = obj.x + (obj.width  || 100) / 2;
      const cy = obj.y + (obj.height || 100) / 2;
      ctx.translate(cx, cy);
      ctx.rotate((obj.rotation || 0) * Math.PI / 180);
      ctx.translate(-cx, -cy);
    }
    ctx.beginPath();
    if (obj.shape === 'rect') {
      ctx.rect(obj.x, obj.y, obj.width || 100, obj.height || 100);
    } else if (obj.shape === 'polygon' && obj.points && obj.points.length >= 3) {
      ctx.moveTo(obj.points[0].x, obj.points[0].y);
      for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
  },

  // Stroke de um objeto para UI (seleção)
  _strokeShape(ctx, obj) {
    ctx.save();
    if (obj.shape === 'rect' && obj.rotation) {
      const cx = obj.x + (obj.width  || 100) / 2;
      const cy = obj.y + (obj.height || 100) / 2;
      ctx.translate(cx, cy);
      ctx.rotate((obj.rotation || 0) * Math.PI / 180);
      ctx.translate(-cx, -cy);
    }
    ctx.beginPath();
    const gs = window.VTTGrid?.size || 50;
    if (obj.shape === 'rect') {
      ctx.rect(obj.x, obj.y, obj.width || 100, obj.height || 100);
    } else if (obj.shape === 'circle') {
      const r = ((obj.lightDiameter || 4) / 2) * gs;
      ctx.arc(obj.x, obj.y, r, 0, Math.PI * 2);
    } else if (obj.shape === 'polygon' && obj.points && obj.points.length >= 3) {
      ctx.moveTo(obj.points[0].x, obj.points[0].y);
      for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
      ctx.closePath();
    }
    ctx.stroke();
    ctx.restore();
  },

_drawWalls(ctx) {
  if (!Lighting.Model.walls || !Lighting.Model.walls.length) return;
  if (!Lighting.Model.masterReveal) return;  // invisíveis sem masterReveal
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = 'rgba(255,80,80,0.85)';
  ctx.lineWidth   = 2;
  // linha SÓLIDA — sem setLineDash
  Lighting.Model.walls.forEach(w => {
    if (!w.visible || !w.p1 || !w.p2) return;
    ctx.beginPath();
    ctx.moveTo(w.p1.x, w.p1.y);
    ctx.lineTo(w.p2.x, w.p2.y);
    ctx.stroke();
    // vértices
    [w.p1, w.p2].forEach(p => {
      ctx.fillStyle = 'rgba(255,80,80,0.9)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fill();
    });
  });
  ctx.restore();
},

  // ── Alças de resize ─────────────────────────────────────────

  getHandles(obj) {
    const gs = window.VTTGrid?.size || 50;
    if (obj.shape === 'rect') {
      const { x, y } = obj;
      const w = obj.width  || 100;
      const h = obj.height || 100;
      // Rotaciona as alças junto com o rect
      const rot = (obj.rotation || 0) * Math.PI / 180;
      const cx  = x + w/2, cy = y + h/2;
      const rot2d = (px, py) => {
        const dx = px - cx, dy = py - cy;
        return {
          x: cx + dx * Math.cos(rot) - dy * Math.sin(rot),
          y: cy + dx * Math.sin(rot) + dy * Math.cos(rot),
        };
      };
      return [
        { ...rot2d(x,   y  ), cursor: 'nw-resize', handleId: 'tl' },
        { ...rot2d(x+w, y  ), cursor: 'ne-resize', handleId: 'tr' },
        { ...rot2d(x,   y+h), cursor: 'sw-resize', handleId: 'bl' },
        { ...rot2d(x+w, y+h), cursor: 'se-resize', handleId: 'br' },
        { ...rot2d(x+w/2, y  ), cursor: 'n-resize',  handleId: 'tm' },
        { ...rot2d(x+w/2, y+h), cursor: 's-resize',  handleId: 'bm' },
        { ...rot2d(x,     y+h/2), cursor: 'w-resize', handleId: 'ml' },
        { ...rot2d(x+w,   y+h/2), cursor: 'e-resize', handleId: 'mr' },
      ];
    }
    if (obj.shape === 'circle') {
      const lightR = ((obj.lightDiameter   || 4)  / 2) * gs;
      const penumR = ((obj.penumbraDiameter || 8)  / 2) * gs;
      return [
        { x: obj.x + lightR, y: obj.y, cursor: 'ew-resize', handleId: 'light-r'  },
        { x: obj.x,          y: obj.y, cursor: 'move',       handleId: 'center'   },
        { x: obj.x + penumR, y: obj.y, cursor: 'ew-resize', handleId: 'penum-r'  },
      ];
    }
    return [];
  },

  getRotateHandlePos(obj) {
    if (obj.shape !== 'rect') return null;
    const rot = (obj.rotation || 0) * Math.PI / 180;
    const rcx = obj.x + (obj.width  || 100) / 2;
    const rcy = obj.y + (obj.height || 100) / 2;
    // Alça 22px acima do centro superior, rotacionada
    const dx = 0, dy = -(obj.height || 100) / 2 - 22;
    return {
      x: rcx + dx * Math.cos(rot) - dy * Math.sin(rot),
      y: rcy + dx * Math.sin(rot) + dy * Math.cos(rot),
    };
  },

  _drawHandles(ctx, obj) {
    const gs = window.VTTGrid?.size || 50;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    this.getHandles(obj).forEach(h => {
      if (h.handleId === 'light-r')  ctx.fillStyle = 'rgba(255,230,80,0.95)';
      else if (h.handleId === 'penum-r') ctx.fillStyle = 'rgba(255,150,50,0.85)';
      else if (h.handleId === 'center')  ctx.fillStyle = 'rgba(100,200,255,0.85)';
      else                               ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.arc(h.x, h.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });

    // Para círculos: anéis de referência de luz e penumbra
    if (obj.shape === 'circle') {
      const lightR = ((obj.lightDiameter   || 4)  / 2) * gs;
      const penumR = ((obj.penumbraDiameter || 8)  / 2) * gs;
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,230,80,0.6)';
      ctx.beginPath(); ctx.arc(obj.x, obj.y, lightR, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,150,50,0.4)';
      ctx.beginPath(); ctx.arc(obj.x, obj.y, penumR, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  },

  _drawRotateHandle(ctx, obj) {
    const rh = this.getRotateHandlePos(obj);
    if (!rh) return;
    const rcx = obj.x + (obj.width  || 100) / 2;
    const rcy = obj.y + (obj.height || 100) / 2;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle   = 'rgba(200,100,255,0.9)';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth   = 1;
    ctx.beginPath(); ctx.arc(rh.x, rh.y, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,100,255,0.5)';
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(rcx, obj.y); ctx.lineTo(rh.x, rh.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  },

  _drawUI() {
    if (!window.Lighting || !Lighting.Input) return;
    const ctx        = this._ctx;
    const selectedId = Lighting.Input.selectedObjectId;
    const activeTool = Lighting.Input.activeTool;
    const toolState  = Lighting.Input.toolState || {};

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    if (selectedId) {
      const obj = Lighting.Model.getObject(selectedId);
      if (obj) {
        ctx.strokeStyle = 'rgba(255,220,60,0.95)';
        ctx.lineWidth   = 2;
        ctx.setLineDash([4, 3]);
        this._strokeShape(ctx, obj);
        ctx.setLineDash([]);
        if (!obj.locked) {
          this._drawHandles(ctx, obj);
          if (obj.shape === 'rect') this._drawRotateHandle(ctx, obj);
        }
      }
    }

    // Previews
    ctx.strokeStyle = 'rgba(80,220,120,0.9)';
    ctx.fillStyle   = 'rgba(80,220,120,0.15)';
    ctx.lineWidth   = 2;
    ctx.setLineDash([4, 4]);

    if (activeTool === 'rect' && toolState.start && toolState.current) {
      const x1 = Math.min(toolState.start.x, toolState.current.x);
      const y1 = Math.min(toolState.start.y, toolState.current.y);
      const w  = Math.abs(toolState.current.x - toolState.start.x);
      const h  = Math.abs(toolState.current.y - toolState.start.y);
      ctx.fillRect(x1, y1, w, h);
      ctx.strokeRect(x1, y1, w, h);
    }

    if (activeTool === 'circle' && toolState.start && toolState.current) {
      const dx = toolState.current.x - toolState.start.x;
      const dy = toolState.current.y - toolState.start.y;
      const r  = Math.sqrt(dx * dx + dy * dy);
      ctx.beginPath();
      ctx.arc(toolState.start.x, toolState.start.y, r, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }

    if (activeTool === 'polygon' && Lighting.Input.toolState.points) {
  const pts = Lighting.Input.toolState.points;
  ctx.save();
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  if (pts.length > 0) {
    ctx.strokeStyle = 'rgba(80,200,100,0.8)';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    if (Lighting.Input.toolState.current) {
      ctx.lineTo(Lighting.Input.toolState.current.x, Lighting.Input.toolState.current.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Vértices: primeiro em laranja (snap target), demais em verde
    pts.forEach((p, i) => {
      const snapRadius = 12;
      const cur = Lighting.Input.toolState.current;
      const nearFirst = i === 0 && cur &&
        Math.hypot(cur.x - pts[0].x, cur.y - pts[0].y) < snapRadius;

      ctx.beginPath();
      ctx.arc(p.x, p.y, i === 0 ? 7 : 5, 0, Math.PI * 2);
      // Primeiro vértice: laranja se cursor perto (snap hint), senão amarelo
      if (i === 0) {
        ctx.fillStyle = nearFirst ? 'rgba(255,140,0,1)' : 'rgba(255,200,50,0.95)';
        // anel extra para indicar que é o ponto de fechamento
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(80,200,100,0.9)';
        ctx.fill();
      }
    });
  }
  ctx.restore();
}

    if (activeTool === 'wall' && toolState.p1) {
      ctx.strokeStyle = 'rgba(255,100,100,0.9)';
      ctx.lineWidth   = 3;
      ctx.beginPath();
      ctx.moveTo(toolState.p1.x, toolState.p1.y);
      if (toolState.current) ctx.lineTo(toolState.current.x, toolState.current.y);
      ctx.stroke();
    }

    ctx.setLineDash([]);
    ctx.restore();
  },
};

setTimeout(() => { Lighting.Render.init(); }, 300);
</script>
