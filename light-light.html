<script>
// ============================================================
// MINARDI VTT — LightPlugin
// light-light.html — Sistema de Luzes (criação e seleção)
//
// Responsável por: criação, seleção, movimento e deleção
// de objetos de luz (retângulo e círculo).
// ============================================================

console.log("light-light carregado");

window.LightPlugin = window.LightPlugin || {};

LightPlugin.Light = {

  // Objeto selecionado atualmente
  _selected:    null,
  // Estado de drag de objeto existente
  _dragging:    false,
  _dragOffX:    0,
  _dragOffY:    0,
  // Estado de desenho de novo objeto
  _drawing:     false,
  _drawStart:   null,

  init() {
    console.log("LightPlugin.Light INIT");
    this._bindEvents();
  },

  _bindEvents() {
    const map = document.getElementById("map-container");
    if (!map) return;

    map.addEventListener("mousedown", e => {
      if (!this._isActive()) return;
      const fn  = LightPlugin.Control.state.fn;
      const pos = this._pos(e);

      if (fn === "draw") {
        this._startDraw(pos, e);
      } else if (fn === "select") {
        this._startSelect(pos, e);
      } else if (fn === "erase") {
        this._eraseAt(pos);
      }
      e.stopPropagation();
    });

    map.addEventListener("mousemove", e => {
      if (!this._isActive()) return;
      const pos = this._pos(e);
      if (this._drawing) this._updateDraw(pos);
      if (this._dragging) this._updateDrag(pos);
    });

    map.addEventListener("mouseup", e => {
      if (!this._isActive()) return;
      const pos = this._pos(e);
      if (this._drawing)  this._endDraw(pos);
      if (this._dragging) this._endDrag();
    });
  },

  _isActive() {
    return VTTMode.is("lighting") &&
           LightPlugin.Control.state.cat === "light" &&
           LightPlugin.Model.settings.enabled;
  },

  // ---- DESENHO ----

  _startDraw(pos) {
    this._drawing   = true;
    this._drawStart = pos;
    this._selected  = null;
  },

  _updateDraw(pos) {
    LightPlugin.Canvas.drawLightPreview(this._drawStart, pos,
      LightPlugin.Control.state.fmt);
  },

  _endDraw(pos) {
    this._drawing = false;
    LightPlugin.Canvas.clearWallPreview();

    const fmt = LightPlugin.Control.state.fmt;
    const s   = this._drawStart;
    let obj;

    if (fmt === "rect") {
      const x = Math.min(s.x, pos.x), y = Math.min(s.y, pos.y);
      const w = Math.abs(pos.x - s.x), h = Math.abs(pos.y - s.y);
      if (w < 5 || h < 5) return;
      obj = LightPlugin.Model.addLight({ type:"rect", x, y, w, h });
    } else if (fmt === "circle") {
      const size = window.VTTGrid?.size || 50;
      const r = Math.hypot(pos.x - s.x, pos.y - s.y);
      if (r < 5) return;
      const dimDiameterSq = Math.ceil((2 * r) / size);
      const lightDiameterSq = Math.max(1, Math.ceil(dimDiameterSq / 3));
      obj = LightPlugin.Model.addLight({
        type: "circle",
        x: s.x,
        y: s.y,
        r,
        dimRadius: dimDiameterSq,
        lightRadius: lightDiameterSq
      });
    }

    this._selected = obj ? obj.id : null;
    LightPlugin.Canvas.redraw();
    LightPlugin.UI.refreshLists();
  },

  // ---- SELEÇÃO / MOVE ----

  _startSelect(pos) {
    const hit = this._hitTest(pos);
    this._selected = hit ? hit.id : null;
    if (hit) LightPlugin.Control.selectObject("light", hit.id);
    else LightPlugin.Control.clearSelection();

    if (hit && !hit.fixed) {
      this._dragging  = true;
      this._dragOffX  = pos.x - hit.x;
      this._dragOffY  = pos.y - hit.y;
    }

    LightPlugin.Canvas.redraw();
    LightPlugin.UI.refreshLists();
    LightPlugin.UI.showObjectProperties(hit);
  },

  _updateDrag(pos) {
    const obj = LightPlugin.Model.lightObjects.find(o => o.id === this._selected);
    if (!obj || obj.fixed) return;

    obj.x = pos.x - this._dragOffX;
    obj.y = pos.y - this._dragOffY;
    LightPlugin.Canvas.redraw();
  },

  _endDrag() {
    this._dragging = false;
    LightPlugin.Model._save();
  },

  // ---- APAGAR ----

  _eraseAt(pos) {
    const hit = this._hitTest(pos);
    if (hit) {
      LightPlugin.Model.removeLight(hit.id);
      this._selected = null;
      LightPlugin.Canvas.redraw();
      LightPlugin.UI.refreshLists();
    }
  },

  // ---- HIT TEST ----

  _hitTest(pos) {
    const objs = LightPlugin.Model.lightObjects;
    // Inverso: testa do topo (último adicionado)
    for (let i = objs.length - 1; i >= 0; i--) {
      const o = objs[i];
      if (o.type === "rect") {
        if (pos.x >= o.x && pos.x <= o.x + o.w &&
            pos.y >= o.y && pos.y <= o.y + o.h) return o;
      } else if (o.type === "circle") {
        if (Math.hypot(pos.x - o.x, pos.y - o.y) <= o.r) return o;
      }
    }
    return null;
  },

  _pos(e) {
    const rect = document.getElementById("map-container").getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  },

  getSelected() { return this._selected; }
};
</script>
